<style>
:root{
  /* ROYAL INDIGO system — option B of three rendered candidates */
  --navy:#1C1834; --navy-2:#171430; --navy-3:#131022;
  --gold:#8B7BD8; --gold-2:#A99BE8; --gold-soft:#F2EFEA;
  --ivory:#F2EFEA; --ivory-2:#F2EFEA; --paper:#131022;
  --ink:#F2EFEA; --ink-2:#A9A3C2; --line:#2E2A4A;
  --ok:#6FBF9A; --warn:#D9B36A; --bad:#D98A94; --info:#7FA8D9;
  --r:14px; --sp:16px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{background:var(--paper);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(74px + var(--safe-b))}
h1{font:600 26px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px;letter-spacing:-.2px}
h2{font:600 19px/1.25 Georgia,serif;margin:26px 0 10px;color:var(--ivory)}
.sub{color:var(--ink-2);font-size:14px;margin:0 0 18px}
.wrap{padding:calc(14px + var(--safe-t)) var(--sp) 20px;max-width:760px;margin:0 auto}
header.top{background:#171430;color:var(--ivory-2);padding:calc(16px + var(--safe-t)) var(--sp) 18px;
  border-bottom:3px solid var(--gold)}
header.top h1{color:var(--ivory-2)}
header.top .sub{color:var(--gold-soft);margin:0}
.card{background:#1D1A33;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px;
  box-shadow:0 1px 3px rgba(0,0,0,.5)}
.card.lead{border-left:4px solid var(--gold)}
.card h3{margin:0 0 4px;font:600 17px/1.3 -apple-system,sans-serif}
.meta{color:var(--ink-2);font-size:14px;margin:3px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;
  border-radius:11px;border:1px solid #4A3F7A;background:#3A3168;color:#F2EFEA;
  font:600 15px/1 -apple-system,sans-serif;text-decoration:none;cursor:pointer}
.btn.gold{background:#8B7BD8;border-color:#8B7BD8;color:#131022}
.btn.ghost{background:transparent;color:var(--ivory);border-color:var(--line)}
.btn.wide{flex:1 1 130px}
.btn:active{transform:translateY(1px)}
.pill{display:inline-block;padding:4px 11px;border-radius:999px;font:600 12px/1.5 -apple-system,sans-serif;
  letter-spacing:.3px;text-transform:uppercase}
.p-ready{background:#1B3229;color:#8FD9B4} .p-call{background:#332A15;color:#E4C87A}
.p-near{background:#1B2638;color:#9FC0E8} .p-cust{background:#3A3168;color:#D9D2F2}
.p-dorm{background:#33191E;color:#E8A0A8} .p-audit{background:#221E38;color:var(--ink-2)}
.score{display:inline-flex;align-items:baseline;gap:3px;font:700 15px/1 Georgia,serif;color:var(--ivory)}
.score b{font-size:22px} .score.hi b{color:var(--ok)} .score.mid b{color:var(--warn)} .score.lo b{color:var(--ink-2)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 16px}
.stat div{background:#1D1A33;border:1px solid var(--line);color:var(--ivory);border-radius:var(--r);padding:14px}
.stat b{display:block;font:700 28px/1.1 Georgia,serif;color:var(--gold-2)}
.stat span{font-size:13px;letter-spacing:.3px;text-transform:uppercase;opacity:.85}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
  background:#171430;border-top:1px solid #2E2A4A;padding-bottom:var(--safe-b)}
nav.bot a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 2px 9px;
  color:#8A84A8;font:600 11px/1 -apple-system,sans-serif;text-decoration:none;letter-spacing:.2px}
nav.bot a.on{color:#F8F1E7} nav.bot svg{width:22px;height:22px;stroke-width:1.8}
.search{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:11px;
  font-size:16px;background:#1D1A33;color:var(--ivory);margin:0 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#1D1A33;
  font:600 14px/1 -apple-system,sans-serif;color:var(--ivory);cursor:pointer;white-space:nowrap}
.chip.on{background:#8B7BD8;color:#131022;border-color:#8B7BD8}
.empty{text-align:center;padding:44px 20px;color:var(--ink-2)}
.empty b{display:block;font:600 18px/1.3 Georgia,serif;color:var(--navy);margin-bottom:6px}
.skel{height:74px;border-radius:var(--r);background:linear-gradient(90deg,#1D1A33,#262242,#1D1A33);
  background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:10px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.warn{background:#332A15;border-left:4px solid var(--warn);padding:11px 13px;border-radius:9px;
  font-size:14px;color:#E9D6A4;margin:8px 0}
.field{background:#1B3229;border-left:4px solid var(--ok);padding:11px 13px;border-radius:9px;
  font-size:14px;color:#BCE3CD;margin:8px 0}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
details summary{cursor:pointer;font:600 15px/1.4 -apple-system,sans-serif;color:var(--ivory);padding:8px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'\25B8 ';color:var(--gold)}
details[open] summary::before{content:'\25BE '}
@media(min-width:820px){
  body{padding-bottom:0;padding-left:232px}
  nav.bot{top:0;bottom:0;right:auto;width:232px;grid-template-columns:1fr;grid-auto-rows:min-content;
    align-content:start;padding-top:calc(20px + var(--safe-t));border-right:1px solid var(--navy-3);border-top:0}
  nav.bot a{flex-direction:row;justify-content:flex-start;gap:12px;padding:14px 20px;font-size:14px}
  .stat{grid-template-columns:repeat(4,1fr)}
  .wrap{max-width:900px}
}

.crown{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#241E48,#1C1834);
 border:1px solid #4A3F7A;border-radius:var(--r);padding:16px;margin:0 0 14px;cursor:pointer}
.crown b{font:600 18px/1.3 Georgia,serif;color:#F2EFEA}
.crown .meta{color:#A99BE8}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 8px}
.hcard{background:#1D1A33;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.hcard b{display:block;font:700 24px/1.1 Georgia,serif;color:#A99BE8}
.hcard span{font:600 12px/1.4 -apple-system,sans-serif;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-2)}
.hcard .meta{margin-top:4px}
.src{background:#171430;border-radius:9px;padding:9px 12px;font-size:13px;color:var(--ink-2);margin:8px 0}
.src b{color:var(--ivory);font-weight:600}
@media(min-width:820px){.grid2{grid-template-columns:repeat(4,1fr)}}
</style>

function buildRoute(){
 const q=D.filter(s=>routable(s)&&s.sc>=55&&!skips[s.id]&&/VERIFIED NEW SHOP|EXISTING CUSTOMER|DORMANT|ACCOUNT EXISTS|INTRODUCE/.test(s.ps));
 const by={}; q.forEach(s=>{(by[s.town]=by[s.town]||[]).push(s)});
 let best=null;
 for(const t in by){const v=by[t].sort((a,b)=>b.sc-a.sc).slice(0,12);
  const sum=v.reduce((x,y)=>x+y.sc,0); if(!best||sum>best.sum)best={town:t,stops:v,sum}}
 if(!best)return{town:null,stops:[]};
 let ord=[best.stops.shift()];
 while(best.stops.length){const l=ord[ord.length-1];
  let bi=0,bd=Infinity;
  best.stops.forEach((s,i)=>{const d=dist(l.la,l.ln,s.la,s.ln);if(d<bd){bd=d;bi=i}});
  ord.push(best.stops.splice(bi,1)[0])}
 const used=new Set(ord.map(s=>s.id));
 ord.forEach(s=>{
  const near=D.filter(x=>!used.has(x.id)&&x.la!=null&&x.sc>=40&&actionable(x))
   .map(x=>[dist(s.la,s.ln,x.la,x.ln),x]).filter(t=>t[0]<=600)
   .sort((a,b)=>(b[1].sc-a[1].sc)||(a[0]-b[0]));
  if(near.length){s._bk=near[0][1];s._bkd=Math.round(near[0][0]);used.add(near[0][1].id)}});
 return{town:best.town,stops:ord}}

// Handoffs: Usamah's confirmed wins pass to the territory representative for
// continued follow-up. Discovery credit never moves; only the next responsibility does.

  const o=hand[s.id]||{};
  return {s,rep:REP,date:s.field.date,due:o.due||s.field.date,
   status:o.status||'Handed Over',log:o.log||[],
   kind:/REACTIVATED/.test(s.field.outcome)?'Dormant customer reactivated':(/NEW CUSTOMER/.test(s.field.outcome)?'New customer opened':'Order confirmed')}});

  return `<div class="card" onclick="go('aud:${encodeURIComponent(k)}')" style="cursor:pointer">

   <span class="score lo"><b>${n.toLocaleString()}</b></span></div></div>`}).join('')}
 <div class="card"><h3>Total preserved</h3><div class="meta">Every record ever collected for ${TITLE}, including rejected ones.</div>
  <div class="score hi"><b>${D.length.toLocaleString()}</b></div></div>
 </div>`}

function vAuditList(k){
 let L=D.filter(s=>s.ps.indexOf(k)===0||s.ps.includes(k));
 if(Q){const q=Q.toLowerCase();L=L.filter(s=>(s.n+' '+s.town).toLowerCase().includes(q))}
 return `<header class="top"><h1>${esc(k)}</h1><p class="sub">${L.length.toLocaleString()} preserved · never in a route</p></header><div class="wrap">
 <input class="search" id="q" placeholder="Search" value="${esc(Q)}">
 ${L.map(mini).join('')}
 </div>`}

// ---------- CUSTOMER 360 ----------
function vShop(id){
 const s=D.find(x=>x.id===id);
 if(!s)return '<div class="wrap"><div class="empty"><b>Record not found</b></div></div>';
 const[pc,pt]=pill(s); const v=visits[s.id]; const dr=routable(s);
 return `<header class="top"><h1>${esc(s.n)}</h1><p class="sub">${esc(s.town)}${s.cat?' · '+esc(s.cat):''}</p></header><div class="wrap">
 <div class="card lead">
  <div class="row" style="justify-content:space-between">
   <span class="pill ${pc}">${pt}</span>
   ${s.sc?`<span class="score ${scoreCls(s.sc)}"><b>${s.sc}</b>/100</span>`:''}
  </div>
  ${s.sw?`<div class="meta" style="margin-top:8px">${esc(s.sw)}</div>`:''}
  ${s.why?`<div class="meta">${esc(s.why)}</div>`:''}
  <div class="row" style="margin-top:12px">
   ${s.p?`<a class="btn wide" href="tel:${tel(s.p)}">Call ${tel(s.p)}</a>`:''}
   ${s.p?`<a class="btn ghost wide" href="https://wa.me/1868${s.p}" target="_blank" rel="noopener">WhatsApp</a>`:''}
   ${dr?`<a class="btn gold wide" href="${s.g||('https://www.google.com/maps/dir/?api=1&destination='+s.la+','+s.ln)}" target="_blank" rel="noopener">Directions</a>`:''}
  </div>
  ${!dr&&s.pl>=4?`<div class="warn">${esc(LOC[s.pl])} — no Directions until the entrance is confirmed.</div>`:''}
 </div>
 <div class="card"><h3>YOL</h3><div class="meta">${s.yol?('Customer since / last order '+esc(s.yol)):'No YOL purchase history found'}</div></div>
 <div class="card"><h3>MYCO</h3><div class="meta">${s.myco?('Customer since / last order '+esc(s.myco)):'No MYCO purchase history found'}</div></div>
 ${s.field?`<div class="card"><h3>Field visit</h3>
   <div class="field"><b>${esc(s.field.by)} · ${esc(s.field.date)} ${esc(s.field.time||'')}</b><br>${esc(s.field.outcome)}${s.field.orders?' — orders: '+esc(s.field.orders):''}</div>
   ${s.field.note?`<div class="meta">${esc(s.field.note)}</div>`:''}</div>`:''}
 ${v?`<div class="card"><h3>Your log</h3><div class="field"><b>${esc(v.outcome)}</b> · ${esc(v.date)}${v.note?'<br>'+esc(v.note):''}</div></div>`:''}
 <div class="card"><h3>Evidence</h3>
  <div class="meta">Source: ${esc(s.src||'not recorded')}</div>
  ${s.ev?`<div class="meta">${esc(s.ev)}</div>`:''}
  ${s.pid?`<div class="meta">Google ID: ${esc(s.pid)}</div>`:''}
  ${s.rev?`<div class="meta">${esc(String(s.rev))} Google reviews</div>`:''}
  ${s.lt?`<div class="meta">Link test: ${esc(s.lt)}</div>`:''}
  <div class="meta">Location: ${esc(LOC[s.pl]||'unknown')}</div>
 </div>
 <details class="card"><summary>Location history — nothing overwritten</summary>
  ${s.la!=null?`<div class="meta">Book pin: ${s.la}, ${s.ln}</div>`:'<div class="meta">No book pin</div>'}
  ${s.rpin?`<div class="meta">Rep pin: ${s.rpin.lat}, ${s.rpin.lng}${s.rpin.reps?' — '+esc((s.rpin.reps||[]).join(', ')):''}</div>`:''}
  ${s.fpin?`<div class="meta">Field pin (${esc(s.fpin.by)}, ${esc(s.fpin.date)}): ${s.fpin.lat}, ${s.fpin.lng}</div>`:''}
  ${v&&v.pin?`<div class="meta">Your saved pin (${esc(v.pinDate||'')}): ${v.pin.lat}, ${v.pin.lng}</div>`:''}
 </details>
 <div class="card"><h3>Record visit</h3>
  <div class="row">${OUTCOMES.map(o=>`<button class="chip" onclick="logVisit('${s.id}','${o}')">${o}</button>`).join('')}</div>
  <div class="row" style="margin-top:10px">
   <button class="btn ghost wide" onclick="saveHere('${s.id}')">Save my location as this shop's pin</button>
  </div>
 </div>
 <div class="row"><button class="btn ghost wide" onclick="history.back()">Back</button></div>
 </div>`}

// ---------- AREAS: territory -> area -> business ----------
function vAreas(){
 const by={};D.forEach(s=>{const t=s.town||'Area unrecorded';(by[t]=by[t]||[]).push(s)});
 let towns=Object.entries(by).map(([t,v])=>({t,n:v.length,
   cust:v.filter(isCust).length,
   a:v.filter(x=>x.t==='A').length,
   b:v.filter(x=>x.t==='B').length,
   dorm:v.filter(x=>(x.eng||[]).includes('dormant')).length}))
  .sort((a,b)=>b.n-a.n);
 if(Q){const q=Q.toLowerCase();towns=towns.filter(x=>x.t.toLowerCase().includes(q))}
 return `<header class="top"><h1>Areas</h1><p class="sub">${towns.length} areas in ${TITLE}</p></header><div class="wrap">
 <input class="search" id="q" placeholder="Search area or town" value="${esc(Q)}">
 ${towns.map(x=>`<div class="card" onclick="go('area:${encodeURIComponent(x.t)}')" style="cursor:pointer">
  <div class="row" style="justify-content:space-between"><h3>${esc(x.t)}</h3><span class="score"><b>${x.n.toLocaleString()}</b></span></div>
  <div class="meta">${x.cust} customers · ${x.a} Tier A ready · ${x.b} Tier B call first · ${x.dorm} dormant</div>
 </div>`).join('')}</div>`}
let AF='';
function vArea(town){
 const L0=D.filter(s=>(s.town||'Area unrecorded')===town);
 const F=[['','All'],['cust','Customers'],['ready','Ready to visit'],['call','Call first'],
  ['dorm','Dormant'],['noorder','No order'],['myco','Introduce MYCO'],['fu','Follow-ups'],['audit','Audit']];
 const fn={cust:isCust,ready:s=>/VERIFIED NEW SHOP/.test(s.ps),call:s=>/CALL FIRST/.test(s.ps),
  dorm:s=>(s.eng||[]).includes('dormant'),noorder:s=>(s.eng||[]).includes('noorder'),
  myco:s=>(s.eng||[]).includes('cross_myco'),fu:s=>/FOLLOW-UP|DECISION-MAKER/.test(s.ps),
  audit:s=>!actionable(s),
  tA:s=>s.t==='A',tB:s=>s.t==='B',tC:s=>s.t==='C',tD:s=>s.t==='D',
  look:s=>(s.t==='A'||s.t==='B')&&s.simt>=3,
  newd:s=>s.t&&s.dt&&new Date(s.dt)>Date.now()-7*864e5};
 let L=AF?L0.filter(fn[AF]||(()=>true)):L0;
 if(Q){const q=Q.toLowerCase();L=L.filter(s=>(s.n+' '+(s.p||'')+' '+s.cat).toLowerCase().includes(q))}
 L=L.slice().sort((a,b)=>(b.sc||0)-(a.sc||0));
 const adv=ADV.filter(a=>{const r=a.sid&&D.find(x=>x.id===a.sid);return r&&(r.town||'')===town});
 const tg=[['tA','Tier A — Ready to Visit'],['tB','Tier B — Call First'],['tC','Tier C — Check Nearby'],['tD','Research Queue'],['look','Lookalikes'],['newd','Newly Discovered']]
  .map(([k,t])=>[k,t,L0.filter(fn[k]).length]);
 return `<header class="top"><h1>${esc(town)}</h1><p class="sub">${L0.length.toLocaleString()} records · ${L0.filter(isCust).length} customers · last field visit ${adv.length?esc(adv[adv.length-1].date):'none recorded'}</p></header><div class="wrap">
 <h2 style="margin-top:4px">New genuine prospects — ${esc(town)}</h2>
 <div class="grid2">${tg.map(([k,t,n])=>`<div class="hcard${AF===k?' on':''}" onclick="setAF('${k}',1)"><b>${n.toLocaleString()}</b><span>${t}</span></div>`).join('')}</div>
 <div class="chips">${F.map(([k,t])=>`<button class="chip${AF===k?' on':''}" onclick="setAF('${k}')">${t}</button>`).join('')}</div>
 <input class="search" id="q" placeholder="Search this area" value="${esc(Q)}">
 ${L.map(mini).join('')||'<div class="empty"><b>Nothing matches</b></div>'} 
 </div>`}
// ---------- DISCOVER: continuous prospect engine ----------
const TIERN={A:'Ready to Visit',B:'Call First',C:'Check While Nearby',D:'Research Required'};
const ACTN={A:'Visit — destination tested',B:'Call to confirm trade and buyer before driving',C:'Check only while already nearby',D:'Research before any action'};
const ROOTN={grocery:'Grocery / mini mart',pharmacy:'Pharmacy',beauty:'Beauty / hair',herbal:'Herbal / health',puja:'Puja / incense',pet:'Pet',liquor:'Liquor / bar-mart',variety:'Variety / general',other:'Other target'};
let DF={t:'',rt:''};
function vDiscover(){
 let L=D.filter(s=>s.t);
 if(DF.t)L=L.filter(s=>s.t===DF.t);
 if(DF.rt)L=L.filter(s=>s.rt===DF.rt);
 if(Q){const q=Q.toLowerCase();L=L.filter(s=>(s.n+' '+s.town+' '+(s.ad||'')+' '+(s.p||'')).toLowerCase().includes(q))}
 L=L.slice().sort((a,b)=>(a.t<b.t?-1:a.t>b.t?1:(b.sc||0)-(a.sc||0)));
 const roots=[...new Set(D.filter(s=>s.t).map(s=>s.rt))];
 return `<header class="top"><h1>Discover</h1><p class="sub">${L.length.toLocaleString()} prospects · matched against confirmed buying customers, checked against YOL and MYCO</p></header><div class="wrap">
 <div class="chips">${['','A','B','C','D'].map(t=>`<button class="chip${DF.t===t?' on':''}" onclick="setDF('t','${t}')">${t?('Tier '+t):'All tiers'}</button>`).join('')}</div>
 <div class="chips">${['',...roots].map(r=>`<button class="chip${DF.rt===r?' on':''}" onclick="setDF('rt','${r}')">${r?(ROOTN[r]||r):'All categories'}</button>`).join('')}</div>
 <input class="search" id="q" placeholder="Search name, area, road or phone" value="${esc(Q)}">
 ${L.map(mini).join('')||'<div class="empty"><b>Nothing matches these filters</b></div>'} 
 </div>`}
function vFD(){
 return `<header class="top"><h1>Field Discovery Required</h1><p class="sub">${FD.length} areas with buying customers or field pins but no online-verifiable prospects — online results are weak here, not the area</p></header><div class="wrap">
 ${FD.map(t=>`<div class="card" onclick="go('area:${encodeURIComponent(t)}')" style="cursor:pointer"><h3>${esc(t)}</h3><div class="meta">Walk or drive this area — record every genuine shop found as a new record</div></div>`).join('')||'<div class="empty"><b>None — every active area has verified prospects</b></div>'}
 </div>`}
function vLike(id){
 const s=D.find(x=>x.id===id);
 if(!s)return '<div class="wrap"><div class="empty"><b>Record not found</b></div></div>';
 const root=s.rt&&s.rt!=='other'?s.rt:null;
 let L=D.filter(x=>x.id!==id&&x.t&&(root?x.rt===root:true));
 L.sort((a,b)=>(a.t<b.t?-1:a.t>b.t?1:(b.sc||0)-(a.sc||0)));
 return `<header class="top"><h1>Similar businesses</h1><p class="sub">${L.length} prospects in the same business category as ${esc(s.n)} — similarity is a lead, not proof</p></header><div class="wrap">
 ${L.map(mini).join('')||'<div class="empty"><b>No verified lookalikes yet</b></div>'}
 <div class="row"><button class="btn ghost wide" onclick="go('disc')">Back to Discover</button></div>
 </div>`}

// ---------- ROUTER ----------
let VIEW='today', Q='', SHOP=null;
function go(v){VIEW=v;Q='';window.scrollTo(0,0);render()}
function openShop(id){SHOP=id;VIEW='shop';window.scrollTo(0,0);render()}
function skip(id){skips[id]=1;SAVE(KEY+'_skips',skips);render()}
const ICON={today:'M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10',
 route:'M4 19c4-1 4-6 8-6s4 5 8 4M6 5a2 2 0 100 4 2 2 0 000-4zm12 8a2 2 0 100 4 2 2 0 000-4z',
 areas:'M9 20l-6-2V4l6 2m0 14l6-2m-6 2V6m6 12l6 2V6l-6-2m0 14V4M9 6l6-2',
 disc:'M10.5 4a6.5 6.5 0 104.6 11.1L21 21m-5.9-5.9A6.5 6.5 0 0010.5 4z',
 opp:'M12 2l2.9 6.3 6.9.6-5.2 4.6 1.6 6.7L12 16.9 5.8 20.2l1.6-6.7L2.2 8.9l6.9-.6z',
 follow:'M12 8v5l3 2M12 22a10 10 0 110-20 10 10 0 010 20z',
 more:'M5 12a1 1 0 102 0 1 1 0 00-2 0zm6 0a1 1 0 102 0 1 1 0 00-2 0zm6 0a1 1 0 102 0 1 1 0 00-2 0z'};
function nav(){
 const items=[['today','Today'],['route','Route'],['areas','Areas'],['disc','Discover'],['more','More']];
 return `<nav class="bot">${items.map(([k,t])=>`<a class="${VIEW===k||(k==='more'&&['customers','fieldwork','audit'].includes(VIEW))?'on':''}" onclick="go('${k}')">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[k]||ICON.more}"/></svg>${t}</a>`).join('')}</nav>`}
function vMore(){
 return `<header class="top"><h1>More</h1><p class="sub">${TITLE} · ${D.length.toLocaleString()} records preserved</p></header><div class="wrap">
 ${[['hand','Handoffs','Customers handed to the representative'],['opp','Opportunities','Seven engines, ranked by evidence'],['follow','Follow-ups','Nothing disappears when its date passes'],['customers','Customers','Every account with history'],['fieldwork','Fieldwork','Visits logged in person'],
    ['audit','Audit','Everything preserved, nothing recommended']].map(([k,t,d])=>
  `<div class="card" onclick="go('${k}')" style="cursor:pointer"><h3>${t}</h3><div class="meta">${d}</div></div>`).join('')}
 <div class="card"><h3>Repair app</h3><div class="meta">Clears the cached copy on this phone and reloads the newest build.</div>
  <div class="row" style="margin-top:8px"><button class="btn ghost wide" onclick="repair()">Repair now</button></div></div>
 </div>`}
async function repair(){try{const ks=await caches.keys();for(const k of ks)await caches.delete(k)}catch(e){}
 localStorage.removeItem(KEY+'_cache');location.reload()}
function setAF(k,tog){AF=tog&&AF===k?"":k;render()}
function setDF(f,v){DF[f]=v;render()}
window.setAF=setAF;window.setDF=setDF;
window.go=go;window.openShop=openShop;window.skip=skip;window.logVisit=logVisit;
window.saveHere=saveHere;window.repair=repair;
function render(){
 let h='';
 if(VIEW==='today')h=vToday();else if(VIEW==='route')h=vRoute();
 else if(VIEW==='opp')h=vOpp();else if(VIEW==='follow')h=vFollow();
 else if(VIEW==='more')h=vMore();else if(VIEW==='customers')h=vCustomers();
 else if(VIEW==='fieldwork')h=vFieldwork();else if(VIEW==='audit')h=vAudit();
 else if(VIEW==='shop')h=vShop(SHOP);
 else if(VIEW==='areas')h=vAreas();else if(VIEW==='hand')h=vHandoffs();else if(VIEW.startsWith('list:'))h=vList(VIEW.slice(5));else if(VIEW==='disc')h=vDiscover();else if(VIEW==='fd')h=vFD();else if(VIEW.startsWith('area:'))h=vArea(decodeURIComponent(VIEW.slice(5)));else if(VIEW.startsWith('like:'))h=vLike(VIEW.slice(5));else if(VIEW.startsWith('eng:'))h=vEngine(VIEW.slice(4));
 else if(VIEW.startsWith('aud:'))h=vAuditList(decodeURIComponent(VIEW.slice(4)));
 else h=vToday();
 document.getElementById('app').innerHTML=h+nav();
 const q=document.getElementById('q');
 if(q){q.oninput=e=>{Q=e.target.value;clearTimeout(window._qd);window._qd=setTimeout(()=>{render();
  const q2=document.getElementById('q');if(q2){q2.focus();q2.setSelectionRange(q2.value.length,q2.value.length)}},250)}}}
render();
 })();})
 .catch(e=>{document.getElementById('app').innerHTML='<div class="wrap"><div class="empty"><b>Could not load data</b>'+e+'</div></div>'});
</script>
</body></html>
