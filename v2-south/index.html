function buildRoute(){
 const q=D.filter(s=>routable(s)&&s.sc>=55&&!skips[s.id]&&/VERIFIED NEW SHOP|EXISTING CUSTOMER|DORMANT|ACCOUNT EXISTS|INTRODUCE/.test(s.ps));
 const by={}; q.forEach(s=>{(by[s.town]=by[s.town]||[]).push(s)});
 let best=null;
 for(const t in by){const v=by[t].sort((a,b)=>b.sc-a.sc).slice(0,12);
  const sum=v.reduce((x,y)=>x+y.sc,0); if(!best||sum>best.sum)best={town:t,stops:v,sum}}
 if(!best)return{town:null,stops:[]};
 let ord=[best.stops.shift()];
 while(best.stops.length){const l=ord[ord.length-1];
  let bi=0,bd=Infinity;
  best.stops.forEach((s,i)=>{const d=dist(l.la,l.ln,s.la,s.ln);if(d<bd){bd=d;bi=i}});
  ord.push(best.stops.splice(bi,1)[0])}
 const used=new Set(ord.map(s=>s.id));
 ord.forEach(s=>{
  const near=D.filter(x=>!used.has(x.id)&&x.la!=null&&x.sc>=40&&actionable(x))
   .map(x=>[dist(s.la,s.ln,x.la,x.ln),x]).filter(t=>t[0]<=600)
   .sort((a,b)=>(b[1].sc-a[1].sc)||(a[0]-b[0]));
  if(near.length){s._bk=near[0][1];s._bkd=Math.round(near[0][0]);used.add(near[0][1].id)}});
 return{town:best.town,stops:ord}}

function vCoverage(){
 const L=COVST.ledger;
 const kv=(k,v)=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`;
 return `<header class="top"><h1>Coverage</h1><p class="sub">${TITLE} — the permanent area ledger drives discovery; no area is called finished off one empty search</p></header><div class="wrap">
 <div class="panel"><b>AREA MASTER LIST — ${TITLE.split(' ')[0].toUpperCase()}</b>
 ${kv('Areas in master list',COVST.areas)}
 ${kv('Never searched',COVST.never)}
 ${kv('Partially searched',COVST.partial)}
 ${kv('Well searched',COVST.well)}
 ${kv('Real areas beyond OpenStreetMap',COVST.beyond_osm)}
 ${kv('Possible-same-area pairs (review, never merged)',COVST.review_pairs)}
 </div>
 <div class="panel"><b>SETTLEMENT RESEARCH STATUS</b>
 ${Object.entries(L).map(([k,v])=>kv(k,v)).join('')}
 </div>
 <div class="panel"><b>SEARCH QUEUES</b>
 ${kv('Queue A — customer locations',DISCST.a.done.toLocaleString()+' of '+DISCST.a.q.toLocaleString())}
 ${kv('Queue B — unexplored areas',DISCST.b.done.toLocaleString()+' of '+DISCST.b.q.toLocaleString())}
 ${kv('Stage 3 — social-business searches',COVST.socd+' of '+COVST.socq)}
 </div>
 <div class="row"><button class="btn ghost wide" onclick="go('fd')">Field-discovery areas</button></div>
 </div>`}
function vMore(){
 return `<header class="top"><h1>More</h1><p class="sub">${TITLE} · ${D.length.toLocaleString()} records preserved</p></header><div class="wrap">
 ${[['coverage','Coverage','Area master list and discovery progress'],['hand','Handoffs','Customers handed to the representative'],['opp','Opportunities','Seven engines, ranked by evidence'],['follow','Follow-ups','Nothing disappears when its date passes'],['customers','Customers','Every account with history'],['fieldwork','Fieldwork','Visits logged in person'],
    ['audit','Audit','Everything preserved, nothing recommended']].map(([k,t,d])=>
  `<div class="card" onclick="go('${k}')" style="cursor:pointer"><h3>${t}</h3><div class="meta">${d}</div></div>`).join('')}
 <div class="card"><h3>Repair app</h3><div class="meta">Clears the cached copy on this phone and reloads the newest build.</div>
  <div class="row" style="margin-top:8px"><button class="btn ghost wide" onclick="repair()">Repair now</button></div></div>
 </div>`}
async function repair(){try{const ks=await caches.keys();for(const k of ks)await caches.delete(k)}catch(e){}
 localStorage.removeItem(KEY+'_cache');location.reload()}
window.go=go;window.navGo=navGo;window.clearQ=clearQ;window.goBack=goBack;window.openShop=openShop;window.openSheet=openSheet;window.closeSheet=closeSheet;window.skip=skip;window.logVisit=logVisit;window.setF=setF;window.setOnly=setOnly;window.setCat=setCat;window.clearF=clearF;window.openFilters=openFilters;window.closeFilters=closeFilters;window.reFilters=reFilters;window.setSort=setSort;window.openSort=openSort;
window.saveHere=saveHere;window.repair=repair;
function render(){
 let h='';
 if(VIEW==='today')h=vToday();else if(VIEW==='route')h=vRoute();
 else if(VIEW==='opp')h=vOpp();else if(VIEW==='follow')h=vFollow();
 else if(VIEW==='more')h=vMore();else if(VIEW==='customers')h=vCustomers();
 else if(VIEW==='fieldwork')h=vFieldwork();else if(VIEW==='audit')h=vAudit();
 else if(VIEW==='areas')h=vAreas();else if(VIEW==='hand')h=vHandoffs();
 else if(VIEW.startsWith('list:'))h=vList(VIEW.slice(5));
 else if(VIEW==='disc')h=vDiscover();else if(VIEW==='fd')h=vFD();else if(VIEW==='coverage')h=vCoverage();
 else if(VIEW.startsWith('area:'))h=vArea(decodeURIComponent(VIEW.slice(5)));
 else if(VIEW.startsWith('like:'))h=vLike(VIEW.slice(5));
 else if(VIEW.startsWith('eng:'))h=vEngine(VIEW.slice(4));
 else if(VIEW.startsWith('aud:'))h=vAuditList(decodeURIComponent(VIEW.slice(4)));
 else h=vToday();
 document.getElementById('app').innerHTML=h+nav();
 const q=document.getElementById('q');
 if(q){q.oninput=e=>{Q=e.target.value;CAP=150;clearTimeout(window._qd);window._qd=setTimeout(()=>{render();
  const q2=document.getElementById('q');if(q2){q2.focus();q2.setSelectionRange(q2.value.length,q2.value.length)}},150)}}
 const ss=document.getElementById('sortsel');
 if(ss)ss.onchange=e=>setSort(e.target.value);
 bindMore();updateBack()}
render();
 })();})
 .catch(e=>{document.getElementById('app').innerHTML='<div class="wrap"><div class="empty"><b>Could not load data</b>'+e+'</div></div>'});
</script>
</body></html>
