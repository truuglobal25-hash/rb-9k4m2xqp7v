function buildRoute(){
 const q=D.filter(s=>routable(s)&&s.sc>=55&&!skips[s.id]&&/VERIFIED NEW SHOP|EXISTING CUSTOMER|DORMANT|ACCOUNT EXISTS|INTRODUCE/.test(s.ps));
 const by={}; q.forEach(s=>{(by[s.town]=by[s.town]||[]).push(s)});
 let best=null;
 for(const t in by){const v=by[t].sort((a,b)=>b.sc-a.sc).slice(0,12);
  const sum=v.reduce((x,y)=>x+y.sc,0); if(!best||sum>best.sum)best={town:t,stops:v,sum}}
 if(!best)return{town:null,stops:[]};
 let ord=[best.stops.shift()];
 while(best.stops.length){const l=ord[ord.length-1];
  let bi=0,bd=Infinity;
  best.stops.forEach((s,i)=>{const d=dist(l.la,l.ln,s.la,s.ln);if(d<bd){bd=d;bi=i}});
  ord.push(best.stops.splice(bi,1)[0])}
 const used=new Set(ord.map(s=>s.id));
 ord.forEach(s=>{
  const near=D.filter(x=>!used.has(x.id)&&x.la!=null&&x.sc>=40&&actionable(x))
   .map(x=>[dist(s.la,s.ln,x.la,x.ln),x]).filter(t=>t[0]<=600)
   .sort((a,b)=>(b[1].sc-a[1].sc)||(a[0]-b[0]));
  if(near.length){s._bk=near[0][1];s._bkd=Math.round(near[0][0]);used.add(near[0][1].id)}});
 return{town:best.town,stops:ord}}

 ${s.mr?`<div class="warn">Location match by phone only — the listing name differs from this record. Review before trusting; not promoted.</div>`:''}
 ${s.lf&&!s.rl?`<div class="warn">${esc(s.lf)} — in the location-repair queue.${(s.yol||s.myco)?' Existing customer: history preserved, kept out of driving routes until confirmed.':''}</div>`:''}
 ${!dr&&s.pl>=4?`<div class="warn">${esc(LOC[s.pl])} — no Directions until the entrance is confirmed.</div>`:''}
 ${(s.yol||s.myco)&&s.pl>=4&&s.p?`<a class="btn wide" href="https://wa.me/1868${s.p}?text=${encodeURIComponent('Good day! Yusuf Overseas here. Please share your shop location pin on WhatsApp so our delivery reaches the right entrance. Thank you!')}" target="_blank" rel="noopener">Request customer pin on WhatsApp</a>`:''}
 ${/POSSIBLE SAME/.test(s.ps)?`<div class="warn">Possible duplicate of another record — never auto-merged. Review before treating as separate.</div>`:''}
 ${s.field?`<div class="field"><b>Field visit · ${esc(s.field.date)}</b><br>${esc(s.field.outcome)}${s.field.orders?' — orders: '+esc(s.field.orders):''}${s.field.note?'<br>'+esc(s.field.note):''}</div>`:''}
 ${v?`<div class="field"><b>Logged: ${esc(v.outcome)}</b> · ${esc(v.date)}${v.note?'<br>'+esc(v.note):''}</div>`:''}
 ${follows[s.id]?`<div class="warn">Follow-up: ${esc(follows[s.id].reason)} · created ${esc(follows[s.id].created)}</div>`:''}
 ${s.why?`<details><summary>Why this status</summary><div class="meta">${esc(s.why)}</div></details>`:''}
 <details><summary>Location history — nothing overwritten</summary>
  ${s.la!=null?`<div class="meta">Book pin: ${s.la}, ${s.ln}</div>`:'<div class="meta">No book pin</div>'}
  ${s.rpin?`<div class="meta">Rep pin: ${s.rpin.lat}, ${s.rpin.lng}</div>`:''}
  ${s.fpin?`<div class="meta">Field pin (${esc(s.fpin.date)}): ${s.fpin.lat}, ${s.fpin.lng}</div>`:''}
  ${v&&v.pin?`<div class="meta">Saved pin (${esc(v.pinDate||'')}): ${v.pin.lat}, ${v.pin.lng}</div>`:''}
 </details>
 <details><summary>Record visit outcome</summary>
  <div class="chips">${OUTCOMES.map(o=>`<button class="chip" onclick="logVisit('${s.id}','${o}')">${o}</button>`).join('')}</div>
  <button class="btn ghost wide" onclick="saveHere('${s.id}')">Save my location as this shop's pin</button>
 </details>
 ${s.t?`<button class="btn wide" onclick="closeSheet();go('like:${s.id}')">Find similar businesses</button>`:''}
 <div class="stick">
  ${s.p?`<a class="btn ghost" href="tel:${tel(s.p)}">Call</a>`:''}
  ${s.p?`<a class="btn ghost" href="https://wa.me/1868${s.p}" target="_blank" rel="noopener">WhatsApp</a>`:''}
  ${dr?`<a class="btn gold" href="${s.g||('https://www.google.com/maps/dir/?api=1&destination='+s.la+','+s.ln)}" target="_blank" rel="noopener">Directions</a>`:''}
  <button class="btn ghost" onclick="logVisit('${s.id}','Follow-up again')">Follow-up</button>
 </div></div>`;
 document.body.appendChild(d)}
function topFab(){
 let f=document.getElementById('topfab');
 if(!f){f=document.createElement('button');f.id='topfab';f.textContent='↑';f.onclick=()=>scrollTo({top:0,behavior:'smooth'});document.body.appendChild(f);
  addEventListener('scroll',()=>{f.style.display=scrollY>700?'flex':'none'},{passive:true})}}
function updateBack(){topFab();
 let bb=document.getElementById('backbtn');
 if(!bb){bb=document.createElement('button');bb.id='backbtn';bb.textContent='‹';
  bb.onclick=goBack;document.body.appendChild(bb)}
 const show=SHOP||VIEW!=='today';
 bb.style.display=show?'flex':'none';
 document.body.classList.toggle('hasback',!!show)}

 </div>
 <div class="panel"><b>SETTLEMENT RESEARCH STATUS</b>

 <div class="panel"><b>SEARCH QUEUES</b>

 <div class="card"><h3>Repair app</h3><div class="meta">Clears the cached copy on this phone and reloads the newest build.</div>

 localStorage.removeItem(KEY+'_cache');location.reload()}
window.go=go;window.navGo=navGo;window.clearQ=clearQ;window.goBack=goBack;window.openShop=openShop;window.openSheet=openSheet;window.closeSheet=closeSheet;window.skip=skip;window.logVisit=logVisit;window.setF=setF;window.setOnly=setOnly;window.setCat=setCat;window.clearF=clearF;window.openFilters=openFilters;window.closeFilters=closeFilters;window.reFilters=reFilters;window.setSort=setSort;window.openSort=openSort;
window.saveHere=saveHere;window.repair=repair;

 else if(VIEW.startsWith('list:'))h=vList(VIEW.slice(5));
 else if(VIEW==='disc')h=vDiscover();else if(VIEW==='fd')h=vFD();else if(VIEW==='coverage')h=vCoverage();
 else if(VIEW.startsWith('area:'))h=vArea(decodeURIComponent(VIEW.slice(5)));
 else if(VIEW.startsWith('like:'))h=vLike(VIEW.slice(5));

 else h=vToday();
 document.getElementById('app').innerHTML=h+nav();
 const q=document.getElementById('q');

 if(ss)ss.onchange=e=>setSort(e.target.value);
 bindMore();updateBack()}
render();
 })();})
 .catch(e=>{document.getElementById('app').innerHTML='<div class="wrap"><div class="empty"><b>Could not load data</b>'+e+'</div></div>'});
