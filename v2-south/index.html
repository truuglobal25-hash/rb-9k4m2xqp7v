// ---------- ROUTE BUILDER: only genuinely qualified stops, each with a real backup ----------
function buildRoute(){
 const q=D.filter(s=>routable(s)&&s.sc>=55&&!skips[s.id]&&/VERIFIED NEW SHOP|EXISTING CUSTOMER|DORMANT|ACCOUNT EXISTS|INTRODUCE/.test(s.ps));
 const by={}; q.forEach(s=>{(by[s.town]=by[s.town]||[]).push(s)});
 let best=null;
 for(const t in by){const v=by[t].sort((a,b)=>b.sc-a.sc).slice(0,12);
  const sum=v.reduce((x,y)=>x+y.sc,0); if(!best||sum>best.sum)best={town:t,stops:v,sum}}
 if(!best)return{town:null,stops:[]};
 let ord=[best.stops.shift()];
 while(best.stops.length){const l=ord[ord.length-1];
  let bi=0,bd=Infinity;
  best.stops.forEach((s,i)=>{const d=dist(l.la,l.ln,s.la,s.ln);if(d<bd){bd=d;bi=i}});
  ord.push(best.stops.splice(bi,1)[0])}
 const used=new Set(ord.map(s=>s.id));
 ord.forEach(s=>{
  const near=D.filter(x=>!used.has(x.id)&&x.la!=null&&x.sc>=40&&actionable(x))
   .map(x=>[dist(s.la,s.ln,x.la,x.ln),x]).filter(t=>t[0]<=600)
   .sort((a,b)=>(b[1].sc-a[1].sc)||(a[0]-b[0]));
  if(near.length){s._bk=near[0][1];s._bkd=Math.round(near[0][0]);used.add(near[0][1].id)}});
 return{town:best.town,stops:ord}}
// ---------- FIELDWORK: fast logging, queued when offline ----------
// Handoffs: Usamah's confirmed wins pass to the territory representative for
// continued follow-up. Discovery credit never moves; only the next responsibility does.
let hand=LS(KEY+'_hand',{});
function handoffs(){
 const base=D.filter(s=>s.field&&/ORDER|REACTIVATED/.test(s.field.outcome)).map(s=>{
  const o=hand[s.id]||{};
  return {s,rep:REP,date:s.field.date,due:o.due||s.field.date,
   status:o.status||'Handed Over',log:o.log||[],
   kind:/REACTIVATED/.test(s.field.outcome)?'Dormant customer reactivated':(/NEW CUSTOMER/.test(s.field.outcome)?'New customer opened':'Order confirmed')}});
 return base}
function repQueue(){
 return D.filter(s=>(/FOLLOW-UP|DECISION-MAKER/.test(s.ps)||(s.field&&/FOLLOW-UP|UNAVAILABLE/.test(s.field.outcome)))
   &&!(hand[s.id]&&hand[s.id].status==='Completed'))}
function setHand(id,status){
 const o=hand[id]||{log:[]};o.status=status;o.log=(o.log||[]).concat([{status,date:new Date().toISOString().slice(0,10)}]);
 hand[id]=o;SAVE(KEY+'_hand',hand);render()}
window.setHand=setHand;

function searchAll(base){
 const q=Q.toLowerCase();
 return base.filter(s=>(s.n+' '+(s.town||'')+' '+(s.ad||'')+' '+(s.p||'')+' '+(s.cat||'')+' '+(s.src||'')+' '+(s.ps||'')+' '+(s.why||'')).toLowerCase().includes(q))}
function applyAll(base){
 let L=base;
 if(FILT.size)L=L.filter(s=>[...FILT].some(k=>FN[k](s)));
 if(CATF.size)L=L.filter(s=>CATF.has(s.rt));
 if(Q)L=searchAll(L);
 return L.slice().sort(SORTF[SORT]||SORTF.pot)}
function listBody(base){
 const L=applyAll(base);
 return `<div class="homesearch"><input id="q" placeholder="Search all ${base.length.toLocaleString()} records…" autocomplete="off" value="${esc(Q)}">${Q?'<button class="qclear" onclick="clearQ()">✕</button>':''}</div>
 <div class="frow"><button class="fchip${!FILT.size?' on':''}" onclick="setOnly('allrec')">All</button>
 ${QUICKF.map(([k,l])=>`<button class="fchip${FILT.has(k)?' on':''}" onclick="setF('${k}')">${l}</button>`).join('')}</div>
 <div class="ctl"><button class="fchip" onclick="openSort()">Sort: ${SORTN[SORT]} ▾</button>
 <button class="fchip${FILT.size+CATF.size?' on':''}" onclick="openFilters()">Filters${FILT.size+CATF.size?' · '+(FILT.size+CATF.size):''}</button></div>
 ${Q||FILT.size||CATF.size?`<div class="count">${L.length.toLocaleString()} of ${base.length.toLocaleString()} match</div>`:''}
 ${listChunk(L)}`}
function listChunk(L){
 window._L=L;
 const done=L.length<=CAP;
 return `<div class="count" id="showing">${done?`All ${L.length.toLocaleString()} records available`:`${Math.min(CAP,L.length).toLocaleString()} of ${L.length.toLocaleString()} loaded — more load as you scroll`}</div>
 <div id="lc">${L.slice(0,CAP).map(mini).join('')||`<div class="empty"><b>Nothing matches</b>${Q?`No record matches "${esc(Q)}" in this scope — every record was searched. Try fewer words or clear the filters.`:'Adjust the filters.'}</div>`}</div>
 ${!done?'<div id="moresent" class="count" style="height:44px;text-align:center">Loading more…</div>':(L.length?'<div class="count" style="text-align:center">End of list — all records shown</div>':'')}`}
function bindMore(){
 const m=document.getElementById('moresent');if(!m)return;
 const io=new IntersectionObserver(es=>{
  if(!es[0].isIntersecting)return;io.disconnect();
  const L=window._L||[];const next=L.slice(CAP,CAP+250);CAP+=250;
  const lc=document.getElementById('lc');if(lc)lc.insertAdjacentHTML('beforeend',next.map(mini).join(''));
  const sh=document.getElementById('showing');if(sh)sh.textContent=CAP>=L.length?`All ${L.length.toLocaleString()} records available`:`${Math.min(CAP,L.length).toLocaleString()} of ${L.length.toLocaleString()} loaded — more load as you scroll`;
  if(CAP>=L.length){m.outerHTML='<div class="count" style="text-align:center">End of list — all records shown</div>'}else bindMore()},{rootMargin:'800px'});
 io.observe(m)}
