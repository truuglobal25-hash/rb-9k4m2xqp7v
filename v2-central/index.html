<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B2A4A">
<title>Central Route V2</title>
<style>
:root{
  --navy:#1B2A4A; --navy-2:#16223C; --navy-3:#0F1829;
  --gold:#C9A227; --gold-2:#E0BC4A; --gold-soft:#F0E2B8;
  --ivory:#E8E0D0; --ivory-2:#F5F1E8; --paper:#FBF9F4;
  --ink:#1A1A1A; --ink-2:#4A4A48; --line:#D8D0BE;
  --ok:#2D6A4F; --warn:#9A6700; --bad:#A4262C; --info:#2C5282;
  --r:14px; --sp:16px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{background:var(--paper);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(74px + var(--safe-b))}
h1{font:600 26px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px;letter-spacing:-.2px}
h2{font:600 19px/1.25 Georgia,serif;margin:26px 0 10px;color:var(--navy)}
.sub{color:var(--ink-2);font-size:14px;margin:0 0 18px}
.wrap{padding:calc(14px + var(--safe-t)) var(--sp) 20px;max-width:760px;margin:0 auto}
header.top{background:var(--navy);color:var(--ivory-2);padding:calc(16px + var(--safe-t)) var(--sp) 18px;
  border-bottom:3px solid var(--gold)}
header.top h1{color:var(--ivory-2)}
header.top .sub{color:var(--gold-soft);margin:0}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px;
  box-shadow:0 1px 2px rgba(27,42,74,.05)}
.card.lead{border-left:4px solid var(--gold)}
.card h3{margin:0 0 4px;font:600 17px/1.3 -apple-system,sans-serif}
.meta{color:var(--ink-2);font-size:14px;margin:3px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;
  border-radius:11px;border:1px solid var(--navy);background:var(--navy);color:var(--ivory-2);
  font:600 15px/1 -apple-system,sans-serif;text-decoration:none;cursor:pointer}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy-3)}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.btn.wide{flex:1 1 130px}
.btn:active{transform:translateY(1px)}
.pill{display:inline-block;padding:4px 11px;border-radius:999px;font:600 12px/1.5 -apple-system,sans-serif;
  letter-spacing:.3px;text-transform:uppercase}
.p-ready{background:#E6F0EA;color:var(--ok)} .p-call{background:#FBF0D8;color:var(--warn)}
.p-near{background:#E3EBF5;color:var(--info)} .p-cust{background:var(--navy);color:var(--gold-soft)}
.p-dorm{background:#F6E3E4;color:var(--bad)} .p-audit{background:#EDEAE2;color:var(--ink-2)}
.score{display:inline-flex;align-items:baseline;gap:3px;font:700 15px/1 Georgia,serif;color:var(--navy)}
.score b{font-size:22px} .score.hi b{color:var(--ok)} .score.mid b{color:var(--warn)} .score.lo b{color:var(--ink-2)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 16px}
.stat div{background:var(--navy);color:var(--ivory-2);border-radius:var(--r);padding:14px}
.stat b{display:block;font:700 28px/1.1 Georgia,serif;color:var(--gold-2)}
.stat span{font-size:13px;letter-spacing:.3px;text-transform:uppercase;opacity:.85}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--navy);border-top:1px solid var(--navy-3);padding-bottom:var(--safe-b)}
nav.bot a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 2px 9px;
  color:#9FB0CC;font:600 11px/1 -apple-system,sans-serif;text-decoration:none;letter-spacing:.2px}
nav.bot a.on{color:var(--gold-2)} nav.bot svg{width:22px;height:22px;stroke-width:1.8}
.search{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:11px;
  font-size:16px;background:#fff;margin:0 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;
  font:600 14px/1 -apple-system,sans-serif;color:var(--navy);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--navy);color:var(--gold-soft);border-color:var(--navy)}
.empty{text-align:center;padding:44px 20px;color:var(--ink-2)}
.empty b{display:block;font:600 18px/1.3 Georgia,serif;color:var(--navy);margin-bottom:6px}
.skel{height:74px;border-radius:var(--r);background:linear-gradient(90deg,#EFEBE2,#F7F4EE,#EFEBE2);
  background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:10px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.warn{background:#FBF0D8;border-left:4px solid var(--warn);padding:11px 13px;border-radius:9px;
  font-size:14px;color:#6B4A00;margin:8px 0}
.field{background:#E6F0EA;border-left:4px solid var(--ok);padding:11px 13px;border-radius:9px;
  font-size:14px;color:#1D4D38;margin:8px 0}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
details summary{cursor:pointer;font:600 15px/1.4 -apple-system,sans-serif;color:var(--navy);padding:8px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'\25B8 ';color:var(--gold)}
details[open] summary::before{content:'\25BE '}
@media(min-width:820px){
  body{padding-bottom:0;padding-left:232px}
  nav.bot{top:0;bottom:0;right:auto;width:232px;grid-template-columns:1fr;grid-auto-rows:min-content;
    align-content:start;padding-top:calc(20px + var(--safe-t));border-right:1px solid var(--navy-3);border-top:0}
  nav.bot a{flex-direction:row;justify-content:flex-start;gap:12px;padding:14px 20px;font-size:14px}
  .stat{grid-template-columns:repeat(4,1fr)}
  .wrap{max-width:900px}
}
</style>
</head><body>
<div id="app"><div class="wrap"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>

 const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const routable=s=>s.pl>=1&&s.pl<=3&&s.la!=null&&!/^(NOT FOR US|NOT MY CUSTOMER|REJECTED|INVALID|CHAIN|POSSIBLE SAME|POSSIBLE CUSTOMER)/.test(s.ps);
const actionable=s=>!/^(NOT FOR US|NOT MY CUSTOMER|REJECTED|INVALID|CHAIN)/.test(s.ps);
const isCust=s=>/^(EXISTING CUSTOMER|ACCOUNT EXISTS|OLD CUSTOMER|CUSTOMER OF BOTH|DORMANT|YOL ONLY|MYCO ONLY)/.test(s.ps);
function pill(s){
 if(/DORMANT CUSTOMER REACTIVATED/.test(s.ps))return['p-cust','Reactivated'];
 if(/^DORMANT|OLD CUSTOMER/.test(s.ps))return['p-dorm','Dormant'];
 if(/^EXISTING CUSTOMER|CUSTOMER OF BOTH/.test(s.ps))return['p-cust','Customer'];
 if(/^ACCOUNT EXISTS/.test(s.ps))return['p-dorm','No order yet'];
 if(/INTRODUCE MYCO/.test(s.ps))return['p-cust','Introduce MYCO'];
 if(/INTRODUCE YOL/.test(s.ps))return['p-cust','Introduce YOL'];
 if(/VERIFIED NEW SHOP/.test(s.ps))return['p-ready','Ready to visit'];
 if(/CALL FIRST/.test(s.ps))return['p-call','Call first'];
 if(/CHECK WHILE NEARBY/.test(s.ps))return['p-near','Check nearby'];
 if(/FOLLOW-UP|DECISION-MAKER/.test(s.ps))return['p-call','Follow up'];
 if(/NOT FOR US|NOT MY CUSTOMER|REJECTED|INVALID|CHAIN/.test(s.ps))return['p-audit','Audit only'];
 return['p-audit',s.ps.split('—')[0].trim().slice(0,20)||'Research']}
const LOC={1:'Field-confirmed entrance',2:'Shop shared this pin',3:'Verified business listing',
 4:'Map listing — call first',5:'Approximate area only',6:'Wrong or conflicting pin'};
function scoreCls(n){return n>=70?'hi':n>=45?'mid':'lo'}
function tel(p){return p?'+1868'+p:''}
function card(s,opts){opts=opts||{};const[pc,pt]=pill(s);const v=visits[s.id];
 const dr=routable(s)&&(s.g||s.la!=null);
 return `<div class="card${opts.lead?' lead':''}">
  <div class="row" style="justify-content:space-between;align-items:flex-start">
   <div style="flex:1 1 auto;min-width:0">
    <h3>${esc(s.n)}</h3>
    <div class="meta">${esc(s.town)}${s.cat?' · '+esc(s.cat):''}</div>
   </div>
   <span class="pill ${pc}">${pt}</span>
  </div>
  ${s.sc?`<div class="meta score ${scoreCls(s.sc)}"><b>${s.sc}</b>/100 opportunity</div>`:''}
  ${opts.why!==false&&s.sw?`<div class="meta">${esc(s.sw)}</div>`:''}

  ${!dr&&s.pl>=4?`<div class="warn">${esc(LOC[s.pl]||'Location not confirmed')} — do not drive here blind.</div>`:''}
  ${opts.extra||''}

// ---------- ROUTE BUILDER: only genuinely qualified stops, each with a real backup ----------
function buildRoute(){
 const q=D.filter(s=>routable(s)&&s.sc>=55&&!skips[s.id]&&/VERIFIED NEW SHOP|EXISTING CUSTOMER|DORMANT|ACCOUNT EXISTS|INTRODUCE/.test(s.ps));
 const by={}; q.forEach(s=>{(by[s.town]=by[s.town]||[]).push(s)});
 let best=null;
 for(const t in by){const v=by[t].sort((a,b)=>b.sc-a.sc).slice(0,12);
  const sum=v.reduce((x,y)=>x+y.sc,0); if(!best||sum>best.sum)best={town:t,stops:v,sum}}
 if(!best)return{town:null,stops:[]};
 let ord=[best.stops.shift()];
 while(best.stops.length){const l=ord[ord.length-1];
  let bi=0,bd=Infinity;
  best.stops.forEach((s,i)=>{const d=dist(l.la,l.ln,s.la,s.ln);if(d<bd){bd=d;bi=i}});
  ord.push(best.stops.splice(bi,1)[0])}
 const used=new Set(ord.map(s=>s.id));
 ord.forEach(s=>{
  const near=D.filter(x=>!used.has(x.id)&&x.la!=null&&x.sc>=40&&actionable(x))
   .map(x=>[dist(s.la,s.ln,x.la,x.ln),x]).filter(t=>t[0]<=600)
   .sort((a,b)=>(b[1].sc-a[1].sc)||(a[0]-b[0]));
  if(near.length){s._bk=near[0][1];s._bkd=Math.round(near[0][0]);used.add(near[0][1].id)}});
 return{town:best.town,stops:ord}}
// ---------- FIELDWORK: fast logging, queued when offline ----------
const OUTCOMES=['Arrived','Found shop','Not found','Wrong pin','Shop moved','Closed','Buyer unavailable',
 'Met decision-maker','New prospect','New customer','Existing customer','Dormant customer reactivated',
 'YOL order placed','MYCO order placed','Order placed for both','Follow-up required','Not interested today',
 'Not suitable','Nearby customer discovered'];
function logVisit(id,outcome,note){
 const d=new Date().toISOString().slice(0,10);
 visits[id]={outcome,note:note||'',date:d,ts:Date.now()};
 SAVE(KEY+'_visits',visits);
 queue.push({id,outcome,note:note||'',date:d}); SAVE(KEY+'_queue',queue);
 if(/Follow-up|Buyer unavailable/i.test(outcome)){
   follows[id]={reason:outcome,due:d,note:note||'',created:d}; SAVE(KEY+'_follows',follows)}
 render()}
function saveHere(id){
 if(!navigator.geolocation){alert('Location not available on this device');return}
 navigator.geolocation.getCurrentPosition(p=>{
  const v=visits[id]||{};v.pin={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)};
  v.pinDate=new Date().toISOString().slice(0,10);visits[id]=v;SAVE(KEY+'_visits',visits);
  alert('Pin saved — your position is stored beside the shop record, it does not replace it');render()},
  ()=>alert('Could not read your position'),{enableHighAccuracy:true,timeout:8000})}

function nav(){
 const items=[['today','Today'],['route','Route'],['opp','Opportunities'],['follow','Follow-ups'],['more','More']];
 return `<nav class="bot">${items.map(([k,t])=>`<a class="${VIEW===k||(k==='more'&&['customers','fieldwork','audit'].includes(VIEW))?'on':''}" onclick="go('${k}')">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="${ICON[k]||ICON.more}"/></svg>${t}</a>`).join('')}</nav>`}
function vMore(){
 return `<header class="top"><h1>More</h1><p class="sub">${TITLE} · ${D.length.toLocaleString()} records preserved</p></header><div class="wrap">
 ${[['customers','Customers','Every account with history'],['fieldwork','Fieldwork','Visits logged in person'],
    ['audit','Audit','Everything preserved, nothing recommended']].map(([k,t,d])=>
  `<div class="card" onclick="go('${k}')" style="cursor:pointer"><h3>${t}</h3><div class="meta">${d}</div></div>`).join('')}
 <div class="card"><h3>Repair app</h3><div class="meta">Clears the cached copy on this phone and reloads the newest build.</div>
  <div class="row" style="margin-top:8px"><button class="btn ghost wide" onclick="repair()">Repair now</button></div></div>
 </div>`}
async function repair(){try{const ks=await caches.keys();for(const k of ks)await caches.delete(k)}catch(e){}
 localStorage.removeItem(KEY+'_cache');location.reload()}
function render(){
 let h='';
 if(VIEW==='today')h=vToday();else if(VIEW==='route')h=vRoute();
 else if(VIEW==='opp')h=vOpp();else if(VIEW==='follow')h=vFollow();
 else if(VIEW==='more')h=vMore();else if(VIEW==='customers')h=vCustomers();
 else if(VIEW==='fieldwork')h=vFieldwork();else if(VIEW==='audit')h=vAudit();
 else if(VIEW==='shop')h=vShop(SHOP);
 else if(VIEW.startsWith('eng:'))h=vEngine(VIEW.slice(4));
 else if(VIEW.startsWith('aud:'))h=vAuditList(decodeURIComponent(VIEW.slice(4)));
 else h=vToday();
 document.getElementById('app').innerHTML=h+nav();
 const q=document.getElementById('q');
 if(q){q.oninput=e=>{Q=e.target.value;clearTimeout(window._qd);window._qd=setTimeout(()=>{render();
  const q2=document.getElementById('q');if(q2){q2.focus();q2.setSelectionRange(q2.value.length,q2.value.length)}},250)}}}
render();
 })();})
 .catch(e=>{document.getElementById('app').innerHTML='<div class="wrap"><div class="empty"><b>Could not load data</b>'+e+'</div></div>'});
</script>
</body></html>
