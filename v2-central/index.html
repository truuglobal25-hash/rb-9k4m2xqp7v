:root{
 --bg:#0C0E12;--nav:#10131A;--sf:#141821;--sf2:#1A202B;--sf3:#232B39;
 --bd:rgba(148,163,190,.07);--bd2:rgba(148,163,190,.15);
 --tx:#EEF1F6;--mu:#8E99AC;--mu2:#6B7689;
 --ac:#E8A13D;--acT:#221604;--acD:#C98A2E;--acW:rgba(232,161,61,.10);
 --ok:#46B98C;--okW:rgba(70,185,140,.10);
 --sky:#6FAEE0;--skyW:rgba(111,174,224,.10);
 --teal:#54BFB4;--tealW:rgba(84,191,180,.10);
 --rose:#E56A78;--roseW:rgba(229,106,120,.10);
 --warn:#E8A13D;--bad:#E56A78;--plum:#54BFB4;--nvy:#181d29;--acsel:rgba(232,161,61,.12);
 --e:cubic-bezier(.32,.72,0,1);--t1:.14s;--t2:.24s;--t3:.36s;
 --shadow:0 14px 44px rgba(3,6,12,.55),0 2px 10px rgba(3,6,12,.35);
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--tx);
 font:15px/1.5 'Outfit',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 font-variant-numeric:tabular-nums;
 padding-bottom:calc(70px + var(--safe-b))}
h1{font-size:24px;font-weight:700;letter-spacing:-.03em;margin:2px 0 2px}
h2{font-size:11.5px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--mu2);margin:22px 0 8px}
h3{font-size:15.5px;font-weight:600;letter-spacing:-.015em;margin:0 0 3px}
.sub,.meta{color:var(--mu);font-size:13px;line-height:1.45;margin:0}
.sub{margin-bottom:8px}
.count{color:var(--mu2);font-size:12px;margin:8px 2px}
.wrap{padding:10px 16px 24px;max-width:760px;margin:0 auto}
header.top{padding:calc(12px + var(--safe-t)) 16px 6px;max-width:760px;margin:0 auto}
#backbtn{position:fixed;top:calc(10px + var(--safe-t));left:12px;z-index:70;width:36px;height:36px;border-radius:999px;
 border:0;background:var(--sf2);color:var(--tx);font-size:20px;line-height:1;
 display:none;align-items:center;justify-content:center;padding:0 0 2px;cursor:pointer}
.hasback header.top{padding-left:58px}
.homesearch{position:sticky;top:var(--safe-t);z-index:35;background:linear-gradient(180deg,var(--bg) 82%,transparent);padding:8px 0 8px;display:flex;gap:8px;align-items:center}
.homesearch input,.search{flex:1;width:100%;height:46px;padding:10px 13px 10px 40px;font-size:16px;border-radius:14px;border:1.5px solid transparent;
 background:var(--sf2) url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%238E99AC%22 stroke-width=%222%22%3E%3Ccircle cx=%2210.5%22 cy=%2210.5%22 r=%226.5%22/%3E%3Cpath d=%22M15.5 15.5L21 21%22/%3E%3C/svg%3E') 14px 50% no-repeat;
 color:var(--tx);outline:none;-webkit-appearance:none;margin:0;font-family:inherit;transition:border-color var(--t2) var(--e)}
.homesearch input:focus,.search:focus{border-color:var(--ac)}
.homesearch input::placeholder{color:var(--mu2)}
.qclear{flex:0 0 auto;width:40px;height:40px;border-radius:999px;border:0;background:var(--sf2);
 color:var(--mu);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.panel.alert{box-shadow:inset 0 0 0 1px rgba(232,161,61,.25)}
.panel{background:var(--sf);border-radius:16px;padding:6px 16px;margin:12px 0;font-size:14px}
.panel>b{display:block;font-size:11px;font-weight:650;letter-spacing:.12em;color:var(--mu2);padding:12px 0 3px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rowl{display:block;padding:11px 0;border-bottom:1px solid var(--bd);font-size:14px}
.panel .rowl:last-child,.rowl:last-child{border-bottom:0}
.bkt{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bkt b{color:var(--tx);font-variant-numeric:tabular-nums;font-weight:650;min-width:40px;text-align:right;order:2}
.bkt span.lbl{flex:1}
.bkt:active{background:var(--sf2)}
.bkt .meta{width:100%}
.frow{display:flex;gap:6px;overflow-x:auto;padding:6px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.fchip,.chip{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--sf);color:var(--mu);
 border:0;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap}
.fchip.on,.chip.on{background:var(--acsel);color:var(--ac);font-weight:650;box-shadow:inset 0 0 0 1.5px rgba(232,161,61,.45)}
.card{background:var(--sf);border:0;border-radius:16px;padding:12px 14px;margin:9px 0;
 content-visibility:auto;contain-intrinsic-size:auto 128px}
.card.mini{cursor:pointer}
.card.mini:active{background:var(--sf2)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{animation:rise var(--t3) var(--e) both}
.card:nth-child(n+9){animation:none}
.card:nth-child(1){animation-delay:0ms}.card:nth-child(2){animation-delay:24ms}.card:nth-child(3){animation-delay:48ms}
.card:nth-child(4){animation-delay:72ms}.card:nth-child(5){animation-delay:96ms}.card:nth-child(6){animation-delay:120ms}
.card:nth-child(7){animation-delay:144ms}.card:nth-child(8){animation-delay:168ms}
.mini2{display:grid;grid-template-columns:38px 1fr 12px;gap:11px;align-items:flex-start;padding:12px 14px 10px;border-left:0;position:relative;overflow:hidden}
.mini2::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:transparent}
.mini2 .cic{width:38px;height:38px;border-radius:11px;background:var(--sf2);display:flex;align-items:center;justify-content:center;margin-top:1px}
.mini2 .cic svg{width:19px;height:19px;stroke:var(--mu);stroke-width:1.6;fill:none}
.cic.av-grocery{background:rgba(70,185,140,.12)}.cic.av-grocery svg{stroke:#5BC79A}
.cic.av-pharmacy{background:rgba(229,106,120,.12)}.cic.av-pharmacy svg{stroke:#EB8894}
.cic.av-beauty{background:rgba(214,120,180,.12)}.cic.av-beauty svg{stroke:#D67FB6}
.cic.av-herbal{background:rgba(84,191,180,.12)}.cic.av-herbal svg{stroke:#63CCC1}
.cic.av-puja{background:rgba(232,161,61,.12)}.cic.av-puja svg{stroke:#EBB35F}
.cic.av-pet{background:rgba(226,146,94,.12)}.cic.av-pet svg{stroke:#E2925E}
.cic.av-liquor{background:rgba(168,124,226,.12)}.cic.av-liquor svg{stroke:#A87CE2}
.cic.av-variety{background:rgba(111,174,224,.12)}.cic.av-variety svg{stroke:#84BCE8}
.mini2 .nm{font-size:15.5px;font-weight:650;line-height:1.28;letter-spacing:-.015em}
.mini2 .st{font-size:12px;font-weight:600;margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mini2 .meta{font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu)}

  const bin=Uint8Array.from(atob(_B64),c=>c.charCodeAt(0));
  const ds=new DecompressionStream('gzip');
  const st=new Blob([bin]).stream().pipeThrough(ds);
  return JSON.parse(await new Response(st).text());
}

 r.onupgradeneeded=e=>{const d=e.target.result;
  if(!d.objectStoreNames.contains('visits'))d.createObjectStore('visits',{keyPath:'id'});

 r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e)});
async function idbPut(st,v){const d=await DB;return new Promise((res,rej)=>{const t=d.transaction(st,'readwrite');t.objectStore(st).put(v);t.oncomplete=res;t.onerror=rej})}
async function idbAll(st){const d=await DB;return new Promise((res,rej)=>{const q=d.transaction(st).objectStore(st).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=rej})}
async function idbGet(st,k){const d=await DB;return new Promise((res,rej)=>{const q=d.transaction(st).objectStore(st).get(k);q.onsuccess=()=>res(q.result);q.onerror=rej})}

async function bootField(){
 EV=await idbAll('visits'); EV.sort((a,b)=>(a.ts||0)-(b.ts||0));
 if(!LS(KEY+'_idb_migrated',0)){
  const oldV=LS(KEY+'_visits',{});
  for(const sid in oldV){const v=oldV[sid];
   const e={id:'mig-'+sid,sid,ts:v.ts||Date.now(),date:v.date||'',outcome:v.outcome||'',note:v.note||'',rep:REP,migrated:1,synced:false,
     gps:v.pin?{lat:v.pin.lat,lng:v.pin.lng,src:'saved pin',date:v.pinDate||''}:null};
   await idbPut('visits',e); EV.push(e)}
  SAVE(KEY+'_idb_migrated',1)}
 reindexEV()}

 if(/DORMANT CUSTOMER REACTIVATED/.test(s.ps))return['p-cust','DORMANT CUSTOMER REACTIVATED'];

 if(y&&m){const b=band(mo);return['p-cust',b==='ACTIVE'?'CUSTOMER OF BOTH':b+' · CUSTOMER OF BOTH']}
 const lr=s.pl>=4?' · LOCATION RESEARCH':'';
 if(y){const b=band(mo);return[b==='ACTIVE'?'p-cust':'p-dorm',(b||'EXISTING')+' YOL CUSTOMER · NO MYCO HISTORY'+lr]}
 if(m){const b=band(mo);return[b==='ACTIVE'?'p-cust':'p-dorm',(b||'EXISTING')+' MYCO CUSTOMER · NO YOL HISTORY'+lr]}
 if(/^ACCOUNT EXISTS/.test(s.ps))return['p-dorm','ACCOUNT · NO ORDER'];
 if(/^EXISTING CUSTOMER.*FOUND UNDER/.test(s.ps))return['p-cust','EXISTING CUSTOMER · OTHER NAME'];
 if(/^EXISTING CUSTOMER/.test(s.ps))return['p-cust','EXISTING CUSTOMER'];
 if(/^OLD CUSTOMER/.test(s.ps))return['p-dorm','DORMANT CUSTOMER'];
 if(/VERIFIED NEW SHOP/.test(s.ps))return['p-ready','VERIFIED NEW PROSPECT'];
 if(/CALL FIRST/.test(s.ps))return['p-call','CALL FIRST'];
 if(/CHECK WHILE NEARBY/.test(s.ps))return['p-near','CHECK WHILE NEARBY'];
 if(/FOLLOW-UP|DECISION-MAKER/.test(s.ps))return['p-call','BUYER UNAVAILABLE · FOLLOW UP'];
 if(/CONFIRM THE TRADE/.test(s.ps))return['p-call','CONFIRM THE TRADE'];

 if(/NOT FOR US|NOT MY CUSTOMER|REJECTED|INVALID|CHAIN/.test(s.ps))return['p-audit','AUDIT ONLY'];

// ---------- ROUTE BUILDER: only genuinely qualified stops, each with a real backup ----------
function buildRoute(){
 const q=D.filter(s=>routable(s)&&s.sc>=55&&!skips[s.id]&&/VERIFIED NEW SHOP|EXISTING CUSTOMER|DORMANT|ACCOUNT EXISTS|INTRODUCE/.test(s.ps));
 const by={}; q.forEach(s=>{(by[s.town]=by[s.town]||[]).push(s)});
 let best=null;
 for(const t in by){const v=by[t].sort((a,b)=>b.sc-a.sc).slice(0,12);
  const sum=v.reduce((x,y)=>x+y.sc,0); if(!best||sum>best.sum)best={town:t,stops:v,sum}}
 if(!best)return{town:null,stops:[]};
 let ord=[best.stops.shift()];
 while(best.stops.length){const l=ord[ord.length-1];
  let bi=0,bd=Infinity;
  best.stops.forEach((s,i)=>{const d=dist(l.la,l.ln,s.la,s.ln);if(d<bd){bd=d;bi=i}});
  ord.push(best.stops.splice(bi,1)[0])}
 const used=new Set(ord.map(s=>s.id));
 ord.forEach(s=>{
  const near=D.filter(x=>!used.has(x.id)&&x.la!=null&&x.sc>=40&&actionable(x))
   .map(x=>[dist(s.la,s.ln,x.la,x.ln),x]).filter(t=>t[0]<=600)
   .sort((a,b)=>(b[1].sc-a[1].sc)||(a[0]-b[0]));
  if(near.length){s._bk=near[0][1];s._bkd=Math.round(near[0][0]);used.add(near[0][1].id)}});
 return{town:best.town,stops:ord}}
