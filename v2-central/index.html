<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B2A4A">
<title>Central Route V2</title>
<style>
:root{--bg:#0A0F1A;--sf:#141C2B;--sf2:#1B2536;--bd:rgba(148,163,184,.14);
 --tx:#E9EEF6;--mu:#95A3B8;--ac:#7C9AFF;--acT:#0A0F1A;--plum:#C77DFF;
 --ok:#35C48D;--warn:#F5A524;--bad:#F0565B;
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--tx);
 font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
 padding-bottom:calc(64px + var(--safe-b))}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px}
h2{font-size:15px;font-weight:700;letter-spacing:.02em;margin:20px 0 8px}
h3{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
.sub,.meta{color:var(--mu);font-size:13px;line-height:1.45;margin:0}
.sub{margin-bottom:10px}
.count{color:var(--mu);font-size:12px;margin:8px 2px}
.wrap{padding:10px 16px 20px;max-width:760px;margin:0 auto}
header.top{padding:calc(12px + var(--safe-t)) 16px 8px;max-width:760px;margin:0 auto}
header.top h1{margin:2px 0 2px}
#backbtn{position:fixed;top:calc(8px + var(--safe-t));left:10px;z-index:70;width:40px;height:40px;border-radius:50%;
 border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font-size:24px;line-height:1;
 display:none;align-items:center;justify-content:center;padding:0 0 3px;cursor:pointer}
.hasback header.top,.hasback .wrap:first-child{padding-left:58px}
.homesearch{position:sticky;top:var(--safe-t);z-index:35;background:var(--bg);padding:8px 0 6px}
.homesearch{display:flex;gap:8px;align-items:center}
.homesearch input,.search{flex:1;width:100%;padding:13px 15px;font-size:16px;border-radius:13px;border:1px solid var(--bd);
 background:var(--sf);color:var(--tx);outline:none;-webkit-appearance:none;margin:0}
.homesearch input:focus,.search:focus{border-color:var(--ac)}
.qclear{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--sf2);
 color:var(--mu);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px 16px;margin:12px 0;font-size:14px}
.panel>b{font-size:12.5px;letter-spacing:.08em;color:var(--mu)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel .row,.rowl{display:block;padding:11px 0;border-bottom:1px solid var(--bd);font-size:14px;min-height:24px}
.panel .row:last-child,.rowl:last-child{border-bottom:0}
.bkt{cursor:pointer}
.bkt b{color:var(--ac);font-variant-numeric:tabular-nums;display:inline-block;min-width:44px}
.bkt:active{background:var(--sf2)}
.frow{display:flex;gap:7px;overflow-x:auto;padding:8px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.fchip,.chip{flex:0 0 auto;padding:9px 13px;border-radius:999px;background:var(--sf);color:var(--mu);
 border:1px solid var(--bd);font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.fchip.on,.chip.on{background:var(--ac);color:var(--acT);border-color:transparent;font-weight:700}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:15px;padding:12px 15px;margin:10px 0;
 content-visibility:auto;contain-intrinsic-size:auto 128px}
.card.mini{cursor:pointer}
.card.mini:active{transform:scale(.985)}
.nm{font-size:16px;font-weight:700;letter-spacing:-.01em}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:10px;font-weight:700;letter-spacing:.05em;border-radius:6px;padding:3px 7px;
 background:var(--sf2);color:var(--mu);border:1px solid var(--bd)}
.tag.oYOL{background:#6E9BFF;color:#0A0F1A;border-color:transparent}
.tag.oMYCO{background:var(--plum);color:#0A0F1A;border-color:transparent}
.tag.oBOTH{background:var(--ok);color:#06251A;border-color:transparent}
.tag.p-ready{background:rgba(53,196,141,.15);color:#5FE0AE;border-color:rgba(53,196,141,.3)}
.tag.p-cust{background:rgba(110,155,255,.14);color:#9DB8FF;border-color:rgba(110,155,255,.3)}
.tag.p-call{background:rgba(245,165,36,.13);color:#F7BE5A;border-color:rgba(245,165,36,.3)}
.tag.p-near{background:rgba(124,154,255,.12);color:var(--ac);border-color:rgba(124,154,255,.28)}
.tag.p-dorm{background:rgba(240,86,91,.12);color:#F58F93;border-color:rgba(240,86,91,.3)}
.tag.p-audit{background:var(--sf2);color:var(--mu)}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.04em;border-radius:6px;padding:3px 8px;background:var(--sf2);color:var(--mu)}
.pill.p-ready{color:#5FE0AE}.pill.p-cust{color:#9DB8FF}.pill.p-call{color:#F7BE5A}.pill.p-near{color:var(--ac)}.pill.p-dorm{color:#F58F93}
.act{margin-top:7px;font-size:12.5px;color:var(--mu)}
.warn{margin-top:8px;font-size:12.5px;color:var(--warn);background:rgba(245,165,36,.08);
 border:1px solid rgba(245,165,36,.3);border-radius:10px;padding:8px 10px}
.field{margin-top:8px;font-size:12.5px;color:#8FD9BC;background:rgba(53,196,141,.08);
 border:1px solid rgba(53,196,141,.22);border-radius:10px;padding:8px 10px}
.src{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:8px 11px;font-size:12.5px;color:var(--mu);margin:8px 0}
.src b{color:var(--tx);font-weight:600}
.btn,.b{min-height:46px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;
 font-size:14.5px;font-weight:700;cursor:pointer;border:1px solid var(--bd);background:var(--sf2);
 color:var(--tx);text-decoration:none;text-align:center;padding:0 12px;font-family:inherit;flex:1}
.btn.gold,.b.call{background:var(--ac);color:var(--acT);border-color:transparent}
.btn.ghost{background:var(--sf)}
.btn.wide,.b.wide{width:100%;margin:6px 0;flex:1 1 100%}
.btn:active,.b:active,.fchip:active{transform:scale(.97)}
.btn,.b,.fchip,.card.mini{transition:transform .12s cubic-bezier(.22,1,.36,1)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.hcard{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;cursor:pointer;min-height:44px}
.hcard.on{border-color:var(--ac)}
.hcard b{display:block;font-size:19px;font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums;line-height:1.15}
.hcard span{font-size:11.5px;font-weight:600;color:var(--mu);letter-spacing:.02em}
.hcard .meta{margin-top:2px;font-size:11px}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
 background:var(--sf);border-top:1px solid var(--bd);padding-bottom:var(--safe-b)}
nav.bot a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 8px;
 color:var(--mu);font:600 11px/1 -apple-system,sans-serif;text-decoration:none;cursor:pointer}
nav.bot a.on{color:var(--ac)} nav.bot svg{width:22px;height:22px;stroke-width:1.8}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end}
.sheet{background:var(--sf);border-radius:20px 20px 0 0;width:100%;max-width:760px;margin:0 auto;
 max-height:88vh;overflow-y:auto;padding:8px 18px 0;position:relative}
.grab{width:44px;height:4px;border-radius:99px;background:var(--bd);margin:6px auto 10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--mu);flex:0 0 auto}
.kv b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.stick{position:sticky;bottom:0;background:var(--sf);padding:10px 0 calc(14px + var(--safe-b));
 display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--bd);margin-top:12px}
.stick .btn{flex:1 1 30%}
.sel{width:100%;margin:2px 0 8px;padding:11px 13px;font-size:14px;color:var(--tx);
 border:1px solid var(--bd);border-radius:12px;background:var(--sf);font-family:inherit;-webkit-appearance:none}
.empty{text-align:center;padding:40px 20px;color:var(--mu)}
.empty b{display:block;font-size:17px;font-weight:700;color:var(--tx);margin-bottom:6px}
.skel{height:74px;border-radius:14px;background:linear-gradient(90deg,var(--sf),var(--sf2),var(--sf));
 background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:10px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
details summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--tx);padding:8px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'▸';float:right;color:var(--mu)}
details[open] summary::after{content:'▾'}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{padding:8px 12px;font-size:12.5px}
@media(min-width:820px){
 body{padding-bottom:0;padding-left:220px}
 nav.bot{top:0;bottom:0;right:auto;width:220px;grid-template-columns:1fr;grid-auto-rows:min-content;
  align-content:start;padding-top:calc(20px + var(--safe-t));border-right:1px solid var(--bd);border-top:0}
 nav.bot a{flex-direction:row;justify-content:flex-start;gap:12px;padding:13px 20px;font-size:14px}
 .wrap,header.top{max-width:900px}
 .grid2{grid-template-columns:repeat(4,1fr)}
}
</style>

async function _load(){
  const bin=Uint8Array.from(atob(_B64),c=>c.charCodeAt(0));

  return JSON.parse(await new Response(st).text());

 const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

 if(/^ACCOUNT EXISTS/.test(s.ps))return['p-dorm','ACCOUNT — NO ORDER'];
 if(/^EXISTING CUSTOMER — FOUND UNDER/.test(s.ps))return['p-cust','EXISTING CUSTOMER — OTHER NAME'];
 if(/^EXISTING CUSTOMER/.test(s.ps))return['p-cust','EXISTING CUSTOMER'];
 if(/^OLD CUSTOMER/.test(s.ps))return['p-dorm','DORMANT CUSTOMER'];

 if(/NOT FOR US|NOT MY CUSTOMER|REJECTED|INVALID|CHAIN/.test(s.ps))return['p-audit','AUDIT ONLY'];

function buildRoute(){
 const q=D.filter(s=>routable(s)&&s.sc>=55&&!skips[s.id]&&/VERIFIED NEW SHOP|EXISTING CUSTOMER|DORMANT|ACCOUNT EXISTS|INTRODUCE/.test(s.ps));
 const by={}; q.forEach(s=>{(by[s.town]=by[s.town]||[]).push(s)});
 let best=null;
 for(const t in by){const v=by[t].sort((a,b)=>b.sc-a.sc).slice(0,12);
  const sum=v.reduce((x,y)=>x+y.sc,0); if(!best||sum>best.sum)best={town:t,stops:v,sum}}
 if(!best)return{town:null,stops:[]};
 let ord=[best.stops.shift()];
 while(best.stops.length){const l=ord[ord.length-1];
  let bi=0,bd=Infinity;
  best.stops.forEach((s,i)=>{const d=dist(l.la,l.ln,s.la,s.ln);if(d<bd){bd=d;bi=i}});
  ord.push(best.stops.splice(bi,1)[0])}
 const used=new Set(ord.map(s=>s.id));
 ord.forEach(s=>{
  const near=D.filter(x=>!used.has(x.id)&&x.la!=null&&x.sc>=40&&actionable(x))
   .map(x=>[dist(s.la,s.ln,x.la,x.ln),x]).filter(t=>t[0]<=600)
   .sort((a,b)=>(b[1].sc-a[1].sc)||(a[0]-b[0]));
  if(near.length){s._bk=near[0][1];s._bkd=Math.round(near[0][0]);used.add(near[0][1].id)}});
 return{town:best.town,stops:ord}}

   status:o.status||'Handed Over',log:o.log||[],
   kind:/REACTIVATED/.test(s.field.outcome)?'Dormant customer reactivated':(/NEW CUSTOMER/.test(s.field.outcome)?'New customer opened':'Order confirmed')}});
 return base}
