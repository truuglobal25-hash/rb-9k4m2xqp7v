function buildRoute(){

 const by={}; q.forEach(s=>{(by[s.town]=by[s.town]||[]).push(s)});

 for(const t in by){const v=by[t].sort((a,b)=>b.sc-a.sc).slice(0,12);
  const sum=v.reduce((x,y)=>x+y.sc,0); if(!best||sum>best.sum)best={town:t,stops:v,sum}}
 if(!best)return{town:null,stops:[]};
 let ord=[best.stops.shift()];
 while(best.stops.length){const l=ord[ord.length-1];
  let bi=0,bd=Infinity;
  best.stops.forEach((s,i)=>{const d=dist(l.la,l.ln,s.la,s.ln);if(d<bd){bd=d;bi=i}});
  ord.push(best.stops.splice(bi,1)[0])}
 const used=new Set(ord.map(s=>s.id));
 ord.forEach(s=>{
  const near=D.filter(x=>!used.has(x.id)&&x.la!=null&&x.sc>=40&&actionable(x))
   .map(x=>[dist(s.la,s.ln,x.la,x.ln),x]).filter(t=>t[0]<=600)
   .sort((a,b)=>(b[1].sc-a[1].sc)||(a[0]-b[0]));
  if(near.length){s._bk=near[0][1];s._bkd=Math.round(near[0][0]);used.add(near[0][1].id)}});
 return{town:best.town,stops:ord}}

  if(CAP>=L.length){m.outerHTML='<div class="count" style="text-align:center">End of list — all records shown</div>'}else bindMore()},{rootMargin:'800px'});

function openSheet(id){SHOP=id;try{history.pushState(0,'')}catch(e){};drawSheet()}
function closeSheet(){SHOP=null;drawSheet()}
function openShop(id){openSheet(id)}
function drawSheet(){
 const old=document.getElementById('sheetbg');if(old)old.remove();
 updateBack();
 if(!SHOP)return;
 const s=D.find(x=>x.id===SHOP);if(!s){SHOP=null;return}
 const[pc,pt]=pill(s);const v=visits[s.id];const dr=routable(s)&&(s.g||s.la!=null);
 const d=document.createElement('div');d.id='sheetbg';d.className='sheetbg';
 d.onclick=e=>{if(e.target===d)closeSheet()};
 d.innerHTML=`<div class="sheet"><div class="grab"></div>
 <div class="nm" style="font-size:19px">${esc(s.n)}</div>
 <div class="tags"><span class="tag ${pc}">${pt}</span>${relTags(s)}${s.sc?`<span class="tag">${s.sc}/100</span>`:''}</div>
 <div class="src" style="margin-top:10px">
  <div class="kv"><span>Category</span><b>${esc(s.cat||'from name / unconfirmed')}</b></div>
  <div class="kv"><span>Area</span><b>${esc(s.town||'Unrecorded')}</b></div>
  ${s.ad?`<div class="kv"><span>Road</span><b>${esc(s.ad)}</b></div>`:''}
  ${s.p?`<div class="kv"><span>Phone</span><b>${tel(s.p)}</b></div>`:''}
  <div class="kv"><span>YOL</span><b>${s.yol?esc(s.yol):'no purchase history found'}</b></div>
  <div class="kv"><span>MYCO</span><b>${s.myco?esc(s.myco):'no purchase history found'}</b></div>
  ${s.mso!=null?`<div class="kv"><span>Last order</span><b>${Math.round(s.mso)} months ago</b></div>`:''}
  <div class="kv"><span>Discovered from</span><b>${esc(srcName(s.src))}${s.dt?' · '+esc(s.dt):''}</b></div>
  <div class="kv"><span>Location source</span><b>${esc(locSrc(s))}</b></div>
  <div class="kv"><span>Location status</span><b>${esc(LOC[s.pl]||'Unknown')}</b></div>
  ${s.ev?`<div class="kv"><span>Operating evidence</span><b>${esc(s.ev)}${s.rev?' · '+esc(String(s.rev))+' reviews':''}</b></div>`:''}
 </div>
 ${s.t?`<div class="src"><b>${TIERN[s.t].toUpperCase()}</b><br><b>Why it may buy:</b> ${s.sim?`similar to ${s.sim} verified buying customers in this business category${s.simt?`, ${s.simt} in ${esc(s.town)}`:''}`:'no confirmed buying customers in this exact category yet — treat as a test call'}.<br>${s.fit?`<b>Ranges likely suitable:</b> ${esc(s.fit)} (${s.fw==='sup'?'supported by confirmed orders in this category':'possible — category-based'}).`:'<b>Ranges:</b> insufficient evidence.'}<br><b>First action:</b> ${ACTN[s.t]}</div>`:''}
 ${s.rl?`<div class="src"><b>RESEARCHED LOCATION (${esc(s.rl.conf)})</b> — ${esc(s.rl.why)} · ${esc(s.rl.src)}${s.rl.d!=null?' · '+s.rl.d+'m from the original pin':''}<br>${esc(s.rl.ad||'')}${s.rl.g?`<br><a class="btn ghost wide" style="margin-top:6px" href="${s.rl.g}" target="_blank" rel="noopener">Open researched listing</a>`:''}</div>`:''}
 ${s.lo?`<div class="src"><b>ORIGINAL LOCATION — preserved</b><br>${esc(s.lo.ad||'no address recorded')}${s.lo.la!=null?` · ${s.lo.la}, ${s.lo.ln}`:''} · ${esc(LOC[s.lo.pl]||'')}</div>`:''}
 ${s.cg?`<div class="warn">CLOSED ON GOOGLE — REQUIRES REVIEW. No other source confirms closure; record preserved, confirm by phone or in person.</div>`:''}
 ${s.mr?`<div class="warn">Location match by phone only — the listing name differs from this record. Review before trusting; not promoted.</div>`:''}
 ${s.lf&&!s.rl?`<div class="warn">${esc(s.lf)} — in the location-repair queue.${(s.yol||s.myco)?' Existing customer: history preserved, kept out of driving routes until confirmed.':''}</div>`:''}
 ${!dr&&s.pl>=4?`<div class="warn">${esc(LOC[s.pl])} — no Directions until the entrance is confirmed.</div>`:''}
 ${(s.yol||s.myco)&&s.pl>=4&&s.p?`<a class="btn wide" href="https://wa.me/1868${s.p}?text=${encodeURIComponent('Good day! Yusuf Overseas here. Please share your shop location pin on WhatsApp so our delivery reaches the right entrance. Thank you!')}" target="_blank" rel="noopener">Request customer pin on WhatsApp</a>`:''}
 ${/POSSIBLE SAME/.test(s.ps)?`<div class="warn">Possible duplicate of another record — never auto-merged. Review before treating as separate.</div>`:''}
 ${s.field?`<div class="field"><b>Field visit · ${esc(s.field.date)}</b><br>${esc(s.field.outcome)}${s.field.orders?' — orders: '+esc(s.field.orders):''}${s.field.note?'<br>'+esc(s.field.note):''}</div>`:''}
 ${v?`<div class="field"><b>Logged: ${esc(v.outcome)}</b> · ${esc(v.date)}${v.note?'<br>'+esc(v.note):''}</div>`:''}
 ${follows[s.id]?`<div class="warn">Follow-up: ${esc(follows[s.id].reason)} · created ${esc(follows[s.id].created)}</div>`:''}
 ${s.why?`<details><summary>Why this status</summary><div class="meta">${esc(s.why)}</div></details>`:''}
 <details><summary>Location history — nothing overwritten</summary>
  ${s.la!=null?`<div class="meta">Book pin: ${s.la}, ${s.ln}</div>`:'<div class="meta">No book pin</div>'}
  ${s.rpin?`<div class="meta">Rep pin: ${s.rpin.lat}, ${s.rpin.lng}</div>`:''}
  ${s.fpin?`<div class="meta">Field pin (${esc(s.fpin.date)}): ${s.fpin.lat}, ${s.fpin.lng}</div>`:''}
  ${v&&v.pin?`<div class="meta">Saved pin (${esc(v.pinDate||'')}): ${v.pin.lat}, ${v.pin.lng}</div>`:''}
 </details>
 <details><summary>Record visit outcome</summary>
  <div class="chips">${OUTCOMES.map(o=>`<button class="chip" onclick="logVisit('${s.id}','${o}')">${o}</button>`).join('')}</div>
  <button class="btn ghost wide" onclick="saveHere('${s.id}')">Save my location as this shop's pin</button>
 </details>
 ${s.t?`<button class="btn wide" onclick="closeSheet();go('like:${s.id}')">Find similar businesses</button>`:''}
 <div class="stick">
  ${s.p?`<a class="btn ghost" href="tel:${tel(s.p)}">Call</a>`:''}
  ${s.p?`<a class="btn ghost" href="https://wa.me/1868${s.p}" target="_blank" rel="noopener">WhatsApp</a>`:''}
  ${dr?`<a class="btn gold" href="${s.g||('https://www.google.com/maps/dir/?api=1&destination='+s.la+','+s.ln)}" target="_blank" rel="noopener">Directions</a>`:''}
  <button class="btn ghost" onclick="logVisit('${s.id}','Follow-up again')">Follow-up</button>
 </div></div>`;
 document.body.appendChild(d)}
function topFab(){
 let f=document.getElementById('topfab');
 if(!f){f=document.createElement('button');f.id='topfab';f.textContent='↑';f.onclick=()=>scrollTo({top:0,behavior:'smooth'});document.body.appendChild(f);
  addEventListener('scroll',()=>{f.style.display=scrollY>700?'flex':'none'},{passive:true})}}
function updateBack(){topFab();
 let bb=document.getElementById('backbtn');
 if(!bb){bb=document.createElement('button');bb.id='backbtn';bb.textContent='‹';
  bb.onclick=goBack;document.body.appendChild(bb)}
 const show=SHOP||VIEW!=='today';
 bb.style.display=show?'flex':'none';
 document.body.classList.toggle('hasback',!!show)}
const ICON={today:'M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10',
 route:'M4 19c4-1 4-6 8-6s4 5 8 4M6 5a2 2 0 100 4 2 2 0 000-4zm12 8a2 2 0 100 4 2 2 0 000-4z',
 areas:'M9 20l-6-2V4l6 2m0 14l6-2m-6 2V6m6 12l6 2V6l-6-2m0 14V4M9 6l6-2',
 disc:'M10.5 4a6.5 6.5 0 104.6 11.1L21 21m-5.9-5.9A6.5 6.5 0 0010.5 4z',
 opp:'M12 2l2.9 6.3 6.9.6-5.2 4.6 1.6 6.7L12 16.9 5.8 20.2l1.6-6.7L2.2 8.9l6.9-.6z',
 follow:'M12 8v5l3 2M12 22a10 10 0 110-20 10 10 0 010 20z',
 more:'M5 12a1 1 0 102 0 1 1 0 00-2 0zm6 0a1 1 0 102 0 1 1 0 00-2 0zm6 0a1 1 0 102 0 1 1 0 00-2 0z'};
function nav(){
 const items=[['today','Home'],['areas','Areas'],['disc','Discover'],['route','Route'],['more','More']];
 return `<nav class="bot">${items.map(([k,t])=>`<a class="${VIEW===k||(k==='more'&&['customers','fieldwork','audit'].includes(VIEW))?'on':''}" onclick="navGo('${k}')">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[k]||ICON.more}"/></svg>${t}</a>`).join('')}</nav>`}
function vMore(){
 return `<header class="top"><h1>More</h1><p class="sub">${TITLE} · ${D.length.toLocaleString()} records preserved</p></header><div class="wrap">
 ${[['hand','Handoffs','Customers handed to the representative'],['opp','Opportunities','Seven engines, ranked by evidence'],['follow','Follow-ups','Nothing disappears when its date passes'],['customers','Customers','Every account with history'],['fieldwork','Fieldwork','Visits logged in person'],
    ['audit','Audit','Everything preserved, nothing recommended']].map(([k,t,d])=>
  `<div class="card" onclick="go('${k}')" style="cursor:pointer"><h3>${t}</h3><div class="meta">${d}</div></div>`).join('')}
 <div class="card"><h3>Repair app</h3><div class="meta">Clears the cached copy on this phone and reloads the newest build.</div>
  <div class="row" style="margin-top:8px"><button class="btn ghost wide" onclick="repair()">Repair now</button></div></div>
 </div>`}
async function repair(){try{const ks=await caches.keys();for(const k of ks)await caches.delete(k)}catch(e){}
 localStorage.removeItem(KEY+'_cache');location.reload()}
window.go=go;window.navGo=navGo;window.clearQ=clearQ;window.goBack=goBack;window.openShop=openShop;window.openSheet=openSheet;window.closeSheet=closeSheet;window.skip=skip;window.logVisit=logVisit;window.setF=setF;window.setOnly=setOnly;window.setCat=setCat;window.clearF=clearF;window.openFilters=openFilters;window.closeFilters=closeFilters;window.reFilters=reFilters;window.setSort=setSort;window.openSort=openSort;
window.saveHere=saveHere;window.repair=repair;
function render(){
 let h='';
 if(VIEW==='today')h=vToday();else if(VIEW==='route')h=vRoute();
 else if(VIEW==='opp')h=vOpp();else if(VIEW==='follow')h=vFollow();
 else if(VIEW==='more')h=vMore();else if(VIEW==='customers')h=vCustomers();
 else if(VIEW==='fieldwork')h=vFieldwork();else if(VIEW==='audit')h=vAudit();
 else if(VIEW==='areas')h=vAreas();else if(VIEW==='hand')h=vHandoffs();
 else if(VIEW.startsWith('list:'))h=vList(VIEW.slice(5));
 else if(VIEW==='disc')h=vDiscover();else if(VIEW==='fd')h=vFD();
 else if(VIEW.startsWith('area:'))h=vArea(decodeURIComponent(VIEW.slice(5)));
 else if(VIEW.startsWith('like:'))h=vLike(VIEW.slice(5));
 else if(VIEW.startsWith('eng:'))h=vEngine(VIEW.slice(4));
 else if(VIEW.startsWith('aud:'))h=vAuditList(decodeURIComponent(VIEW.slice(4)));
 else h=vToday();
 document.getElementById('app').innerHTML=h+nav();
 const q=document.getElementById('q');
 if(q){q.oninput=e=>{Q=e.target.value;CAP=150;clearTimeout(window._qd);window._qd=setTimeout(()=>{render();
  const q2=document.getElementById('q');if(q2){q2.focus();q2.setSelectionRange(q2.value.length,q2.value.length)}},250)}}
 const ss=document.getElementById('sortsel');
 if(ss)ss.onchange=e=>setSort(e.target.value);
 bindMore();updateBack()}
render();
 })();})
 .catch(e=>{document.getElementById('app').innerHTML='<div class="wrap"><div class="empty"><b>Could not load data</b>'+e+'</div></div>'});
</script>
</body></html>
