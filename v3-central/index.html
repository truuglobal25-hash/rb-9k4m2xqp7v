:root{
 --bg:#0C0E12;--nav:#10131A;--sf:#141821;--sf2:#1A202B;--sf3:#232B39;
 --bd:rgba(148,163,190,.07);--bd2:rgba(148,163,190,.15);
 --tx:#EEF1F6;--mu:#8E99AC;--mu2:#6B7689;
 --ac:#E8A13D;--acT:#221604;--acD:#C98A2E;--acW:rgba(232,161,61,.10);
 --ok:#46B98C;--okW:rgba(70,185,140,.10);
 --sky:#6FAEE0;--skyW:rgba(111,174,224,.10);
 --teal:#54BFB4;--tealW:rgba(84,191,180,.10);
 --rose:#E56A78;--roseW:rgba(229,106,120,.10);
 --warn:#E8A13D;--bad:#E56A78;--plum:#54BFB4;--nvy:#181d29;--acsel:rgba(232,161,61,.12);
 --e:cubic-bezier(.32,.72,0,1);--t1:.14s;--t2:.24s;--t3:.36s;
 --shadow:0 14px 44px rgba(3,6,12,.55),0 2px 10px rgba(3,6,12,.35);
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--tx);
 font:15px/1.5 'Outfit',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 font-variant-numeric:tabular-nums;
 padding-bottom:calc(70px + var(--safe-b))}
h1{font-size:24px;font-weight:700;letter-spacing:-.03em;margin:2px 0 2px}
h2{font-size:11.5px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--mu2);margin:22px 0 8px}
h3{font-size:15.5px;font-weight:600;letter-spacing:-.015em;margin:0 0 3px}
.sub,.meta{color:var(--mu);font-size:13px;line-height:1.45;margin:0}
.sub{margin-bottom:8px}
.count{color:var(--mu2);font-size:12px;margin:8px 2px}
.wrap{padding:10px 16px 24px;max-width:760px;margin:0 auto}
header.top{padding:calc(12px + var(--safe-t)) 16px 6px;max-width:760px;margin:0 auto}
#backbtn{position:fixed;top:calc(10px + var(--safe-t));left:12px;z-index:70;width:36px;height:36px;border-radius:999px;
 border:0;background:var(--sf2);color:var(--tx);font-size:20px;line-height:1;
 display:none;align-items:center;justify-content:center;padding:0 0 2px;cursor:pointer}
.hasback header.top{padding-left:58px}
.homesearch{position:sticky;top:var(--safe-t);z-index:35;background:linear-gradient(180deg,var(--bg) 82%,transparent);padding:8px 0 8px;display:flex;gap:8px;align-items:center}
.homesearch input,.search{flex:1;width:100%;height:46px;padding:10px 13px 10px 40px;font-size:16px;border-radius:14px;border:1.5px solid transparent;
 background:var(--sf2) url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%238E99AC%22 stroke-width=%222%22%3E%3Ccircle cx=%2210.5%22 cy=%2210.5%22 r=%226.5%22/%3E%3Cpath d=%22M15.5 15.5L21 21%22/%3E%3C/svg%3E') 14px 50% no-repeat;
 color:var(--tx);outline:none;-webkit-appearance:none;margin:0;font-family:inherit;transition:border-color var(--t2) var(--e)}
.homesearch input:focus,.search:focus{border-color:var(--ac)}
.homesearch input::placeholder{color:var(--mu2)}
.qclear{flex:0 0 auto;width:40px;height:40px;border-radius:999px;border:0;background:var(--sf2);
 color:var(--mu);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.panel.alert{box-shadow:inset 0 0 0 1px rgba(232,161,61,.25)}
.panel{background:var(--sf);border-radius:16px;padding:6px 16px;margin:12px 0;font-size:14px}
.panel>b{display:block;font-size:11px;font-weight:650;letter-spacing:.12em;color:var(--mu2);padding:12px 0 3px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rowl{display:block;padding:11px 0;border-bottom:1px solid var(--bd);font-size:14px}
.panel .rowl:last-child,.rowl:last-child{border-bottom:0}
.bkt{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bkt b{color:var(--tx);font-variant-numeric:tabular-nums;font-weight:650;min-width:40px;text-align:right;order:2}
.bkt span.lbl{flex:1}
.bkt:active{background:var(--sf2)}
.bkt .meta{width:100%}
.frow{display:flex;gap:6px;overflow-x:auto;padding:6px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.fchip,.chip{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--sf);color:var(--mu);
 border:0;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap}
.fchip.on,.chip.on{background:var(--acsel);color:var(--ac);font-weight:650;box-shadow:inset 0 0 0 1.5px rgba(232,161,61,.45)}
.card{background:var(--sf);border:0;border-radius:16px;padding:12px 14px;margin:9px 0;
 content-visibility:auto;contain-intrinsic-size:auto 128px}
.card.mini{cursor:pointer}
.card.mini:active{background:var(--sf2)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{animation:rise var(--t3) var(--e) both}
.card:nth-child(n+9){animation:none}
.card:nth-child(1){animation-delay:0ms}.card:nth-child(2){animation-delay:24ms}.card:nth-child(3){animation-delay:48ms}
.card:nth-child(4){animation-delay:72ms}.card:nth-child(5){animation-delay:96ms}.card:nth-child(6){animation-delay:120ms}
.card:nth-child(7){animation-delay:144ms}.card:nth-child(8){animation-delay:168ms}
.mini2{display:grid;grid-template-columns:38px 1fr 12px;gap:11px;align-items:flex-start;padding:12px 14px 10px;border-left:0;position:relative;overflow:hidden}
.mini2::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:transparent}
.mini2 .cic{width:38px;height:38px;border-radius:11px;background:var(--sf2);display:flex;align-items:center;justify-content:center;margin-top:1px}
.mini2 .cic svg{width:19px;height:19px;stroke:var(--mu);stroke-width:1.6;fill:none}
.cic.av-grocery{background:rgba(70,185,140,.12)}.cic.av-grocery svg{stroke:#5BC79A}
.cic.av-pharmacy{background:rgba(229,106,120,.12)}.cic.av-pharmacy svg{stroke:#EB8894}
.cic.av-beauty{background:rgba(214,120,180,.12)}.cic.av-beauty svg{stroke:#D67FB6}
.cic.av-herbal{background:rgba(84,191,180,.12)}.cic.av-herbal svg{stroke:#63CCC1}
.cic.av-puja{background:rgba(232,161,61,.12)}.cic.av-puja svg{stroke:#EBB35F}
.cic.av-pet{background:rgba(226,146,94,.12)}.cic.av-pet svg{stroke:#E2925E}
.cic.av-liquor{background:rgba(168,124,226,.12)}.cic.av-liquor svg{stroke:#A87CE2}
.cic.av-variety{background:rgba(111,174,224,.12)}.cic.av-variety svg{stroke:#84BCE8}
.mini2 .nm{font-size:15.5px;font-weight:650;line-height:1.28;letter-spacing:-.015em}
.mini2 .st{font-size:12px;font-weight:600;margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mini2 .meta{font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu)}

async function _load(){
  const bin=Uint8Array.from(atob(_B64),c=>c.charCodeAt(0));
  const ds=new DecompressionStream('gzip');
  const st=new Blob([bin]).stream().pipeThrough(ds);
  return JSON.parse(await new Response(st).text());
}
_load().then(d=>{window.DATA=d; "" ; (function(){ 
const D=DATA;
D.forEach(s=>{s._q=(s.n+' '+(s.town||'')+' '+(s.ad||'')+' '+(s.p||'')+' '+(s.cat||'')+' '+(s.src||'')+' '+(s.ps||'')+' '+(s.why||'')).toLowerCase()});
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
 SAVE=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const KEY='v2_'+TERR;
// ---------- FIELD LAYER: IndexedDB events + photos, offline-safe, versioned UI state ----------
const DB=new Promise((res,rej)=>{const r=indexedDB.open('field_'+TERR,1);
 r.onupgradeneeded=e=>{const d=e.target.result;
  if(!d.objectStoreNames.contains('visits'))d.createObjectStore('visits',{keyPath:'id'});
  if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});
  if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv',{keyPath:'k'})};
 r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e)});
async function idbPut(st,v){const d=await DB;return new Promise((res,rej)=>{const t=d.transaction(st,'readwrite');t.objectStore(st).put(v);t.oncomplete=res;t.onerror=rej})}
async function idbAll(st){const d=await DB;return new Promise((res,rej)=>{const q=d.transaction(st).objectStore(st).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=rej})}
async function idbGet(st,k){const d=await DB;return new Promise((res,rej)=>{const q=d.transaction(st).objectStore(st).get(k);q.onsuccess=()=>res(q.result);q.onerror=rej})}
let EV=[];           // in-memory mirror of visit events, newest last
let EVBY={};         // sid -> [events]
function reindexEV(){EVBY={};for(const e of EV){(EVBY[e.sid]=EVBY[e.sid]||[]).push(e)}}
// compatibility view: visits[sid] -> latest saved event for that shop (read-only)
const visits=new Proxy({},{get:(_,k)=>{const a=EVBY[k];if(!a||!a.length)return undefined;
 const e=a[a.length-1];return {...e,pin:e.gps?{lat:e.gps.lat,lng:e.gps.lng}:undefined,pinDate:e.gps?e.date:undefined}},
 ownKeys:()=>Object.keys(EVBY),getOwnPropertyDescriptor:()=>({enumerable:true,configurable:true})});
function uuid(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)}
function toast(msg){let t=document.getElementById('toast');
 if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}
 t.textContent=msg;t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>{t.style.display='none'},2600)}
// one-time migration of old localStorage visit logs into IndexedDB · never lose earlier fieldwork
async function bootField(){
 EV=await idbAll('visits'); EV.sort((a,b)=>(a.ts||0)-(b.ts||0));
 if(!LS(KEY+'_idb_migrated',0)){
  const oldV=LS(KEY+'_visits',{});
  for(const sid in oldV){const v=oldV[sid];
   const e={id:'mig-'+sid,sid,ts:v.ts||Date.now(),date:v.date||'',outcome:v.outcome||'',note:v.note||'',rep:REP,migrated:1,synced:false,
     gps:v.pin?{lat:v.pin.lat,lng:v.pin.lng,src:'saved pin',date:v.pinDate||''}:null};
   await idbPut('visits',e); EV.push(e)}
  SAVE(KEY+'_idb_migrated',1)}
 reindexEV()}

function saveUI(){try{SAVE(KEY+'_ui',{v:DATAVER,view:VIEW,q:Q,filt:[...FILT],catf:[...CATF],sort:SORT,cap:CAP,y:scrollY,shop:SHOP,stack:NAVSTACK.slice(-12)})}catch(e){}}
function restoreUI(){
 const u=LS(KEY+'_ui',null); if(!u)return false;
 // migrate saved state across data versions: keep place, reset volatile caches
 VIEW=u.view||'today';Q=u.q||'';FILT=new Set(u.filt||[]);CATF=new Set(u.catf||[]);SORT=u.sort||'pot';
 CAP=u.v===DATAVER?(u.cap||150):150;NAVSTACK=(u.stack||[]).filter(x=>x&&x.view);
 if(u.shop&&D.find(x=>x.id===u.shop))SHOP=u.shop;
 setTimeout(()=>scrollTo(0,u.v===DATAVER?(u.y||0):0),60);
 return true}

let RT=LS(KEY+'_rt',null);   // {date, stops:[ids], idx, done:{id:eventId}, skipped:{id:reason}, undo:[]}
function rtActive(){return RT&&RT.stops&&RT.stops.length&&RT.idx<RT.stops.length}
function rtStart(){const r=buildRoute();if(!r.town){toast('No verified stops available');return}
 RT={date:lday(),town:r.town,stops:r.stops.map(s=>s.id),idx:0,done:{},skipped:{},undo:[]};
 SAVE(KEY+'_rt',RT);go('route')}
function rtReset(){RT=null;localStorage.removeItem(KEY+'_rt');render()}  // clears route session ONLY · visits stay
function rtAdvance(){if(!RT)return;RT.undo.push(RT.idx);RT.idx++;SAVE(KEY+'_rt',RT)}
function rtUndo(){if(RT&&RT.undo.length){RT.idx=RT.undo.pop();SAVE(KEY+'_rt',RT);render()}}
function rtSkip(id,reason){if(!RT)return;RT.skipped[id]=reason||'skipped';rtAdvance();render();toast('Stop skipped · '+(reason||''))}

const R=6371000, rad=x=>x*Math.PI/180;
function dist(a,b,c,d){const p1=rad(a),p2=rad(c),dp=rad(c-a),dl=rad(d-b);

function buildRoute(){

  const sum=v.reduce((x,y)=>x+y.sc,0); if(!best||sum>best.sum)best={town:t,stops:v,sum}}

 while(best.stops.length){const l=ord[ord.length-1];
  let bi=0,bd=Infinity;
  best.stops.forEach((s,i)=>{const d=dist(l.la,l.ln,s.la,s.ln);if(d<bd){bd=d;bi=i}});
  ord.push(best.stops.splice(bi,1)[0])}

 ord.forEach(s=>{
  const near=D.filter(x=>!used.has(x.id)&&x.la!=null&&x.sc>=40&&actionable(x))
   .map(x=>[dist(s.la,s.ln,x.la,x.ln),x]).filter(t=>t[0]<=600)
   .sort((a,b)=>(b[1].sc-a[1].sc)||(a[0]-b[0]));
  if(near.length){s._bk=near[0][1];s._bkd=Math.round(near[0][0]);used.add(near[0][1].id)}});
 return{town:best.town,stops:ord}}

 const item=f=>`<div class="card mini mini2 m-call">

   <div class="acts"><button class="ab pri" onclick="openVisit('${f.sid}','follow-up')">Log Visit</button>
    ${f.s.p?`<a class="ab" href="tel:${tel(f.s.p)}">Call</a>`:''}

 return `<header class="top"><h1>Follow-ups</h1><p class="sub">${all.length} open · nothing disappears when overdue</p></header><div class="wrap">

// ---------- ROUTER, BACK STACK, SHEET, FILTERS, SORT, CHUNKED LISTS ----------
let VIEW='today', Q='', SHOP=null, FILT=new Set(), CATF=new Set(), SORT='pot', CAP=150, GEO=null;
let NAVSTACK=[];
function snap(){return{view:VIEW,q:Q,filt:[...FILT],catf:[...CATF],sort:SORT,cap:CAP,y:scrollY}}
function go(v){NAVSTACK.push(snap());if(NAVSTACK.length>40)NAVSTACK.shift();
 try{history.pushState(0,'')}catch(e){}
 VIEW=v;Q='';FILT=new Set();CATF=new Set();CAP=150;render();scrollTo(0,0)}
function goBack(){
 if(SHOP){closeSheet();return}
 const st=NAVSTACK.pop();
 if(st){VIEW=st.view;Q=st.q;FILT=new Set(st.filt);CATF=new Set(st.catf);SORT=st.sort;CAP=st.cap;
  render();setTimeout(()=>scrollTo(0,st.y||0),40)}
 else if(VIEW!=='today'){VIEW='today';render();scrollTo(0,0)}}
addEventListener('popstate',()=>{if(SHOP||NAVSTACK.length||VIEW!=='today')goBack()});
function navGo(k){if(VIEW!==k)go(k)}
function clearQ(){Q='';CAP=150;render()}
function skip(id){skips[id]=1;SAVE(KEY+'_skips',skips);render()}
// ----- filters -----
const FN={allrec:()=>true,cust:isCust,prospects:s=>s.t&&s.t!=='D',ready:s=>s.t==='A',call:s=>s.t==='B',
 near:s=>s.t==='C',research:s=>s.t==='D',
 dorm:s=>(s.yol||s.myco)&&s.mso!=null&&s.mso>=6&&s.mso<=18,
 lapsed:s=>(s.yol||s.myco)&&s.mso!=null&&s.mso>18,
 onlyyol:s=>s.yol&&!s.myco,onlymyco:s=>s.myco&&!s.yol,both:s=>s.yol&&s.myco,
 noorder:s=>/^ACCOUNT EXISTS/.test(s.ps),
 newd:s=>s.t&&s.dt&&new Date(s.dt)>Date.now()-7*864e5,
 look:s=>(s.t==='A'||s.t==='B')&&s.simt>=3,
 react:s=>/REACTIVATED/.test(s.ps),
 fu:s=>/FOLLOW-UP|DECISION-MAKER/.test(s.ps)||(s.field&&/FOLLOW-UP|UNAVAILABLE/.test(s.field.outcome)),
 audit:s=>!actionable(s),
 locok:s=>s.pl<=3,locres:s=>!!s.lf,loccall:s=>s.pl===4,locwrong:s=>s.pl===6,locnone:s=>s.pl===7,
 nearrec:s=>/nearby/i.test(s.src||''),fresh:s=>/fresh search/i.test(s.src||''),notus:s=>/^NOT FOR US/.test(s.ps)};
const QUICKF=[['cust','Customers'],['prospects','New Prospects'],['ready','Ready to Visit'],['dorm','Dormant'],['lapsed','Lapsed']];
const LOCFQ=[['locok','Correct Address'],['locres','Location Research'],['loccall','Call to Confirm'],['locwrong','Wrong Pin'],['locnone','No Valid Location'],['nearrec','Nearby Shop Recovered'],['notus','Not for Us']];
const MOREF=[['call','Call First'],['near','Check Nearby'],['research','Research Required'],['onlyyol','Only YOL'],['onlymyco','Only MYCO'],['both','Customers of Both'],['noorder','No Order'],['newd','Recently Discovered'],['fresh','Fresh Search Only'],['look','Lookalikes'],['react','Reactivated'],['fu','Follow-ups'],['audit','Audit Only']];
function setF(k){FILT.has(k)?FILT.delete(k):FILT.add(k);CAP=150;render()}
function setOnly(k){FILT=(k==='allrec'||FILT.size===1&&FILT.has(k))?new Set():new Set([k]);CAP=150;render()}
function setCat(c){CATF.has(c)?CATF.delete(c):CATF.add(c);CAP=150;render()}

function openFilters(){
 const d=document.createElement('div');d.id='filtbg';d.className='sheetbg';d.onclick=e=>{if(e.target===d)closeFilters()};
 d.innerHTML=`<div class="sheet"><div class="grab"></div><h3>Filters</h3>
 <p class="sub">${FILT.size+CATF.size} applied · combined live across the complete dataset</p>
 <h2>Status</h2><div class="chips">${[...QUICKF,...MOREF].map(([k,l])=>`<button class="chip${FILT.has(k)?' on':''}" onclick="setF('${k}');reFilters()">${l}</button>`).join('')}</div>
 <h2>Location</h2><div class="chips">${LOCFQ.map(([k,l])=>`<button class="chip${FILT.has(k)?' on':''}" onclick="setF('${k}');reFilters()">${l}</button>`).join('')}</div>
 <h2>Business category</h2><div class="chips">${Object.entries(ROOTN).map(([k,l])=>`<button class="chip${CATF.has(k)?' on':''}" onclick="setCat('${k}');reFilters()">${l}</button>`).join('')}</div>
 <div class="stick"><button class="btn ghost" onclick="clearF()">Clear all</button><button class="btn gold" onclick="closeFilters()">Done</button></div>
 </div>`;
 document.body.appendChild(d)}

// ----- sorting -----
function gd(s){return (GEO&&s.la!=null)?dist(GEO.lat,GEO.lng,s.la,s.ln):9e9}
const SORTF={pot:(a,b)=>(b.sc||0)-(a.sc||0),name:(a,b)=>a.n.localeCompare(b.n),
 recent:(a,b)=>String(b.dt||'').localeCompare(String(a.dt||'')),
 dorm:(a,b)=>(b.mso||-1)-(a.mso||-1),lastord:(a,b)=>(a.mso??999)-(b.mso??999),
 road:(a,b)=>String(a.ad||'~').localeCompare(String(b.ad||'~')),
 conf:(a,b)=>(a.pl||9)-(b.pl||9),near:(a,b)=>gd(a)-gd(b)};
const SORTN={pot:'Highest potential',near:'Nearest',recent:'Recently discovered',dorm:'Longest dormant',lastord:'Last order',name:'Name',road:'Road',conf:'Location confidence'};
function openSort(){
 const d=document.createElement('div');d.id='sortbg';d.className='sheetbg';d.onclick=e=>{if(e.target===d)d.remove()};
 d.innerHTML=`<div class="sheet"><div class="grab"></div><h3>Sort by</h3>
 ${Object.entries(SORTN).map(([k,l])=>`<div class="rowl bkt" onclick="document.getElementById('sortbg').remove();setSort('${k}')"><b style="min-width:24px;display:inline-block;color:${SORT===k?'var(--ac)':'transparent'}">✓</b>${l}</div>`).join('')}
 <div style="height:14px"></div></div>`;
 document.body.appendChild(d)}
function setSort(v){SORT=v;
 if(v==='near'&&!GEO&&navigator.geolocation)navigator.geolocation.getCurrentPosition(
  p=>{GEO={lat:p.coords.latitude,lng:p.coords.longitude};render()},()=>{},{timeout:6000});
 render()}
// ----- shared list body: search + chips + filters + sort + chunked full list -----
function searchAll(base){
 const q=Q.toLowerCase();
 return base.filter(s=>s._q.includes(q))}
function applyAll(base){
 let L=base;
 if(FILT.size)L=L.filter(s=>[...FILT].some(k=>FN[k](s)));
 if(CATF.size)L=L.filter(s=>CATF.has(s.rt));
 if(Q)L=searchAll(L);
 return L.slice().sort(SORTF[SORT]||SORTF.pot)}
function listBody(base){
 const L=applyAll(base);
 return `<div class="homesearch"><input id="q" placeholder="Search all ${base.length.toLocaleString()} records…" autocomplete="off" value="${esc(Q)}">${Q?'<button class="qclear" onclick="clearQ()">✕</button>':''}</div>
 <div class="frow"><button class="fchip${!FILT.size?' on':''}" onclick="setOnly('allrec')">All</button>
 ${QUICKF.slice(0,4).map(([k,l])=>`<button class="fchip${FILT.has(k)?' on':''}" onclick="setF('${k}')">${l}</button>`).join('')}</div>
 <div class="ctl"><button class="fchip" onclick="openSort()"><svg viewBox="0 0 24 24"><path d="M11 8h9M11 12h6M11 16h3M6 4v16m0 0l-3-3m3 3l3-3" stroke-linecap="round" stroke-linejoin="round"/></svg>${SORTN[SORT]}</button>
 <button class="fchip${FILT.size+CATF.size?' on':''}" onclick="openFilters()"><svg viewBox="0 0 24 24"><path d="M4 5h16l-6.5 8v5L10 20v-7z" stroke-linecap="round" stroke-linejoin="round"/></svg>Filters${FILT.size+CATF.size?`<span class="fbadge">${FILT.size+CATF.size}</span>`:''}</button></div>
 ${Q||FILT.size||CATF.size?`<div class="count">${L.length.toLocaleString()} of ${base.length.toLocaleString()} match</div>`:''}
 ${listChunk(L)}`}
function listChunk(L){
 window._L=L;
 const done=L.length<=CAP;
