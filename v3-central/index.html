:root{
 --bg:#FAFAF7;--nav:#FAFAF7;--sf:#F2F2ED;--sf2:#ECECE6;--sf3:#E3E3DC;
 --bd:rgba(24,25,28,.10);--bd2:rgba(24,25,28,.22);
 --tx:#191A1C;--mu:#5F646C;--mu2:#989CA4;
 --ac:#1F6B4E;--acT:#FFFFFF;--acD:#175A42;--acW:rgba(23,90,66,.08);
 --ok:#1F6B4E;--okW:rgba(23,90,66,.09);
 --sky:#2B6CB0;--skyW:rgba(43,108,176,.09);
 --teal:#0F766E;--tealW:rgba(15,118,110,.09);
 --rose:#B4434E;--roseW:rgba(180,67,78,.09);
 --warn:#8A6410;--bad:#B4434E;--plum:#0F766E;--nvy:#F2F2ED;--acsel:rgba(23,90,66,.10);
 --e:cubic-bezier(.32,.72,0,1);--t1:.12s;--t2:.2s;--t3:.3s;
 --shadow:0 10px 30px rgba(25,26,28,.10),0 2px 8px rgba(25,26,28,.06);
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--tx);
 font:15px/1.5 'Outfit',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 font-variant-numeric:tabular-nums;
 padding-bottom:calc(70px + var(--safe-b))}
h1{font-size:27px;font-weight:800;letter-spacing:-.035em;margin:2px 0 2px}
h2{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mu2);margin:24px 0 6px}
h3{font-size:15.5px;font-weight:650;letter-spacing:-.015em;margin:0 0 3px}
.sub,.meta{color:var(--mu);font-size:13px;line-height:1.45;margin:0}
.sub{margin-bottom:8px}
.count{color:var(--mu2);font-size:12px;margin:8px 2px}
.wrap{padding:8px 18px 24px;max-width:760px;margin:0 auto}
header.top{padding:calc(14px + var(--safe-t)) 18px 4px;max-width:760px;margin:0 auto}
#backbtn{position:fixed;top:calc(10px + var(--safe-t));left:12px;z-index:70;width:36px;height:36px;border-radius:999px;
 border:1px solid var(--bd2);background:var(--bg);color:var(--tx);font-size:19px;line-height:1;
 display:none;align-items:center;justify-content:center;padding:0 0 2px;cursor:pointer}
.hasback header.top{padding-left:58px}
.homesearch{position:sticky;top:var(--safe-t);z-index:35;background:linear-gradient(180deg,var(--bg) 84%,transparent);padding:8px 0;display:flex;gap:8px;align-items:center}
.homesearch input,.search{flex:1;width:100%;height:46px;padding:10px 13px 10px 40px;font-size:16px;border-radius:12px;border:1px solid var(--bd2);
 background:#FFFFFF url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%235F646C%22 stroke-width=%222%22%3E%3Ccircle cx=%2210.5%22 cy=%2210.5%22 r=%226.5%22/%3E%3Cpath d=%22M15.5 15.5L21 21%22/%3E%3C/svg%3E') 14px 50% no-repeat;
 color:var(--tx);outline:none;-webkit-appearance:none;margin:0;font-family:inherit;transition:border-color var(--t2) var(--e)}
.homesearch input:focus,.search:focus{border-color:var(--ac)}
.homesearch input::placeholder{color:var(--mu2)}
.qclear{flex:0 0 auto;width:40px;height:40px;border-radius:999px;border:1px solid var(--bd);background:#fff;
 color:var(--mu);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.panel{background:none;border-radius:0;padding:0;margin:18px 0;font-size:14px}
.panel>b{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--mu2);padding:0 0 6px;border-bottom:1px solid var(--bd2);margin-bottom:2px}
.panel.alert{padding-left:12px;border-left:3px solid var(--warn)}
.panel.alert>b{color:var(--warn);border-bottom-color:rgba(138,100,16,.3)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rowl{display:block;padding:12px 0;border-bottom:1px solid var(--bd);font-size:14px}
.panel .rowl:last-child,.rowl:last-child{border-bottom:0}
.bkt{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bkt b{color:var(--tx);font-variant-numeric:tabular-nums;font-weight:650;min-width:40px;text-align:right;order:2}
.bkt span.lbl{flex:1}
.bkt:active{background:var(--sf)}
.bkt .meta{width:100%}
.frow{display:flex;gap:6px;overflow-x:auto;padding:6px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.fchip,.chip{flex:0 0 auto;padding:9px 14px;border-radius:10px;background:transparent;color:var(--mu);
 border:1px solid var(--bd2);font-size:13px;font-weight:550;cursor:pointer;font-family:inherit;white-space:nowrap}
.fchip.on,.chip.on{background:var(--acW);color:var(--ac);font-weight:650;border-color:var(--ac)}
.card{background:transparent;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:12px 0;margin:0;
 content-visibility:auto;contain-intrinsic-size:auto 108px}
.card.mini{cursor:pointer}
.card.mini:active{background:var(--sf)}
.mini2{display:grid;grid-template-columns:34px 1fr 12px;gap:12px;align-items:flex-start;padding:13px 0 12px 10px;border-left:0;position:relative;overflow:hidden}
.mini2::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:transparent}
.mini2 .cic{width:34px;height:34px;border-radius:9px;background:var(--sf);display:flex;align-items:center;justify-content:center;margin-top:1px}
.mini2 .cic svg{width:18px;height:18px;stroke:var(--mu);stroke-width:1.6;fill:none}
.cic.av-grocery{background:rgba(31,107,78,.10)}.cic.av-grocery svg{stroke:#1F6B4E}
.cic.av-pharmacy{background:rgba(180,67,78,.10)}.cic.av-pharmacy svg{stroke:#B4434E}
.cic.av-beauty{background:rgba(163,66,128,.10)}.cic.av-beauty svg{stroke:#A34280}
.cic.av-herbal{background:rgba(15,118,110,.10)}.cic.av-herbal svg{stroke:#0F766E}
.cic.av-puja{background:rgba(158,113,24,.12)}.cic.av-puja svg{stroke:#8A6410}
.cic.av-pet{background:rgba(164,92,38,.12)}.cic.av-pet svg{stroke:#A45C26}
.cic.av-liquor{background:rgba(109,63,178,.10)}.cic.av-liquor svg{stroke:#6D3FB2}
.cic.av-variety{background:rgba(43,108,176,.10)}.cic.av-variety svg{stroke:#2B6CB0}
.mini2 .nm{font-size:15.5px;font-weight:650;line-height:1.28;letter-spacing:-.015em}
.mini2 .st{font-size:12px;font-weight:650;margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mini2 .meta{font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu)}
.mini2 .nextact{font-size:12.5px;font-weight:650;margin-top:5px}
.mini2 .chev{color:var(--mu2);font-size:15px;align-self:center}
.acts{display:flex;gap:7px;margin-top:10px;grid-column:1/4;align-items:center}
.acts .ab{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;
 border-radius:9px;border:1px solid var(--bd2);background:transparent;color:var(--tx);font-size:12.5px;font-weight:600;
 text-decoration:none;cursor:pointer;font-family:inherit;gap:5px}

async function _load(){
  const bin=Uint8Array.from(atob(_B64),c=>c.charCodeAt(0));
  const ds=new DecompressionStream('gzip');
  const st=new Blob([bin]).stream().pipeThrough(ds);
  return JSON.parse(await new Response(st).text());
}
_load().then(d=>{window.DATA=d; "" ; (function(){ 
const D=DATA;
D.forEach(s=>{s._q=(s.n+' '+(s.town||'')+' '+(s.ad||'')+' '+(s.p||'')+' '+(s.cat||'')+' '+(s.src||'')+' '+(s.ps||'')+' '+(s.why||'')).toLowerCase();
 s._qd=(''+(s.p||'')).replace(/\D/g,''); s._qs=s.n.toLowerCase().replace(/[^a-z0-9]/g,'')});
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
 SAVE=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const KEY='v2_'+TERR;
// ---------- FIELD LAYER: IndexedDB events + photos, offline-safe, versioned UI state ----------
const DB=new Promise((res,rej)=>{const r=indexedDB.open('field_'+TERR,1);
 r.onupgradeneeded=e=>{const d=e.target.result;
  if(!d.objectStoreNames.contains('visits'))d.createObjectStore('visits',{keyPath:'id'});
  if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});
  if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv',{keyPath:'k'})};
 r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e)});
async function idbPut(st,v){const d=await DB;return new Promise((res,rej)=>{const t=d.transaction(st,'readwrite');t.objectStore(st).put(v);t.oncomplete=res;t.onerror=rej})}
async function idbAll(st){const d=await DB;return new Promise((res,rej)=>{const q=d.transaction(st).objectStore(st).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=rej})}
async function idbGet(st,k){const d=await DB;return new Promise((res,rej)=>{const q=d.transaction(st).objectStore(st).get(k);q.onsuccess=()=>res(q.result);q.onerror=rej})}
let EV=[];           // in-memory mirror of visit events, newest last
let EVBY={};         // sid -> [events]

  <button class="${PTAB==='ord'?'on':''}" onclick="setPTab('ord')">Orders</button>
  <button class="${PTAB==='ev'?'on':''}" onclick="setPTab('ev')">Evidence</button>
 </div>
 ${body}
 <div class="stick">
  <button class="btn gold" onclick="openVisit('${s.id}','profile')">Log Visit</button>
  ${dr?`<a class="btn ghost" href="${s.g||('https://www.google.com/maps/dir/?api=1&destination='+s.la+','+s.ln)}" target="_blank" rel="noopener">Directions</a>`:(s.p?`<a class="btn ghost" href="tel:${tel(s.p)}">Call first</a>`:'')}
  <button class="btn ghost" onclick="moreSheet('${s.id}')">More</button>
 </div></div>`;
 document.body.appendChild(d)}
function moreSheet(id){
 const s=D.find(x=>x.id===id);if(!s)return;
 const d=document.createElement('div');d.className='sheetbg';d.id='morebg';d.style.zIndex=70;
 d.onclick=e=>{if(e.target===d)d.remove()};
 d.innerHTML=`<div class="sheet"><div class="grab"></div>
 ${s.p?`<a class="btn ghost wide" href="tel:${tel(s.p)}">Call ${tel(s.p)}</a>
 <a class="btn ghost wide" href="https://wa.me/1868${s.p}" target="_blank" rel="noopener">WhatsApp</a>
 <a class="btn ghost wide" href="https://wa.me/1868${s.p}?text=${encodeURIComponent('Good day! Yusuf Overseas here. Please share your shop location pin on WhatsApp so our delivery reaches the right entrance. Thank you!')}" target="_blank" rel="noopener">Request customer pin</a>`:''}
 <button class="btn ghost wide" onclick="document.getElementById('morebg').remove();openVisit('${id}','list')">Log Visit</button>
 ${routable(s)&&(s.g||s.la!=null)?`<a class="btn ghost wide" href="${s.g||('https://www.google.com/maps/dir/?api=1&destination='+s.la+','+s.ln)}" target="_blank" rel="noopener">Directions</a>`:''}
 <button class="btn ghost wide" onclick="document.getElementById('morebg').remove();logVisit('${id}','Follow-up required')">Set follow-up</button>
 <div style="height:14px"></div></div>`;
 document.body.appendChild(d)}
window.moreSheet=moreSheet;
function fab(){
 let f=document.getElementById('fab');
 if(!f){f=document.createElement('button');f.id='fab';f.innerHTML='+ Log Visit';
  f.onclick=()=>{const q=prompt('Business name to log a visit for:');if(!q)return;
   const m=searchAllByName(q);if(!m){toast('No match · open the customer and use Log Visit');return}
   openVisit(m.id,'quick log')};document.body.appendChild(f)}
 f.style.display=(SHOP||VIEW!=='today'||document.getElementById('visitbg'))?'none':'flex'}
function searchAllByName(q){q=q.toLowerCase();return D.find(s=>s.n.toLowerCase().includes(q))}
function topFab(){
 let f=document.getElementById('topfab');
 if(!f){f=document.createElement('button');f.id='topfab';f.textContent='\u2191';f.onclick=()=>scrollTo({top:0,behavior:'smooth'});document.body.appendChild(f);
  addEventListener('scroll',()=>{f.style.display=scrollY>700?'flex':'none'},{passive:true})}}
function updateBack(){topFab();
 let bb=document.getElementById('backbtn');
 if(!bb){bb=document.createElement('button');bb.id='backbtn';bb.textContent='‹';
  bb.onclick=goBack;document.body.appendChild(bb)}
 fab();
 const show=SHOP||VIEW!=='today';
 bb.style.display=show?'flex':'none';
 document.body.classList.toggle('hasback',!!show)}
const ICON={today:'M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10',
 route:'M4 19c4-1 4-6 8-6s4 5 8 4M6 5a2 2 0 100 4 2 2 0 000-4zm12 8a2 2 0 100 4 2 2 0 000-4z',
 areas:'M9 20l-6-2V4l6 2m0 14l6-2m-6 2V6m6 12l6 2V6l-6-2m0 14V4M9 6l6-2',
 disc:'M10.5 4a6.5 6.5 0 104.6 11.1L21 21m-5.9-5.9A6.5 6.5 0 0010.5 4z',
 customers:'M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2m20 0v-2a4 4 0 00-3-3.87M15 3.13A4 4 0 0115 11M9 11a4 4 0 100-8 4 4 0 000 8z',
 opp:'M12 2l2.9 6.3 6.9.6-5.2 4.6 1.6 6.7L12 16.9 5.8 20.2l1.6-6.7L2.2 8.9l6.9-.6z',
 follow:'M12 8v5l3 2M12 22a10 10 0 110-20 10 10 0 010 20z',
 more:'M5 12a1 1 0 102 0 1 1 0 00-2 0zm6 0a1 1 0 102 0 1 1 0 00-2 0zm6 0a1 1 0 102 0 1 1 0 00-2 0z'};
function nav(){
 const items=[['today','Home'],['customers','Customers'],['areas','Areas'],['route','Route'],['more','More']];
 return `<nav class="bot">${items.map(([k,t])=>`<a class="${VIEW===k||(k==='more'&&['fieldwork','audit'].includes(VIEW))?'on':''}" onclick="navGo('${k}')">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[k]||ICON.more}"/></svg>${t}</a>`).join('')}</nav>`}
function vCoverage(){
 const L=COVST.ledger;
 const kv=(k,v)=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`;
 return `<header class="top"><div class="ovl">${TITLE}</div><h1>Coverage</h1><p class="sub">${TITLE} · the permanent area ledger drives discovery; no area is called finished off one empty search</p></header><div class="wrap">
 <div class="panel"><b>AREA MASTER LIST · ${TITLE.split(' ')[0].toUpperCase()}</b>
 ${kv('Areas in master list',COVST.areas)}
 ${kv('Never searched',COVST.never)}
 ${kv('Partially searched',COVST.partial)}
 ${kv('Well searched',COVST.well)}
 ${kv('Real areas beyond OpenStreetMap',COVST.beyond_osm)}
 ${kv('Possible-same-area pairs (review, never merged)',COVST.review_pairs)}
 </div>
 <div class="panel"><b>SETTLEMENT RESEARCH STATUS</b>
 ${Object.entries(L).map(([k,v])=>kv(k,v)).join('')}
 </div>
 <div class="panel"><b>SEARCH QUEUES</b>
 ${kv('Queue A · customer locations',DISCST.a.done.toLocaleString()+' of '+DISCST.a.q.toLocaleString())}
 ${kv('Queue B · unexplored areas',DISCST.b.done.toLocaleString()+' of '+DISCST.b.q.toLocaleString())}
 ${kv('Stage 3 · social-business searches',COVST.socd+' of '+COVST.socq)}
 </div>
 <div class="row"><button class="btn ghost wide" onclick="go('fd')">Field-discovery areas</button></div>
 </div>`}
function vMore(){
 return `<header class="top"><div class="ovl">${TITLE}</div><h1>More</h1><p class="sub">${TITLE} · ${D.length.toLocaleString()} records preserved</p></header><div class="wrap">
 ${[['disc','Discover','New-business discovery engine'],['follow','Follow-ups','Due, overdue and upcoming'],['fieldwork','My fieldwork','Real saved visit events'],['coverage','Coverage','Area master list and discovery progress'],['hand','Handoffs','Customers handed to the representative'],['opp','Opportunities','Seven engines, ranked by evidence'],
    ['audit','Audit','Everything preserved, nothing recommended']].map(([k,t,d])=>
  `<div class="card" onclick="go('${k}')" style="cursor:pointer"><h3>${t}</h3><div class="meta">${d}</div></div>`).join('')}
 <div class="card"><h3>Export visits</h3><div class="meta">Downloads every saved visit event as JSON · share to WhatsApp or email as backup. Visits live on this device until exported.</div>
  <div class="row" style="margin-top:8px"><button class="btn ghost wide" onclick="exportVisits()">Export ${EV.length} events</button></div></div>
 <div class="card"><h3>Data version</h3><div class="meta">Build ${DATAVER} · ${D.length.toLocaleString()} records · visits stored in IndexedDB (survive upgrades and Repair)</div></div>
 <div class="card"><h3>Repair app</h3><div class="meta">Clears the cached copy on this phone and reloads the newest build.</div>
  <div class="row" style="margin-top:8px"><button class="btn ghost wide" onclick="repair()">Repair now</button></div></div>
 </div>`}
async function repair(){try{const ks=await caches.keys();for(const k of ks)await caches.delete(k)}catch(e){}
 localStorage.removeItem(KEY+'_cache');location.reload()}
async function exportVisits(){
 const all=await idbAll('visits');
 const blob=new Blob([JSON.stringify({territory:TERR,exported:new Date().toISOString(),events:all},null,1)],{type:'application/json'});
 const f=new File([blob],'visits-'+TERR+'-'+lday()+'.json',{type:'application/json'});
 const mark=async()=>{const ts=Date.now();for(const e of all){e.exported=ts;await idbPut('visits',e)}EV.forEach(e=>e.exported=e.exported||ts)};
 if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Visit export'});await mark();render();return}catch(e){}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click();await mark();toast('Export started');render()}
window.exportVisits=exportVisits;
window.go=go;window.navGo=navGo;window.clearQ=clearQ;window.goBack=goBack;window.openShop=openShop;window.openSheet=openSheet;window.closeSheet=closeSheet;window.skip=skip;window.logVisit=logVisit;window.setF=setF;window.setOnly=setOnly;window.setCat=setCat;window.clearF=clearF;window.openFilters=openFilters;window.closeFilters=closeFilters;window.reFilters=reFilters;window.setSort=setSort;window.openSort=openSort;
window.saveHere=saveHere;window.repair=repair;window.render=render;
function render(){
 let h='';
 if(VIEW==='today')h=vToday();else if(VIEW==='route')h=vRoute();
 else if(VIEW==='opp')h=vOpp();else if(VIEW==='follow')h=vFollow();
 else if(VIEW==='more')h=vMore();else if(VIEW==='customers')h=vCustomers();
 else if(VIEW==='fieldwork')h=vFieldwork();else if(VIEW==='audit')h=vAudit();
 else if(VIEW==='areas')h=vAreas();else if(VIEW==='hand')h=vHandoffs();
 else if(VIEW.startsWith('list:'))h=vList(VIEW.slice(5));
 else if(VIEW==='disc')h=vDiscover();else if(VIEW==='fd')h=vFD();else if(VIEW==='coverage')h=vCoverage();
 else if(VIEW.startsWith('area:'))h=vArea(decodeURIComponent(VIEW.slice(5)));
 else if(VIEW.startsWith('like:'))h=vLike(VIEW.slice(5));
 else if(VIEW.startsWith('eng:'))h=vEngine(VIEW.slice(4));
 else if(VIEW.startsWith('aud:'))h=vAuditList(decodeURIComponent(VIEW.slice(4)));
 else h=vToday();
 document.getElementById('app').innerHTML=h+nav();
 const q=document.getElementById('q');
 if(q){q.oninput=e=>{Q=e.target.value;CAP=150;clearTimeout(window._qd);window._qd=setTimeout(()=>{render();
  const q2=document.getElementById('q');if(q2){q2.focus();q2.setSelectionRange(q2.value.length,q2.value.length)}},150)}}
 const ss=document.getElementById('sortsel');
 if(ss)ss.onchange=e=>setSort(e.target.value);
 bindMore();updateBack();saveUI()}
loadDraft();
bootField().then(()=>{
 if(!restoreUI())VIEW='today';
 render();
 if(VD&&VD.sid){toast('Unsaved visit draft restored');drawVisit()}
 const _dl=new URLSearchParams(location.search).get('sid');
 if(_dl&&D.some(x=>x.id===_dl)){SHOP=_dl;drawSheet()}
});
addEventListener('online',()=>{render()});addEventListener('offline',()=>{render()});
 })();})
 .catch(e=>{document.getElementById('app').innerHTML='<div class="wrap"><div class="empty"><b>Could not load data</b>'+e+'</div></div>'});
</script>
