:root{
 --bg:#F4F1EA;--paper:#FFFDF8;--carbon:#161512;--carbon2:#221F1A;
 --tx:#1B1A17;--mu:#6B675E;--mu2:#9C978B;--bone:#F4F1EA;--boneD:#B7B2A6;
 --line:rgba(27,26,23,.12);--line2:rgba(27,26,23,.26);
 --acc:#E8622C;--accT:#C24E1F;--slate:#44607A;--pos:#2F6B4F;--amb:#9A6A00;--neg:#A63D3D;
 --bd:var(--line);--bd2:var(--line2);--sf:#ECE8DF;--sf2:#E4DFD4;--sf3:#D9D3C6;
 --ac:var(--accT);--acT:#1B1A17;--acD:var(--acc);--acW:rgba(232,98,44,.10);
 --ok:var(--pos);--okW:rgba(47,107,79,.10);--sky:var(--slate);--skyW:rgba(68,96,122,.10);
 --teal:var(--slate);--tealW:rgba(68,96,122,.10);--rose:var(--neg);--roseW:rgba(166,61,61,.10);
 --warn:var(--amb);--bad:var(--neg);--plum:var(--slate);--nvy:#ECE8DF;--acsel:rgba(232,98,44,.14);
 --e:cubic-bezier(.3,.7,0,1);--t1:.12s;--t2:.2s;--t3:.3s;
 --shadow:0 12px 34px rgba(22,21,18,.16),0 2px 8px rgba(22,21,18,.08);
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--tx);
 font:15px/1.5 'Outfit',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 font-variant-numeric:tabular-nums;padding-bottom:calc(96px + var(--safe-b))}
h1{font-size:30px;font-weight:850;letter-spacing:-.04em;margin:2px 0}
h2{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mu2);margin:24px 0 6px}
h3{font-size:16px;font-weight:700;letter-spacing:-.015em;margin:0 0 3px}
.sub,.meta{color:var(--mu);font-size:13px;line-height:1.45;margin:0}
.sub{margin-bottom:6px}
.count{color:var(--mu2);font-size:12px;margin:8px 2px}
.wrap{padding:14px 18px 24px;max-width:760px;margin:0 auto}
header.top{background:var(--carbon);color:var(--bone);padding:calc(16px + var(--safe-t)) 18px 18px;border-radius:0 0 24px 24px}
header.top h1{color:var(--bone)}
header.top .sub{color:var(--boneD)}
header.top .ovl{color:var(--acc)}
header.top .sync{color:var(--boneD)}
#backbtn{position:fixed;top:calc(12px + var(--safe-t));left:14px;z-index:55;width:36px;height:36px;border-radius:12px;
 border:0;background:rgba(244,241,234,.14);color:var(--bone);font-size:19px;line-height:1;
 display:none;align-items:center;justify-content:center;padding:0 0 2px;cursor:pointer}
.hasback header.top{padding-left:60px}
.homesearch{position:sticky;top:var(--safe-t);z-index:35;background:none;padding:8px 0;display:flex;gap:8px;align-items:center}
header.top .homesearch{position:static}
.homesearch input,.search{flex:1;width:100%;height:48px;padding:10px 14px 10px 42px;font-size:16px;border-radius:14px;border:0;
 background:#FFFDF8 url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%236B675E%22 stroke-width=%222.2%22%3E%3Ccircle cx=%2210.5%22 cy=%2210.5%22 r=%226.5%22/%3E%3Cpath d=%22M15.5 15.5L21 21%22/%3E%3C/svg%3E') 15px 50% no-repeat;
 color:var(--tx);outline:none;-webkit-appearance:none;margin:0;font-family:inherit;box-shadow:0 1px 0 rgba(22,21,18,.08)}
.homesearch input:focus,.search:focus{box-shadow:0 0 0 2px var(--acc)}
.homesearch input::placeholder{color:var(--mu2)}
.qclear{flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:0;background:rgba(27,26,23,.08);
 color:var(--mu);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
header.top .qclear{background:rgba(244,241,234,.16);color:var(--bone)}
.panel{background:none;border-radius:0;padding:0;margin:20px 0;font-size:14px}
.panel>b{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--mu2);padding:0 0 8px}
.panel>b::before{content:'';width:18px;height:3px;border-radius:2px;background:var(--acc)}
.panel.alert>b{color:var(--amb)}
.panel.alert>b::before{background:var(--amb)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rowl{display:block;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.panel .rowl:last-child,.rowl:last-child{border-bottom:0}
.bkt{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bkt b{color:var(--tx);font-variant-numeric:tabular-nums;font-weight:700;min-width:40px;text-align:right;order:2}
.bkt span.lbl{flex:1}
.bkt:active{background:rgba(27,26,23,.05)}
.bkt .meta{width:100%}
.lhead{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.fpill{border:1.5px solid var(--tx);background:none;color:var(--tx);border-radius:999px;height:44px;padding:0 16px;
 font:650 13px/1 'Outfit',sans-serif;cursor:pointer;flex:0 0 auto}
.fpill:active{background:var(--tx);color:var(--bone)}
.fsort{border:0;background:none;color:var(--accT);font:650 13px/1 'Outfit',sans-serif;cursor:pointer;flex:0 0 auto;padding:8px}
.fsum{font-size:12px;color:var(--mu2);margin-left:auto}
.frow{display:flex;gap:6px;overflow-x:auto;padding:6px 2px;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.fchip,.chip{flex:0 0 auto;padding:10px 15px;border-radius:10px;background:none;color:var(--mu);
 border:1.5px solid var(--line2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.fchip.on,.chip.on{background:var(--tx);color:var(--bone);border-color:var(--tx)}
.card{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0;margin:0;
 content-visibility:auto;contain-intrinsic-size:auto 96px}
.card.mini{cursor:pointer}
.card.mini:active{background:rgba(27,26,23,.045)}
.e2{display:flex;gap:12px;align-items:flex-start;padding:14px 2px 13px}
.rail{flex:0 0 32px;display:flex;justify-content:center;padding-top:3px}
.duo{display:inline-flex;gap:3px}
.duo i{width:9px;height:22px;border-radius:3px;border:1.5px solid var(--tx);background:none}
.duo i.f{background:var(--tx)}
.duo i.dm{border-color:var(--slate)}
.duo i.dm.f{background:var(--slate)}
.rk{font:800 13px/1 'Outfit',sans-serif;color:var(--mu2);padding-top:4px;display:inline-block}
.ebody{flex:1;min-width:0}
.en{font-size:16px;font-weight:700;letter-spacing:-.018em;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.em{font-size:12px;color:var(--mu);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ea{font-size:12.5px;font-weight:700;margin-top:5px}
.ex{flex:0 0 auto;display:flex;gap:7px;align-items:center;padding-top:4px}
.ex i{font-style:normal;font-size:13px}
.ex .fx{color:var(--accT)}
.ex .rx{color:var(--slate)}
.ex .cx{color:var(--mu2);font-size:16px}

.fc-why,.fc-sub,.sub{text-wrap:pretty}
img{outline:1px solid rgba(0,0,0,.10);outline-offset:-1px}
.tap{transition-property:transform,background-color,box-shadow,border-color,color;
 transition-duration:var(--m-fast);transition-timing-function:var(--m-smooth)}
.tap[data-press="1"]{transform:scale(var(--s-press));transition-duration:var(--m-instant)}
.tap.lift[data-press="1"]{transform:scale(var(--s-subtle)) translateY(1px)}
.fsec{margin:22px 0 4px}
.fsec-h{display:flex;align-items:baseline;gap:9px;padding:0 0 9px}
.fsec-h b{font-size:15.5px;font-weight:800;letter-spacing:-.022em}
.fsec-h span{font-size:11.5px;color:var(--mu2);font-weight:650}
.fsec-h .more{margin-left:auto;font:700 12.5px/1 'Outfit',sans-serif;color:var(--accT);
 min-height:44px;display:inline-flex;align-items:center;padding:0 4px;cursor:pointer;background:none;border:0}
.frail{display:flex;gap:11px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
 scrollbar-width:none;padding:2px 18px 8px;margin:0 -18px}
.frail::-webkit-scrollbar{display:none}
.fcard{flex:0 0 78%;max-width:318px;scroll-snap-align:start;background:var(--paper);border:0;text-align:left;
 border-radius:var(--r-card);padding:12px;box-shadow:var(--e2);display:flex;flex-direction:column;gap:9px;font-family:inherit}
.fc-hit{display:flex;flex-direction:column;gap:8px;cursor:pointer;border-radius:var(--r-inner);padding:2px;outline:none}
.fc-hit:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.fc-top{display:flex;gap:11px;align-items:flex-start}
.fc-mark{width:40px;height:40px;border-radius:var(--r-inner);flex:0 0 40px;display:flex;align-items:center;
 justify-content:center;font:800 14px/1 'Outfit',sans-serif;letter-spacing:-.03em}
.fc-n{display:block;font-size:15.5px;font-weight:750;letter-spacing:-.02em;line-height:1.22;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc-sub{display:block;font-size:11.5px;color:var(--mu);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-why{display:block;font-size:12.5px;font-weight:700;line-height:1.35}
.fc-rel{display:flex;gap:5px;margin-top:2px}
.fc-rel i{font-style:normal;font:800 9.5px/1 'Outfit',sans-serif;letter-spacing:.06em;padding:4px 6px;
 border-radius:6px;border:1px solid var(--line2);color:var(--mu2)}
.fc-rel i.on{background:var(--tx);border-color:var(--tx);color:var(--bone)}
.fc-rel i.dm.on{background:var(--slate);border-color:var(--slate)}
.fc-acts{display:flex;gap:7px}
.fc-acts a,.fc-acts button{flex:1;min-height:44px;border-radius:var(--r-chip);border:1.5px solid var(--line2);
 background:none;color:var(--tx);font:700 12.5px/1 'Outfit',sans-serif;display:inline-flex;align-items:center;
 justify-content:center;text-decoration:none;cursor:pointer;font-family:inherit}
.fc-acts .pri{background:var(--carbon);border-color:var(--carbon);color:var(--bone)}
.fc-acts .ico{flex:0 0 44px}
.fc-acts .blocked{border-color:var(--neg);color:var(--neg);font-size:11px}
.tsw3{display:flex;gap:6px;padding:4px;background:rgba(244,241,234,.13);border-radius:var(--r-inner);margin:12px 0 2px}
.tsw3 button{flex:1;min-height:44px;border:0;border-radius:var(--r-chip);background:none;color:var(--boneD);
 font:750 13px/1 'Outfit',sans-serif;cursor:pointer;font-family:inherit;
 transition-property:background-color,color,transform;transition-duration:var(--m-fast);transition-timing-function:var(--m-smooth)}
.tsw3 button.on{background:var(--bone);color:var(--carbon);box-shadow:var(--e1)}
.tsw3 button[data-press="1"]{transform:scale(.965)}
.tsw3 button:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.swipeable{position:relative}
.ghint{position:absolute;top:6px;bottom:6px;width:84px;display:flex;align-items:center;justify-content:center;
 font:800 10.5px/1.2 'Outfit',sans-serif;letter-spacing:.04em;opacity:0;pointer-events:none;border-radius:var(--r-inner);text-align:center}
.ghint.l{left:0;background:rgba(47,107,79,.15);color:var(--pos)}
.ghint.r{right:0;background:rgba(232,93,38,.15);color:var(--accT)}
.sk{border-radius:var(--r-card);background:linear-gradient(90deg,#EDE9E0,#F7F4ED,#EDE9E0);background-size:200% 100%;animation:skm 1.1s linear infinite}
@keyframes skm{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk.card{height:128px;margin-bottom:11px}
.offbar{background:var(--amb);color:#231800;font:750 12px/1 'Outfit',sans-serif;padding:10px 14px;text-align:center}
.rsx{background:var(--carbon);color:var(--bone);border-radius:var(--r-card);padding:16px;box-shadow:var(--e3);margin:12px 0}
.rsx .rsn{font:800 11px/1 'Outfit',sans-serif;letter-spacing:.14em;color:var(--acc)}
.rsx h3{color:var(--bone);font-size:19px;margin:5px 0 2px}
.rsx .meta{color:var(--boneD)}
.rprog{display:flex;gap:3px;margin:13px 0 3px}
.rprog i{flex:1;height:4px;border-radius:2px;background:rgba(244,241,234,.2)}
.rprog i.done{background:var(--pos)}.rprog i.cur{background:var(--acc)}.rprog i.skip{background:rgba(244,241,234,.45)}
.v3sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(prefers-reduced-motion:reduce){
 .tap,.fcard,.tsw3 button{transition-duration:.01ms!important}
 .tap[data-press="1"],.tsw3 button[data-press="1"]{transform:none!important}
 .sk{animation:none;background:#EDE9E0}
 .frail{scroll-snap-type:none}}
/* ======================= PREMIUM MOBILE POLISH =======================
   Skill-led. ui-ux-pro-max = priority order (touch > type > layout).
   ecc:accessibility = WCAG 2.2 target size + 4.5:1 contrast.
   ecc:make-interfaces-feel-better = concentric radii, scoped transitions,
   text-wrap, hit areas, font smoothing. motion-design = Corporate
   personality: ONE signature curve, THREE durations, enter > exit.
   taste-skill = anti-default discipline. ponytail = CSS, no libraries. */

:root{
 /* motion-design "Corporate": one curve, three durations, all 110-220ms */
 --m-instant:110ms;--m-fast:160ms;--m-normal:200ms;--m-slow:220ms;
 --m-smooth:cubic-bezier(.2,0,0,1);--m-sharp:cubic-bezier(.3,0,.1,1);
 --s-press:.972;--s-subtle:.99;
 /* outdoor legibility: both muted tones now clear 4.5:1 on #F4F1EA */
 --mu:#57534B;--mu2:#6B675D;
 /* one spacing rhythm, 4-based */
 --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:24px;--sp6:28px;
 --r-card:20px}

html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-size:16px;line-height:1.5}
h1{font-size:29px;text-wrap:balance}
h2{font-size:11px;letter-spacing:.15em;margin:var(--sp5) 0 var(--sp2)}
h3{font-size:17px;text-wrap:balance}
.sub,.meta{font-size:13.5px;text-wrap:pretty}
.wrap{padding:var(--sp4) var(--sp4) var(--sp5)}
/* 16px stops iOS zooming the page when the field takes focus */
.homesearch input,.search,input,textarea,select{font-size:16px}

/* ---------- THE FEED: a vertical list, not a side-scroller ----------
   The rail sized every card to 78% of a bled container, so the next card
   was always sliced mid-word and its buttons clipped; equal-height flex
   siblings also left dead space under short cards. A list removes the
   clipping, the sideways drift and the swipe requirement at once, and
   hands each card the full screen width. */
.frail{display:block;overflow:visible;scroll-snap-type:none;padding:0;margin:0;
 -webkit-overflow-scrolling:auto}
.fcard{max-width:none;width:auto;flex:none;scroll-snap-align:none;
 margin:0 0 var(--sp3);padding:var(--sp4);gap:var(--sp3);box-shadow:var(--e1);
 border:1px solid rgba(27,26,23,.07)}
.fcard:last-child{margin-bottom:0}

/* hierarchy: name > area > relationship > opportunity > one action */
.fc-hit{gap:10px;padding:0;border-radius:var(--sp3)}
.fc-top{gap:var(--sp3);align-items:center}
.fc-mark{width:44px;height:44px;flex:0 0 44px;font-size:15px;border-radius:13px}
.fc-n{font-size:17px;font-weight:750;line-height:1.24;letter-spacing:-.022em;text-wrap:pretty}
.fc-sub{font-size:13.5px;margin-top:3px;color:var(--mu)}
.fc-why{font-size:13.5px;line-height:1.4;font-weight:700}
.fc-rel{gap:6px;margin-top:7px}
.fc-rel i{font-size:10.5px;padding:5px 8px;border-radius:7px;letter-spacing:.07em;line-height:1}

/* one clear primary; the rest step back rather than compete */
.fc-acts{gap:var(--sp2);margin-top:var(--sp1)}
.fc-acts a,.fc-acts button{min-height:48px;font-size:14px;border-radius:13px;border-width:1.5px}
.fc-acts .pri{flex:1.7}
.fc-acts .ico{flex:0 0 48px;font-size:19px}
.fc-acts .blocked{font-size:12.5px;min-height:44px}

/* section rhythm */
.fsec{margin:var(--sp6) 0 0}
.fsec-h{padding-bottom:10px;gap:var(--sp2)}
.fsec-h b{font-size:17px;letter-spacing:-.025em}
.fsec-h span{font-size:12.5px}
.fsec-h .more{font-size:13.5px}

/* rows and lists get the same type floor */
.mini2 .nm{font-size:16.5px}
.mini2 .meta,.mini2 .st{font-size:13px}
.mini2 .nextact{font-size:13.5px}
.rowl .lbl{font-size:15px;line-height:1.4}
.count{font-size:13px}

/* touch-down lands in the same frame as the finger */
.tap[data-press="1"]{transform:scale(var(--s-press));transition-duration:60ms}
.fc-hit[data-press="1"]{transform:scale(.988)}
.fc-acts a:active,.fc-acts button:active{transform:scale(.975)}

/* entrance: first six only, enter longer than exit, transform+opacity only */
@keyframes fcIn{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
.frail>.fcard{animation:fcIn var(--m-slow) var(--m-smooth) both}
.frail>.fcard:nth-child(1){animation-delay:0ms}
.frail>.fcard:nth-child(2){animation-delay:28ms}
.frail>.fcard:nth-child(3){animation-delay:56ms}
.frail>.fcard:nth-child(n+4){animation-delay:84ms}

/* skeleton matches the real card so nothing shifts when data lands */
.sk.card{height:176px;margin-bottom:var(--sp3)}

/* the page itself never moves sideways */
html,body{overscroll-behavior-x:none}
.wrap,.fsec,.frail,.fcard{max-width:100%}

@media(max-width:359px){
 .wrap{padding-left:var(--sp3);padding-right:var(--sp3)}
 .fcard{padding:var(--sp3)}
 .fc-acts a,.fc-acts button{font-size:13px}
 .fc-n{font-size:16px}
 h1{font-size:25px}}

@media(prefers-reduced-motion:reduce){
 .tap[data-press="1"],.fc-hit[data-press="1"]{transform:none}
 .frail>.fcard{animation:none}}

/* When a shop has no location, Log Visit IS the primary action — it should
   look like one instead of leaving the card with no clear next step. */
.fc-acts>button:first-child{background:var(--carbon);border-color:var(--carbon);color:var(--bone);flex:1.7}

/* ---- QA fixes, measured not guessed ----
   Back button was 36x36 and every chip row 39-40px: all below the 44px
   comfortable-touch floor (ui-ux-pro-max CRITICAL / WCAG 2.2 target size). */
#backbtn{width:44px;height:44px;border-radius:14px;top:calc(8px + var(--safe-t));left:10px}
.hasback header.top{padding-left:64px}
.chip,.fchip,.fpill,.pk,.seg button,.tsw{min-height:44px}
.chip,.fchip{display:inline-flex;align-items:center}
/* chip strips bleed to the screen edge so a chip is never sliced by the
   container wall — the strip scrolls, the page never does */
.preset,.fchips,.chips{margin-left:calc(var(--sp4) * -1);margin-right:calc(var(--sp4) * -1);
 padding-left:var(--sp4);padding-right:var(--sp4);scroll-padding-left:var(--sp4)}
/* no label below 11.5px anywhere */
.fc-rel i{font-size:11.5px;padding:5px 8px}
.rsx .rsn,.ghint,.mini2 .st,.count,h2{font-size:11.5px}
h2{font-size:11.5px}
/* last of the sub-11.5px labels: panel headings, the header eyebrow,
   and the sort button that sat at 29px tall */
.panel>b{font-size:11.5px;letter-spacing:.13em;line-height:1.5}
.ovl{font-size:11.5px;letter-spacing:.14em}
.fsort{min-height:44px;min-width:44px;padding:0 12px}

/* The sticky action bar faded to opaque only at 28%, so page text scrolled
   visibly through the buttons. Longer fade, opaque well before the buttons. */
.stick{background:linear-gradient(180deg,rgba(251,248,241,0) 0%,rgba(251,248,241,.86) 34%,#FBF8F1 58%);
 padding-top:28px}
.stick .btn{min-height:52px;font-size:15px}
/* the outline buttons in the sticky bar were transparent, so page text
   scrolled through the buttons themselves. Give them the paper ground. */
.stick .btn{background:#FBF8F1}
.stick .btn.gold{background:var(--acc)}
.stick .btn.ghost:active{background:var(--tx)}

/* ============ FIX: tab bar sliced card actions (390px & 430px) ============
   nav.bot floated at bottom:10px with 12px side gaps, so list content
   scrolled through the gap beneath it and card action rows were cut in
   half by it (measured: 22px of the Directions/Log Visit row hidden at
   390px). Anchor the bar to the true bottom edge, full width, and give
   the page back exactly the bar's height as bottom padding. */
:root{--navh:60px}
@media(max-width:819px){
 nav.bot{left:0;right:0;bottom:0;border-radius:0;
  padding-bottom:var(--safe-b);
  box-shadow:0 -1px 0 rgba(244,241,234,.10)}
 body{padding-bottom:calc(var(--navh) + var(--safe-b) + 12px)}
 /* resume capsule re-seated against the new bar height */
 .rsx{bottom:calc(var(--navh) + var(--safe-b) + 12px)}
}

/* ================= VISUAL PASS — reduction only =================
   One accent (orange). One containment rule: all CONTENT sits in the same
   card surface; the only non-card surfaces are chrome (top bar, tab bar).
   One shadow token. Radius tied to element size. Borders removed wherever
   spacing already separates things. */

/* every number lines up, everywhere */
body{font-variant-numeric:tabular-nums}

/* ---- ONE accent. The slate-blue link tone is gone; orange is the only
   non-neutral, and semantic warning colours stay separate from it. ---- */
.fc-why{color:var(--mu);font-weight:650;font-size:13.5px;line-height:1.4}
.fc-warn{font-size:13px;font-weight:700;line-height:1.4;color:var(--amb);margin-top:2px}
.fc-warn.crit{color:var(--neg)}

/* ---- card: the name gets the width the avatar used to take ---- */
.fcard{display:flex;flex-direction:column;gap:6px;padding:var(--sp4);
 background:var(--paper);border-radius:var(--r-card);box-shadow:var(--e1);
 border:1px solid rgba(27,26,23,.07);margin:0 0 var(--sp3);cursor:pointer}
.fcard:last-child{margin-bottom:0}
.fc-n{font-size:19px;font-weight:750;line-height:1.22;letter-spacing:-.024em;text-wrap:pretty}
.fc-sub{font-size:13.5px;color:var(--mu2);margin-top:-1px}
.fc-go{margin-top:10px;width:100%;min-height:50px;font-size:15px;font-weight:750;
 border:0;border-radius:14px;background:var(--acc);color:#fff;cursor:pointer}

/* ---- stats block: same surface as the list cards (one containment rule),
   today's numbers lead, "new this week" steps down ---- */
.ribbon{background:var(--paper);border:1px solid rgba(27,26,23,.07);
 border-radius:var(--r-card);box-shadow:var(--e1);
 padding:var(--sp4);margin:var(--sp4) 0 var(--sp3);gap:6px 20px}
.ribbon b{font-size:24px;line-height:1.05;margin-right:5px}
.ribbon span{font-size:12.5px;color:var(--mu2)}
.ribbon .rb-2 b{font-size:15px;font-weight:750;color:var(--mu)}
.ribbon .rb-2{font-size:12px}
.ribbon .rb-idle{font-size:15px;font-weight:700;color:var(--tx);white-space:normal}
.ribbon .hot b{color:var(--acc)}

/* ---- touch: real feedback, and nothing swallowing it ---- */
.tap,.fcard,.btn,button,a[href]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.fcard,.fc-go,.btn,.tap{transition:transform 120ms cubic-bezier(.3,0,.1,1)}
.fcard:active,.fc-go:active,.btn:active,.tap:active{transform:scale(.97)}
/* pressing the inline button must not also depress the card behind it */
.fcard:has(.fc-go:active){transform:none}
.fcard:focus-visible,.fc-go:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

@media(prefers-reduced-motion:reduce){
 .fcard,.fc-go,.btn,.tap{transition:none}
 .fcard:active,.fc-go:active,.btn:active,.tap:active{transform:none}
}

/* ---- the accent, spent in one place ----
   25 solid orange blocks down a scrolling list drowned out the one page-level
   CTA, and white-on-orange measured 3.38:1 — below AA for 15px bold text.
   The card action becomes a tint carrying a darker step of the SAME hue
   (a ramp, not a second colour), which reads as primary inside its own card
   while leaving "Start today's route" the only solid orange on the screen. */
:root{--acc-ink:#A83C12}
.fc-go{background:rgba(232,98,44,.12);color:var(--acc-ink);font-weight:750;min-height:48px}
.fc-go:active{background:rgba(232,98,44,.20)}

/* stats card: one line of content should not sit in a 44px-tall line box */
.ribbon span{line-height:1.25}
.ribbon{padding:14px var(--sp4)}

/* ---- card hit area without nesting one button inside another ----
   The name is the control; its ::after stretches over the whole card so a
   tap anywhere opens the sheet. Log Visit rides above that overlay. */
.fcard{position:relative}
.fc-open{display:block;width:100%;text-align:left;background:none;border:0;padding:0;
 font:inherit;color:inherit;cursor:pointer}
.fc-open::after{content:'';position:absolute;inset:0;border-radius:inherit;z-index:0}
.fc-go{position:relative;z-index:1}
.fcard:has(.fc-open:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
.fcard:has(.fc-open:active){transform:scale(.97)}

/* "See all" measured 4.49:1 on bone — one hair under AA. Same darker step
   of the accent the card action uses. */
.fsec-h .more{color:var(--acc-ink)}

/* ================= TACTILE + ELEGANCE =================

   ONE type scale. The sheet was carrying 23 distinct font sizes; the
   surfaces a rep actually reads are snapped to five steps. */
:root{--t1:12px;--t2:14px;--t3:16px;--t4:20px;--t5:26px}
h1{font-size:var(--t5)}
.cbar span,.fc-n,.fsec-h b,.sheet h3{font-size:var(--t4)}
.fc-go,.rowl .lbl,.mini2 .nm,.btn{font-size:var(--t3)}
.fc-sub,.fc-why,.fc-warn,.fsec-h span,.fsec-h .more,.mini2 .meta,.st,.sub{font-size:var(--t2)}
.ovl,.count,.ribbon span,.rb-2,h2,.panel>b{font-size:var(--t1)}
.ribbon b{font-size:var(--t5)}
.ribbon .rb-2 b{font-size:var(--t3)}
.ribbon .rb-idle{font-size:var(--t3)}

/* ONE shadow token. e2 and e3 were only ever "the same card, but louder";
   the sheet separates from the page with its dimmed backdrop instead. */
:root{--e2:var(--e1);--e3:var(--e1)}

/* the slate blue survived in list status text after the card chips went */
.st{color:var(--mu)}
.st.pos,.st .pos{color:var(--pos)}
.dm{border-color:var(--line2)}

/* ---- condensing bar: fixed, so it can never shift the page under it ---- */
.cbar{position:fixed;top:0;left:0;right:0;z-index:45;
 background:var(--carbon);color:var(--bone);
 padding:calc(9px + var(--safe-t)) 18px 11px;
 opacity:0;transform:translateY(-100%);pointer-events:none;
 box-shadow:0 1px 0 rgba(244,241,234,.08);
 transition:transform 200ms cubic-bezier(.3,0,.1,1),opacity 150ms linear}
.cbar span{font-weight:750;letter-spacing:-.02em;display:block;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cond .cbar{opacity:1;transform:translateY(0)}
.hasback .cbar{padding-left:64px}

/* ---- sheets: a real handle, and a scroll that stays inside itself ---- */
.sheetbg{transition:background 240ms linear,backdrop-filter 240ms linear}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;will-change:transform}
.grab{width:44px;height:5px;margin:10px auto 12px;background:var(--sf3);
 border-radius:99px;cursor:grab}
.grab:active{cursor:grabbing}
/* a wider invisible grab target than the 5px bar it draws */
.sheet .grab::before{content:'';position:absolute;left:0;right:0;height:34px;margin-top:-14px}
.sheet{position:relative}

/* every scroll container keeps its overscroll to itself */
.frow,.preset,.res,.chips,.fchips,.frail,body{overscroll-behavior:contain}
html,body{overscroll-behavior-x:none}

/* ---- the initial skeleton is the only loading state that earns its place.
   Home renders in 20ms and a filtered list in 6ms; a skeleton for those is
   a flash of nothing where the answer already was. ---- */
.wrap .sk,.wrap .skel{display:none}
#app>.wrap>.skel{display:block}

@media(prefers-reduced-motion:reduce){
 .cbar{transition:none}
 .sheetbg{transition:none}
}

/* ---- two measured contrast failures found in the final sweep ----
   Areas chips read #BE4A1B on their own tint = 4.05:1, and the management
   warning "PROCEED WITH CAUTION" read #9A6A00 on bone = 4.24:1. Both under
   AA. The warning is the one that matters: it is the line telling a rep not
   to walk into a shop, and it was the hardest text on the screen to read in
   sun. Darker steps of the same two hues, no new colours. */
:root{--amb:#7D5400}
.chip,.chip.on,.preset .chip{color:var(--acc-ink)}
.mgm b,.mgm>div,.fc-warn{color:var(--amb)}
.fc-warn.crit{color:var(--neg)}

/* ---- section header: title and count stopped fitting on one line once the
   heading moved up the type scale, so "One company only" truncated to
   "One company" and "See all" wrapped mid-word. Give the count its own row
   instead of squeezing three things into one. ---- */
.fsec-h{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:1px 12px}
.fsec-h b{grid-column:1;grid-row:1;min-width:0}
.fsec-h .more{grid-column:2;grid-row:1;white-space:nowrap;flex:0 0 auto}
.fsec-h span{grid-column:1/-1;grid-row:2;color:var(--mu2)}

/* ---- chip strips slice at the screen edge, not 18px inside it ----
   These genuinely scroll (overflow-x:auto, overscroll contained), but a chip
   cut off with a strip of empty page beside it reads as a rendering fault
   rather than "there is more this way". Bleed them to the true edge so the
   cut is obviously deliberate. Higher specificity than the base rule, which
   a later shorthand margin was overriding. */
.wrap .preset,.wrap .frow,.wrap .fchips,.wrap .chips{
 margin-left:-18px;margin-right:-18px;
 padding-left:18px;padding-right:18px;
 scroll-padding-left:18px;scroll-padding-right:18px}
@media(max-width:359px){
 .wrap .preset,.wrap .frow,.wrap .fchips,.wrap .chips{
  margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
}

/* Three of these strips carry an inline margin in the generated markup
   (margin:0 0 4px and friends). An inline style beats any stylesheet rule,
   which is the one case !important is actually for. Only the horizontal
   axis is forced, so each strip keeps the vertical rhythm it was given. */
.wrap .preset,.wrap .frow,.wrap .fchips,.wrap .chips{
 margin-left:-18px!important;margin-right:-18px!important}
@media(max-width:359px){
 .wrap .preset,.wrap .frow,.wrap .fchips,.wrap .chips{
  margin-left:-12px!important;margin-right:-12px!important}
}

/* ================= SAFETY PRESENTATION =================
   One compact block per restricted row: what, when, where, and what the rep
   can still do. Left stripe carries the severity so it is unmistakable at a
   glance without shouting across the whole row. Signed evidence is added
   only inside the profile. */
.mgb{display:block;border-radius:10px;padding:7px 10px;margin-top:6px;line-height:1.34;
 border-left:3px solid currentColor}
.mgb b{display:block;font-size:13px;font-weight:800;letter-spacing:.01em}
.mgb span,.mgb em{display:block;font-size:12px;font-style:normal;font-weight:600}
.mgb em{opacity:.92}
.mgb .mgev{margin-top:4px;font-size:11.5px;font-weight:500;opacity:.8}
.mgb.x{background:rgba(166,61,61,.09);color:var(--neg)}
.mgb.c{background:rgba(125,84,0,.08);color:var(--amb)}

/* one compact status indicator instead of the words repeating down the list */
.ea{font-size:12.5px;font-weight:650;display:flex;align-items:center;gap:6px;line-height:1.3}
.ea::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}

/* audit-only rows may be quieter, but the name and classification still have
   to be readable in sun - they were dropped below the AA floor by opacity */
.m-audit{opacity:1}
.m-audit .en,.mini2.m-audit .nm{color:var(--tx)}
.m-audit .em,.mini2.m-audit .meta,.m-audit .st{color:var(--mu)}

/* keep the required wording but tighten the block so it does not dominate
   the row rhythm - the heading is the one line that has to shout */
.mgb{padding:6px 9px;margin-top:5px;line-height:1.28}
.mgb b{font-size:12.5px;letter-spacing:0;line-height:1.22;margin-bottom:1px}
.mgb span,.mgb em{font-size:11.5px;font-weight:600}

/* "Sort" measured 4.49:1 — one hundredth under AA */
.fsort,.fpill{color:var(--tx)}
/* ==========================================================================
   PREMIUM FINISH — Route Book
   A design system, not a coat of paint. Every value below is a token, and
   every component reads from a token. No one-off styles.

   Identity kept: warm ivory ground, near-black ink, one restrained orange.
   What changed is the *relationships* — the neutrals now carry a slight warm
   bias toward the accent so they read as chosen rather than inherited, and
   every radius, divider, duration and press state comes off one scale.

   Motion personality: Corporate (one curve, no overshoot), clamped to the
   120-220ms band a one-handed outdoor tool needs. Premium's 350-600ms is
   too slow to feel responsive in the hand.
   ========================================================================== */

:root{
 /* ---- ink & ground: warm-biased neutrals, not pure greys ---- */
 --ink:#14130F;          /* headers, primary text */
 --ink-2:#3D3A33;        /* strong secondary */
 --ink-3:#57534B;        /* supporting text        6.9:1 on ground */
 --ink-4:#6B675D;        /* metadata               5.1:1 on ground */
 --ground:#F5F2EC;       /* page */
 --surface:#FFFDF9;      /* cards, sheets */
 --surface-2:#EFEBE2;    /* inset, pressed */

 /* ---- one accent, three roles ---- */
 --accent:#E8622C;       /* fills only */
 --accent-ink:#A83C12;   /* accent as TEXT   6.2:1 */
 --accent-wash:rgba(232,98,44,.10);

 /* ---- semantic, separate from the accent ---- */
 --danger:#A63D3D; --danger-wash:rgba(166,61,61,.09);
 --warn:#7D5400;   --warn-wash:rgba(125,84,0,.08);
 --good:#2F6B4F;

 /* ---- one hairline, used only where spacing cannot separate ---- */
 --hair:rgba(20,19,15,.09);
 --hair-strong:rgba(20,19,15,.14);

 /* ---- radius tied to element size ---- */
 --r-chip:8px; --r-control:12px; --r-card:16px; --r-sheet:24px;

 /* ---- one elevation ---- */
 --lift:0 1px 2px rgba(20,19,15,.05), 0 1px 1px rgba(20,19,15,.04);

 /* ---- 4pt spacing ---- */
 --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:28px;

 /* ---- motion: one curve, three durations ---- */
 --ease:cubic-bezier(.2,0,0,1);
 --t-press:120ms; --t-state:160ms; --t-move:220ms;
}

/* ---- reclaim the viewport ------------------------------------------------
   The screen header was taking 26.7% of the phone on Home and 22.8% on the
   Directory before a single record appeared. That is the single thing that
   made this read as a web page rather than an app. The title steps down, the
   standing description clamps to two lines (it is reference text, not
   something to re-read on every visit), and the padding tightens. */
header.top{padding:calc(12px + var(--safe-t)) var(--s4) var(--s4);
 border-radius:0 0 var(--r-sheet) var(--r-sheet)}
header.top h1{font-size:22px;line-height:1.14;letter-spacing:-.025em;margin:2px 0 0}
header.top .ovl{font-size:11px;letter-spacing:.15em}
header.top .sub{font-size:13px;line-height:1.4;margin-top:5px}
header.top .sub:last-of-type{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
 overflow:hidden;opacity:.62}
header.top .sub b{font-size:15px}

/* ---- list rhythm: one row shape, read in two seconds ---- */
.card.mini{padding:var(--s3) var(--s4);gap:var(--s3);border-radius:0;
 background:transparent;box-shadow:none;border-bottom:1px solid var(--hair)}
.card.mini:last-child{border-bottom:0}
.card.mini .en{font-size:17px;font-weight:700;line-height:1.25;letter-spacing:-.018em;
 color:var(--ink);text-wrap:pretty}
.card.mini .em{font-size:12.5px;line-height:1.35;color:var(--ink-4);margin-top:2px}
.card.mini .ea{font-size:12.5px;font-weight:650;margin-top:4px}

/* relationship indicator: identical everywhere, never a bare number */
.duo{display:inline-flex;gap:3px;align-items:center;vertical-align:middle}
.duo i{width:7px;height:7px;border-radius:50%;background:transparent;
 box-shadow:inset 0 0 0 1.5px var(--hair-strong)}
.duo i.f{background:var(--ink);box-shadow:none}
.duo i.dm.f{background:var(--accent-ink)}

/* ---- surfaces ---- */
.fcard,.ribbon,.panel,.card:not(.mini),.hcard{border-radius:var(--r-card);
 box-shadow:var(--lift);border:1px solid var(--hair)}
.sheet{border-radius:var(--r-sheet) var(--r-sheet) 0 0}
.chip,.fchip,.mc,.tag{border-radius:var(--r-chip)}
.btn,.ab,.fc-go,.fpill,.fsort,input,.homesearch input{border-radius:var(--r-control)}

/* ---- one press state, everywhere ---- */
.tap,.card.mini,.btn,.ab,.chip,.fchip,.fc-go,.fc-open,.rowl,nav.bot a,nav.bot button{
 touch-action:manipulation;-webkit-tap-highlight-color:transparent;
 transition-property:transform,background-color,opacity;
 transition-duration:var(--t-press);transition-timing-function:var(--ease)}
.card.mini:active,.rowl:active{background:var(--surface-2);transform:scale(.985)}
.btn:active,.ab:active,.fc-go:active,.chip:active,.fchip:active{transform:scale(.97)}

/* ---- icons: one size, one weight ---- */
.cic{width:34px;height:34px;flex:0 0 34px;border-radius:var(--r-control);
 display:flex;align-items:center;justify-content:center}
.cic svg{width:17px;height:17px;stroke-width:1.7;fill:none;stroke:currentColor}

/* ---- safety, sized to the row it sits in ---- */
.mgb{border-radius:var(--r-chip);padding:6px 9px;margin-top:5px}
.mgb.x{background:var(--danger-wash);color:var(--danger)}
.mgb.c{background:var(--warn-wash);color:var(--warn)}

@media(prefers-reduced-motion:reduce){
 .tap,.card.mini,.btn,.ab,.chip,.fchip,.fc-go,.fc-open,.rowl{transition:none}
 .card.mini:active,.btn:active,.ab:active,.fc-go:active{transform:none}
}

/* ---- the relationship rail collapses when there is nothing to say --------
   duo() returns empty for a non-customer now that the raw rank is gone, but
   the rail kept its width and left every prospect row with a dead gutter. */
.rail:empty{display:none}
.rail{display:flex;align-items:center;justify-content:center;flex:0 0 auto;min-width:0}

/* ---- Filter and Sort are the same kind of control and must look it ------
   Filter carried a 1.5px box, Sort carried none. Both are quiet controls;
   Filter earns weight only when filters are actually on. */
.fpill,.fsort{border:0;background:transparent;color:var(--ink-2);font-weight:650;
 padding:0 var(--s3);min-height:44px;border-radius:var(--r-control)}
.fpill:active,.fsort:active{background:var(--surface-2)}
.lhead{display:flex;align-items:center;gap:var(--s1)}
.lhead .fsum{margin-left:auto;color:var(--ink-4);font-size:12.5px}

/* ---- the resume-draft capsule floats above the tab bar, so the page owes
   it clearance too, or it sits on top of the last visible record ---- */
body:has(.rsx){padding-bottom:calc(var(--navh) + var(--safe-b) + 84px)}

/* ---- search: one field treatment, sized for a thumb and for sunlight ---- */
.homesearch input{min-height:50px;font-size:16px;background:var(--surface);
 border:1px solid var(--hair);box-shadow:none;color:var(--ink)}
.homesearch input::placeholder{color:var(--ink-4)}
.homesearch input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

/* ---- section headings: one treatment ---- */
.fsec-h b{font-size:18px;letter-spacing:-.02em;color:var(--ink)}
.fsec-h span{color:var(--ink-4)}
.fsec-h .more{color:var(--accent-ink);font-weight:700}

/* Category names like "Supermarket / grocery" and "Vegetable wholesaler" were
   being cut mid-word. Let the supporting line wrap to two lines rather than
   truncate - the row stays bounded and nothing is lost. */
/* At 320px the greeting eyebrow wrapped onto a second line and pushed the
   title down. It is a label, not a sentence - keep it on one line. */
header.top .ovl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media(max-width:359px){
 header.top .ovl{font-size:10.5px;letter-spacing:.1em}
 header.top h1{font-size:20px}
 .homesearch input::placeholder{font-size:15px}
}

.card.mini .ebody{min-width:0;flex:1}
.card.mini .em{white-space:normal;text-wrap:pretty;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ==========================================================================
   STUDIO - structural recomposition, not another polish pass.

   1. The white card stack is gone. Feed entries are editorial rows on the
      ground, separated by hairlines. (taste-skill 4.4: cards only when
      elevation communicates hierarchy. Here it never did.)
   2. The full-width pale action slab is gone. The action is a compact
      trailing control; the row itself is the primary target.
   3. The floating rounded header is gone. The dark field is full-bleed and
      structural - content sits against it, not below a floating card.
   4. The stock segmented pill is gone. The territory switcher is a quiet
      editorial tab row marked by weight and a rule.
   5. The empty route card is gone. Route state is a dense strip.
   6. Decorative status dots removed. (taste-skill 9.F: zero by default.)

   Palette: black / warm ivory / restrained orange kept as instructed, but
   the tonal relationships are rebuilt. taste-skill 4.2 bans this family as a
   DEFAULT reach; it is used here because the brief names it explicitly, so
   it earns real contrast and a structural dark rather than a flat cream
   field with white cards floating on it.
   ========================================================================== */

:root{
 --ink:#12110E;
 --ink-2:#33302A;
 --ink-3:#55514A;
 --ink-4:#6A665C;
 --ground:#F2EFE8;
 --raise:#FBF9F4;
 --spine:#12110E;
 --accent:#E4571F;
 --accent-ink:#9E3610;
 --rule:rgba(18,17,14,.10);
 --rule-2:rgba(18,17,14,.16);
 --danger:#9E2F2F; --danger-bg:rgba(158,47,47,.07);
 --warn:#6F4A00;   --warn-bg:rgba(111,74,0,.07);
 --ease:cubic-bezier(.2,0,0,1);
}

body{background:var(--ground);color:var(--ink);font-variant-numeric:tabular-nums}

/* ==========================================================================
   ONE CONTAINER SYSTEM

   Measured before this block, on a single screen, the left edges were:
     header title 64px | eyebrow 64px | switcher 46px | search 64px
     route strip 0px   | section heading 18px | customer row 18px
   Four different gutters. That is the misalignment.

   Cause 1: header.top switches to padding-left:64px when a back button
   exists, so header content sits on a different rail to everything below.
   Cause 2: negative margins (margin:0 -18px) computed against whichever
   padding their parent happened to have, producing 0px and 46px rails.

   Rule from here: ONE gutter token. Full-bleed surfaces may touch the screen
   edge, but their content sits on the same rail as the content below them.
   No negative margins anywhere. Nothing may exceed the viewport.
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
:root{--gutter:18px;--backrail:46px}
@media(max-width:359px){:root{--gutter:14px;--backrail:42px}}

html,body{max-width:100%;overflow-x:hidden}

/* the shared container */
.wrap{width:100%;max-width:760px;margin:0 auto;
 padding-left:var(--gutter);padding-right:var(--gutter);
 padding-bottom:24px}

/* the spine is full-bleed; its CONTENT uses the same rail as the list below.
   The back button is absolute at the gutter, so only the eyebrow - the one
   line it physically sits beside - is offset, and by a named token. */
header.top{padding-left:var(--gutter);padding-right:var(--gutter)}
.hasback header.top{padding-left:var(--gutter)}
/* The back button is absolutely positioned over the top-left. Once the title
   moved onto the shared rail it collided with that button, so the button now
   gets its own row: the eyebrow line is given the button's height and the
   offset, and the title starts below it. One rail preserved, no overlap. */
/* The back button was 40x40, under the 44px floor every other control meets,
   and it shares the top-left corner with the eyebrow row. Give it the full
   touch target, a solid ground so it always reads as a control, and a
   stacking order nothing in the header can climb above. */
/* Two real defects here, both measured on the live build.

   1. The eyebrow (.ovl) box started at x=18 - the same pixel as the back
      button - and ran the full 354px header width. Padding moved its TEXT
      clear but not its box, so .ovl stayed a click target underneath and
      around the button. .ovl is the territory-switcher trigger, so a tap
      that missed the arrow by a few pixels opened the territory sheet
      instead of going back. That is what made going back a task. Margin,
      not padding: the box now begins after the button and cannot be hit.

   2. The button was 14% opaque, so whatever sat behind it showed through
      and read as a coloured tile with the chevron on top. It is opaque now
      and nothing can ever bleed through it. */
#backbtn{left:var(--gutter);top:calc(6px + var(--safe-t));
 width:44px;height:44px;z-index:70;
 background:#2B2822;border:1px solid rgba(242,239,232,.18);
 border-radius:13px;color:#F2EFE8;font-size:19px;line-height:1;
 display:flex;align-items:center;justify-content:center}
#backbtn:active{background:#3A362E;transform:scale(.94)}
.hasback header.top{padding-top:calc(6px + var(--safe-t))}
.hasback header.top .ovl{
 margin-left:calc(var(--backrail) + 10px);padding-left:0;
 min-height:44px;display:flex;align-items:center}

/* no negative margins: these were the 0px and 46px rails */
header.top .tsw3,header.top .tsw,header.top .seg{margin-left:0;margin-right:0;padding-left:0;padding-right:0}
header.top .homesearch{margin-left:0;margin-right:0;padding-left:0;padding-right:0;padding-top:10px;padding-bottom:12px}
.ribbon{margin-left:0;margin-right:0;padding-left:0;padding-right:0}
.wrap>.row{margin-left:0;margin-right:0}

/* every child may shrink; nothing gets a min-content floor */
.wrap,.wrap *,header.top *{min-width:0}
.ent,.card.mini,.rowl,.panel,.hcard,.fsec,.fsec-h{max-width:100%}

/* statistic grid: 1fr has a min-content floor and will overflow. minmax(0,1fr)
   is the fix, and it drops to one column when two cannot fit honestly. */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px;margin:10px 0;width:100%}
@media(max-width:359px){.grid2{grid-template-columns:minmax(0,1fr)}}
.hcard{min-width:0;max-width:100%;overflow-wrap:anywhere;hyphens:none}
.hcard b,.hcard span{min-width:0;overflow-wrap:break-word;white-space:normal}

/* The premium build bled the chip strips past the gutter with negative
   margins. That was the last rail break and the last negative margin, so the
   strips now start on the shared rail and scroll from there. */
.wrap .preset,.wrap .frow,.wrap .fchips,.wrap .chips{
 margin-left:0!important;margin-right:0!important;
 padding-left:0;padding-right:0;max-width:100%}

/* small stragglers that carried their own indent */
.count,.lhead,.homesearch,.empty,.mgpend{margin-left:0;margin-right:0;padding-left:0;padding-right:0}

/* ==========================================================================
   TYPOGRAPHY REPAIR

   "22,278exact" was not a data bug. .rowl was display:block, so the label
   span and the status <b> were adjacent inline nodes with no whitespace in
   the template between them, and the browser ran them together. Rows are now
   a real flex layout: label left, value right, a gap that cannot collapse.

   Tracked uppercase is for short eyebrows only. Explanatory sentences move
   out of the heading onto their own normal-case line.
   ========================================================================== */

/* rows: label left, number right, gap that is layout, not typed spaces */
.rowl{display:flex;align-items:baseline;justify-content:space-between;
 gap:16px;padding:13px 0;border-bottom:1px solid var(--rule);
 font-size:15px;line-height:1.4}
.rowl .lbl{flex:1 1 auto;min-width:0;overflow-wrap:break-word;
 color:var(--ink-2);font-weight:600;letter-spacing:0;text-transform:none}
.rowl>b,.rowl .rv{flex:0 0 auto;white-space:nowrap;
 font-variant-numeric:tabular-nums;font-weight:750;color:var(--ink)}
.rowl .rv{display:inline-flex;align-items:baseline;gap:10px}

/* the verified-total row: number and badge are separate elements */
.rowl-total{border-bottom:0;padding-top:14px}
.vbadge{font-style:normal;font-size:11px;font-weight:750;letter-spacing:.02em;
 padding:3px 8px;border-radius:999px;white-space:nowrap}
.vbadge.ok{background:rgba(47,107,79,.12);color:#245A40}
.vbadge.bad{background:var(--danger-bg);color:var(--danger)}

/* Two heading treatments, told apart by whether a supporting line exists.
   A panel that carries a .psub is a real section title: sentence case, no
   tracking. A panel without one is a short eyebrow label - those are the
   only place tracked uppercase is still allowed. */
.panel>b{display:flex;align-items:center;gap:8px;
 font-size:11px;font-weight:800;letter-spacing:.14em;
 line-height:1.5;color:var(--ink-4);text-transform:uppercase;padding:0 0 8px}
.panel:has(.psub)>b{display:block;font-size:16px;font-weight:750;
 letter-spacing:-.015em;line-height:1.3;color:var(--ink);
 text-transform:none;padding:0;margin:0}
.psub{margin:3px 0 10px;font-size:13px;line-height:1.45;font-weight:500;
 color:var(--ink-4);letter-spacing:0;text-transform:none}

/* tracked uppercase survives ONLY on short eyebrow labels */
.ovl{text-transform:uppercase;letter-spacing:.14em}
h2,.count{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink-4)}

/* header: automatic height, no fixed height, no clipping of any kind */
header.top .sub,header.top .sub:last-of-type,header.top h1{
 display:block!important;-webkit-line-clamp:unset!important;
 overflow:visible!important;max-height:none!important;
 font-size:13px;line-height:1.45;letter-spacing:0}
header.top h1{font-size:21px;line-height:1.15}
header.top,header.top *{max-height:none}
header.top{overflow:visible;height:auto}

/* the summary panel is a card: its rows need room from its own border, and
   the number must never touch the edge */
.panel{padding:14px 16px;border-radius:var(--r-card,16px);
 background:var(--raise);border:1px solid var(--rule);overflow:hidden}
.panel .rowl{padding-left:0;padding-right:0}
.panel .rowl:last-child{border-bottom:0}

/* search: the short placeholder must be fully visible at 320px */
.homesearch input{text-overflow:clip}
.homesearch input::placeholder{font-size:15px;letter-spacing:0}

/* Type floor: nothing on a field screen drops below 11.5px, and anything
   carrying real information sits at 12.5px or above. Only the short tracked
   eyebrow labels are allowed at the floor. */
.ovl,.vbadge,.ent-rel,.mc,.tag{font-size:11.5px}
/* accessibility floor: authoritative, because the block that sets 10.5px
   sits below this one in the file and would otherwise win on order */
header.top .ovl{font-size:11.5px!important;letter-spacing:.13em}
.panel>b{font-size:11.5px}
.panel:has(.psub)>b{font-size:16px}
.psub,.ent-m,.ent-why,.card.mini .em,.card.mini .ea,.meta,.count,.st,
.ribbon span,.fsec-h span,.hcard span{font-size:12.5px}
.rowl,.rowl .lbl,.rowl>b{font-size:15px}
.ent-safe b{font-size:12.5px}
.ent-safe span,.ent-safe em{font-size:12px}

/* body copy never carries letter spacing */
p,.ent-m,.ent-why,.card.mini .em,.card.mini .ea,.meta,.sub{letter-spacing:0}

/* long real labels must wrap, never clip */
.ent-n,.card.mini .en,.fsec-h b,.rowl .lbl,.hcard b{overflow-wrap:break-word;white-space:normal}

/* ---- 1. THE SPINE: full-bleed, square, structural --------------------- */
header.top{background:var(--spine);color:#F2EFE8;border-radius:0;
 padding:calc(10px + var(--safe-t)) 18px 0;box-shadow:none}
header.top h1{font-size:21px;line-height:1.1;letter-spacing:-.03em;font-weight:750;margin:0}
header.top .ovl{font-size:10.5px;letter-spacing:.16em;color:var(--accent);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:12.5px;line-height:1.35;color:rgba(242,239,232,.62);margin-top:4px}
header.top .sub b{font-size:14px;color:#F2EFE8;font-weight:650}
header.top .sub:last-of-type{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---- 2. TERRITORY: editorial tab row, not a segmented pill ------------ */
header.top .tsw,header.top .seg{background:transparent;border-radius:0;gap:0;
 display:flex;margin:10px 0 0;padding:0;
 border-top:1px solid rgba(242,239,232,.12)}
header.top .tsw button,header.top .seg button{
 background:transparent;border:0;border-radius:0;
 color:rgba(242,239,232,.55);font-size:13px;font-weight:650;letter-spacing:-.01em;
 padding:12px 0;margin-right:20px;min-height:44px;
 box-shadow:inset 0 -2px 0 transparent;
 transition:color 140ms var(--ease),box-shadow 140ms var(--ease)}
header.top .tsw button.on,header.top .seg button.on{
 color:#F2EFE8;box-shadow:inset 0 -2px 0 var(--accent)}

/* the real switcher is .tsw3 - a filled pill container with a filled active
   chip inside it, i.e. the stock segmented control. Strip the container and
   the chip entirely; the active territory is marked by weight and a rule. */
header.top .tsw3{background:transparent!important;border-radius:0;gap:0;
 display:flex;margin:10px 0 0;padding:0;
 border-top:1px solid rgba(242,239,232,.12)}
header.top .tsw3 button{background:transparent!important;border:0;border-radius:0!important;
 color:rgba(242,239,232,.52);font-size:13px;font-weight:650;letter-spacing:-.01em;
 padding:12px 0;margin-right:22px;min-height:44px;box-shadow:inset 0 -2px 0 transparent;
 transition:color 140ms var(--ease),box-shadow 140ms var(--ease)}
header.top .tsw3 button.on{color:#F2EFE8;box-shadow:inset 0 -2px 0 var(--accent)}

/* route action sits with the strip it belongs to, not floating in a band */
.wrap>.row{margin:10px 0 0!important}
.wrap>.row .btn.gold{width:100%;max-width:none}

header.top .homesearch{margin:0;padding:10px 0 12px;
 border-top:1px solid rgba(242,239,232,.12)}
header.top .homesearch input{background:rgba(242,239,232,.07);
 border:1px solid rgba(242,239,232,.14);color:#F2EFE8;min-height:44px;
 border-radius:10px;font-size:16px;box-shadow:none}
header.top .homesearch input::placeholder{color:rgba(242,239,232,.45)}

/* ---- 3. ROUTE STRIP: dense line, not an empty card -------------------- */
.ribbon{background:transparent;border:0;border-bottom:1px solid var(--rule);
 border-radius:0;box-shadow:none;margin:0;padding:12px 0;
 display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.ribbon b{font-size:19px;font-weight:750;letter-spacing:-.02em;color:var(--ink);margin-right:4px}
.ribbon span{font-size:12px;color:var(--ink-4);font-weight:600}
.ribbon .rb-idle{font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.ribbon .rb-2 b{font-size:14px;color:var(--ink-3)}

/* white on this orange measured 3.7:1, under AA for 14.5px bold. The ink
   reads at 5.4:1 and is the more distinctive choice anyway. */
.btn.gold,.row .btn.gold{background:var(--accent);color:#1A0E06;border:0;border-radius:10px;
 min-height:46px;font-size:14.5px;font-weight:700;letter-spacing:-.01em;
 padding:0 18px;width:auto;box-shadow:none}

/* ---- 4. FEED SECTIONS -------------------------------------------------- */
.fsec{margin:22px 0 0}
.fsec-h{display:flex;align-items:baseline;gap:10px;
 padding:0 0 8px;margin:0 0 2px;border-bottom:1px solid var(--rule-2)}
.fsec-h b{font-size:13px;font-weight:750;letter-spacing:.02em;color:var(--ink)}
.fsec-h span{font-size:12px;color:var(--ink-4)}
.fsec-h .more{margin-left:auto;font-size:12.5px;font-weight:650;color:var(--accent-ink);
 background:transparent;border:0;padding:6px 0 6px 12px;min-height:44px}

/* ---- 5. THE ENTRY: editorial row, trailing action --------------------- */
.frail{display:block;padding:0;margin:0;overflow:visible}
.ent{position:relative;display:grid;grid-template-columns:1fr auto;
 grid-template-areas:"name act" "meta act" "why act" "safe safe";
 column-gap:14px;row-gap:2px;padding:13px 0;
 border-bottom:1px solid var(--rule);background:transparent}
.ent:last-child{border-bottom:0}
.ent-open{grid-area:name;background:none;border:0;padding:0;text-align:left;
 font:inherit;color:inherit;cursor:pointer;min-width:0;width:100%}
.ent-open::after{content:'';position:absolute;inset:0;z-index:0}
.ent-n{display:block;font-size:16.5px;font-weight:700;line-height:1.24;
 letter-spacing:-.02em;color:var(--ink);text-wrap:pretty}
.ent-m{grid-area:meta;font-size:12.5px;line-height:1.35;color:var(--ink-4);
 display:flex;flex-wrap:wrap;align-items:center;gap:0 8px}
.ent-why{grid-area:why;font-size:12.5px;line-height:1.35;font-weight:650;
 color:var(--ink-3);margin-top:1px}

.ent-rel{display:inline-flex;align-items:center;gap:4px;font-size:11px;
 font-weight:700;letter-spacing:.04em;color:var(--ink-3);text-transform:uppercase}
.ent-rel i{width:3px;height:11px;border-radius:1px;background:var(--rule-2)}
.ent-rel i.on{background:var(--ink)}
.ent-rel i:nth-child(2).on{background:var(--accent)}

.ent-go{grid-area:act;align-self:center;position:relative;z-index:1;
 background:transparent;color:var(--accent-ink);
 border:1px solid var(--rule-2);border-radius:9px;
 min-width:58px;min-height:52px;padding:6px 10px;
 font-size:11.5px;font-weight:750;line-height:1.15;letter-spacing:.01em;
 text-align:center;cursor:pointer;
 transition:transform 120ms var(--ease),background-color 120ms var(--ease)}
.ent-go:active{transform:scale(.96);background:rgba(228,87,31,.10)}

.ent-safe{grid-area:safe;margin-top:7px;padding:7px 10px;border-radius:8px;
 border-left:3px solid currentColor;background:var(--warn-bg);color:var(--warn)}
.ent-safe.crit{background:var(--danger-bg);color:var(--danger)}
.ent-safe b{display:block;font-size:12px;font-weight:800;line-height:1.25}
.ent-safe span,.ent-safe em{display:block;font-size:11.5px;font-weight:600;font-style:normal}
.ent-blocked .ent-n{color:var(--ink-2)}

/* ---- 6. DIRECTORY ROWS speak the same language ------------------------ */
.card.mini{background:transparent;box-shadow:none;border:0;border-radius:0;
 border-bottom:1px solid var(--rule);padding:13px 0;margin:0;gap:12px}
.card.mini .en{font-size:16.5px;font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:1.24}
.card.mini .em{font-size:12.5px;color:var(--ink-4);line-height:1.35;margin-top:2px}
.card.mini .ea{font-size:12.5px;font-weight:650;margin-top:3px}
.card.mini .ea::before{display:none}
.mgb{border-left:3px solid currentColor;border-radius:8px;padding:7px 10px;margin-top:6px}

/* ---- 7. DENSITY -------------------------------------------------------- */
.wrap{padding:0 var(--gutter) 24px}
.lhead{border-bottom:1px solid var(--rule-2);padding-bottom:8px}
.homesearch{margin-top:14px}

/* ---- 8. NAV integrated with the spine --------------------------------- */
nav.bot{background:var(--spine);border-radius:0;
 box-shadow:inset 0 1px 0 rgba(242,239,232,.10)}

@media(prefers-reduced-motion:reduce){
 .ent-go,header.top .tsw button{transition:none}
 .ent-go:active{transform:none}
}

/* ==========================================================================
   SPEED

   Baseline measured on the 22,278-record list: 12 scroll frames cost 177.8ms,
   about 14.8ms each. That is inside the 16.7ms budget but with almost nothing
   to spare, so any slower phone drops frames.

   content-visibility:auto lets the browser skip layout, style and paint for
   rows that are off-screen entirely. contain-intrinsic-size gives it the row
   height up front so the scrollbar does not jump as rows enter and leave.
   Both are native CSS - no library, no JS, no change to markup or data.
   ========================================================================== */
.card.mini,.ent{
 content-visibility:auto;
 contain-intrinsic-size:auto 86px;
 contain:layout style paint}

/* panels and sections are tall and independent; isolate their layout so a
   change inside one cannot force the whole page to re-lay-out */
.panel,.fsec{contain:layout style}

/* the header repaints on every scroll tick for the condensing bar; keep it
   on its own layer so that repaint never touches the list underneath */
nav.bot,.cbar{contain:layout style paint}
/* ==========================================================================
   ELITE -  "Field Ledger"

   Design read: this is a dense field-operations tool for a sales rep holding
   a phone in one hand, outdoors, in Trinidad sun, standing outside a shop.
   taste-skill puts landing-page advice explicitly OUT of scope here (§13), so
   what is taken from it is the anti-default discipline: §4.2 (this exact
   cream/orange family is the most over-reached AI palette, so it has to earn
   its contrast), §4.4 (cards only when elevation carries hierarchy), §9
   (AI tells), §9.G (zero em-dashes). The governing systems are
   ui-ux-pro-max priorities 1-5 and motion-design's Corporate archetype,
   clamped to 110-220ms because 350-600ms is unusable one-handed outdoors.

   Dials: VARIANCE 4 (a tool, not a poster - variance comes from rhythm
   between row TYPES, not from asymmetric grids), MOTION 3 (feedback only,
   never decoration), DENSITY 7 (cockpit-leaning; above 7 taste-skill bans
   generic card containers outright, which is the same conclusion /studio/
   reached from the other direction).

   The one structural idea: A LEDGER HAS A MARGIN RULE. Every entry carries a
   3px state rail on its left edge, and that rail is the only place colour
   lives in a list. It does, in three pixels, the job that the meaningless
   two-bar meter, the pale safety slab and the repeated boxed button were all
   failing to do separately. Colour is never the sole carrier: every rail has
   a word beside it (WCAG 1.4.1, ui-ux-pro-max color-not-only).
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. TOKENS

   Every foreground/background pair below was computed, not eyeballed:
     ink   #100F0C on page 16.83:1   ink-2 #383530 10.72:1
     ink-3 #5E594F  6.11:1           ink-4 #6E6859  4.87:1
     accent-ink #93340E 6.73:1       green-ink #17402F 10.18:1
     amber #7A4E00 6.32:1            clay  #8E2A22  7.36:1
     ink on accent fill #1C0A02 on #D8511B 4.67:1
   /studio/'s muted meta colour measured 3.50:1 and carried real information
   at 12.5px. That is a WCAG AA failure, so ink-4 was darkened until it read.
   White on the orange measures 4.11:1, so the primary button keeps ink text.
   -------------------------------------------------------------------------- */
:root{
 --e-ink:#100F0C; --e-ink-2:#383530; --e-ink-3:#5E594F; --e-ink-4:#6E6859;
 --e-page:#F3F0E8; --e-raise:#FCFAF5;
 --e-wash:rgba(16,15,12,.035); --e-wash-2:rgba(16,15,12,.055);
 --e-rule:rgba(16,15,12,.09); --e-rule-2:rgba(16,15,12,.155); --e-rule-3:rgba(16,15,12,.30);
 --e-accent:#D8511B; --e-accent-ink:#93340E; --e-accent-wash:rgba(216,81,27,.09);
 --e-green:#1F5140; --e-green-ink:#17402F; --e-green-wash:rgba(31,81,64,.09);
 --e-amber:#7A4E00; --e-amber-wash:rgba(122,78,0,.09);
 --e-clay:#8E2A22;  --e-clay-wash:rgba(142,42,34,.08);
 --e-onink:#F3F0E8; --e-onink-2:#B4AFA3; --e-onink-3:#8D887C; --e-onink-accent:#F2884F;

 /* ONE spacing rhythm, 4px base (ui-ux-pro-max spacing-scale) */
 --e-1:4px; --e-2:8px; --e-3:12px; --e-4:16px; --e-5:22px; --e-6:32px; --e-7:44px;

 /* ONE radius system (taste-skill 4.4 Shape Consistency Lock).
    0 structural · 3 rail · 10 control · 14 group · 20 sheet.
    Concentric: sheet 20 = control 10 + its 10px inset. No pills anywhere. */
 --e-r-rail:3px; --e-r-ctl:10px; --e-r-group:14px; --e-r-sheet:20px;

 /* Motion. Corporate archetype, clamped. Exit is 68% of enter, per
    ui-ux-pro-max exit-faster-than-enter. */
 --e-tap:110ms; --e-ui:170ms; --e-in:220ms; --e-out:150ms;
 --e-ez:cubic-bezier(.2,0,0,1);          /* standard, snappy */
 --e-ez-in:cubic-bezier(.05,.7,.1,1);    /* emphasised decelerate, entrances */
 --e-ez-out:cubic-bezier(.3,0,1,1);      /* accelerate, exits */

 --e-rail:3px;                            /* state rail width */
 --e-railgap:11px;                        /* rail to text */
}

/* macOS/iOS text rendering. Numbers are tabular everywhere because this app
   is mostly counts, and a proportional 1 makes a column of totals wobble. */
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{background:var(--e-page);color:var(--e-ink);font-variant-numeric:tabular-nums}

/* Headings and short labels balance; body copy gets pretty. Never both on
   long prose. (make-interfaces-feel-better) */
h1,h2,.ent-n,.card.mini .en,.fsec-h b,.panel>b,.hcard b{text-wrap:balance}
.ent-why,.ent-m,.psub,.sub,.card.mini .em,.mgb span,.ent-safe span{text-wrap:pretty}

/* Nothing in this build uses transition:all. Anything inherited that does is
   scoped down to compositor-safe properties only. */
*{transition-property:opacity,transform,color,background-color,border-color,box-shadow}

/* --------------------------------------------------------------------------
   2. THE SPINE

   /studio/ made the header a flat black slab with a tracked orange eyebrow.
   Two problems: on Business Directory the last subtitle line was sliced in
   half by the black/cream boundary (measured, not inferred), and the eyebrow
   read as decoration rather than as the territory it names.

   The spine now closes on a 2px accent rule instead of a raw colour change,
   the type sits on a real scale, and the block cannot clip because nothing
   in it is line-clamped or height-capped.
   -------------------------------------------------------------------------- */
header.top{
 background:var(--e-ink);color:var(--e-onink);
 padding:calc(12px + var(--safe-t)) var(--gutter) 0;
 border-bottom:2px solid var(--e-accent);
 overflow:visible}

header.top .ovl{
 font-size:11.5px!important;font-weight:750;letter-spacing:.15em;
 color:var(--e-onink-accent);text-transform:uppercase;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

header.top h1{
 font-size:27px;line-height:1.06;letter-spacing:-.035em;font-weight:700;
 margin:2px 0 0;color:var(--e-onink)}
@media(max-width:359px){header.top h1{font-size:24px}}

/* Subtitles: real line-height, no clamp, and guaranteed clearance from the
   bottom edge so a descender can never be cut by the boundary. */
header.top .sub,header.top .sub:last-of-type,header.top p.sub{
 display:block!important;-webkit-line-clamp:unset!important;
 overflow:visible!important;max-height:none!important;
 font-size:13.5px;line-height:1.5;letter-spacing:0;
 color:var(--e-onink-2);margin:5px 0 0;padding-bottom:2px}
header.top .sub b{color:var(--e-onink);font-weight:700;font-size:14.5px}
header.top>*:last-child{margin-bottom:14px}

/* the back control: 44px, opaque, its own row, never sharing pixels with the
   eyebrow's click target (that collision is documented in the handoff). */
#backbtn{
 left:var(--gutter);top:calc(8px + var(--safe-t));
 width:44px;height:44px;z-index:70;
 background:#242119;border:1px solid rgba(243,240,232,.16);
 border-radius:var(--e-r-ctl);color:var(--e-onink);
 font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;
 transition-duration:var(--e-tap);transition-timing-function:var(--e-ez)}
#backbtn:active{background:#332F25;transform:scale(.94)}
.hasback header.top{padding-top:calc(8px + var(--safe-t))}
.hasback header.top .ovl{margin-left:calc(var(--backrail) + 12px);padding-left:0;
 min-height:44px;display:flex;align-items:center}

/* Territory row: weight and a 2px rule, no segmented pill. */
header.top .tsw3,header.top .tsw,header.top .seg{
 background:transparent!important;border-radius:0;gap:0;display:flex;
 margin:12px 0 0;padding:0;border-top:1px solid rgba(243,240,232,.13)}
header.top .tsw3 button,header.top .tsw button,header.top .seg button{
 background:transparent!important;border:0;border-radius:0!important;
 color:var(--e-onink-3);font-size:13.5px;font-weight:650;letter-spacing:-.01em;
 padding:13px 0;margin-right:24px;min-height:46px;
 box-shadow:inset 0 -2px 0 transparent;
 transition-duration:var(--e-ui);transition-timing-function:var(--e-ez)}
header.top .tsw3 button.on,header.top .tsw button.on,header.top .seg button.on{
 color:var(--e-onink);font-weight:750;box-shadow:inset 0 -2px 0 var(--e-accent)}
header.top .tsw3 button:active,header.top .tsw button:active{color:var(--e-onink)}

/* Search sits in the spine, dark, 16px so iOS does not zoom the page. */
header.top .homesearch{margin:0;padding:12px 0 14px;
 border-top:1px solid rgba(243,240,232,.13)}
header.top .homesearch input{
 background:rgba(243,240,232,.06);border:1px solid rgba(243,240,232,.17);
 color:var(--e-onink);min-height:46px;border-radius:var(--e-r-ctl);
 font-size:16px;box-shadow:none;padding:0 14px}
header.top .homesearch input::placeholder{color:var(--e-onink-3)}
header.top .homesearch input:focus{outline:2px solid var(--e-onink-accent);outline-offset:1px;
 border-color:transparent}

/* --------------------------------------------------------------------------
   3. THE LEDGER ENTRY

   Before: name / town · category ▌▏YOL / repeated identical instruction, with
   a boxed two-line "Log / visit" control repeating down the page.

   The two 3x11px <i> bars rendered as literal pipe characters next to the
   word - that is the "|| YOL" the owner flagged, and it is not a typo, it is
   an unlabelled 2-segment meter nothing in the app explains. It is gone.

   After:
     ▌ Daniel's Grocery
     ▌ Chaguaramas · Supermarket / grocery              Log visit
     ▌ Buys from YOL.  Introduce MYCO.
   The rail carries state. The relationship is words. The instruction is
   separated from the state by weight and colour, not by a dash.
   -------------------------------------------------------------------------- */
.frail{display:block;padding:0;margin:0;overflow:visible}

.ent{
 position:relative;display:grid;
 grid-template-columns:1fr auto;
 grid-template-areas:"name act" "meta act" "rel act" "why act" "safe safe";
 column-gap:var(--e-3);row-gap:2px;
 padding:14px 0 14px calc(var(--e-rail) + var(--e-railgap));
 border-bottom:1px solid var(--e-rule);background:transparent}
.ent:last-child{border-bottom:0}

/* THE RAIL. One element, no extra DOM: a pseudo-element on the row. */
.ent::before{
 content:'';position:absolute;left:0;top:12px;bottom:12px;
 width:var(--e-rail);border-radius:var(--e-r-rail);
 background:var(--e-rule-3)}
.ent.e-cust::before{background:var(--e-green)}
.ent.e-opp::before {background:var(--e-accent)}
.ent.e-warn::before{background:var(--e-amber)}
.ent.e-stop::before{background:var(--e-clay)}
.ent.e-quiet::before{background:var(--e-rule-2)}

.ent-open{
 grid-area:name;background:none;border:0;padding:0;text-align:left;
 font:inherit;color:inherit;cursor:pointer;min-width:0;width:100%;
 min-height:26px;display:block}
/* the whole row is the target; the trailing action sits above it on z */
.ent-open::after{content:'';position:absolute;inset:0;z-index:0}
.ent-open:focus-visible{outline:none}
.ent-open:focus-visible::after{outline:2px solid var(--e-accent-ink);outline-offset:-2px;border-radius:6px}

.ent-n{display:block;font-size:17px;font-weight:700;line-height:1.22;
 letter-spacing:-.022em;color:var(--e-ink)}

.ent-m{grid-area:meta;font-size:12.5px;line-height:1.4;color:var(--e-ink-4);
 font-weight:550;margin-top:1px;display:block;overflow-wrap:break-word}

/* the relationship line: state in ink, instruction in accent. No dash, no
   bars, no unexplained number. Reads as a sentence at a glance. */
.ent-rel{grid-area:rel;display:block;margin-top:3px;
 font-size:12.5px;line-height:1.4;letter-spacing:0;text-transform:none}
.e-rel-state{font-weight:700;color:var(--e-ink-2)}
.e-rel-do{font-weight:700;color:var(--e-accent-ink);margin-left:7px}
/* no separator glyph: a dot between the state and the instruction is exactly
   the decorative punctuation the owner flagged, and weight plus colour already
   separate the two halves. (taste-skill 9.F) */
.e-rel-do{margin-left:6px}

.ent-why{grid-area:why;font-size:12.5px;line-height:1.4;font-weight:650;
 color:var(--e-ink-3);margin-top:2px}

/* THE ACTION. Five identical boxed two-line buttons down a page is the
   "mechanical" feel the owner named. The box carried no information that the
   position and the colour did not already carry, so the box is gone and the
   words stay. Target is 52px tall and the full width of its column, separated
   from the row target by a hairline. (taste-skill 4.4 applied to controls.) */
.ent-go{
 grid-area:act;align-self:center;position:relative;z-index:2;
 background:transparent;color:var(--e-accent-ink);
 border:0;border-left:1px solid var(--e-rule);border-radius:0;
 min-width:78px;min-height:52px;padding:0 0 0 var(--e-3);margin-left:2px;
 font-size:12.5px;font-weight:750;line-height:1.2;letter-spacing:-.005em;
 text-align:right;cursor:pointer;white-space:nowrap;
 display:flex;align-items:center;justify-content:flex-end;
 transition-duration:var(--e-tap);transition-timing-function:var(--e-ez)}
.ent-go:active{background:var(--e-accent-wash);transform:scale(.97)}
.ent-go:focus-visible{outline:2px solid var(--e-accent-ink);outline-offset:-2px}
.ent-go br{display:none}
@media(max-width:339px){.ent-go{min-width:66px;font-size:12px}}

/* Safety block. Sits on the rail's colour, uses a wash rather than a slab,
   and never repeats a sentence the row already shows. */
.ent-safe{grid-area:safe;margin:9px 0 0;padding:9px 11px;
 border-radius:var(--e-r-ctl);border:0;border-left:0;
 background:var(--e-amber-wash);color:var(--e-amber)}
.ent-safe.crit{background:var(--e-clay-wash);color:var(--e-clay)}
.ent-safe b{display:block;font-size:12.5px;font-weight:800;line-height:1.3;letter-spacing:.005em}
.ent-safe span,.ent-safe em{display:block;font-size:12px;font-weight:600;
 font-style:normal;line-height:1.4;margin-top:2px;color:var(--e-ink-3)}
.ent-blocked .ent-n{color:var(--e-ink-2)}
.ent-blocked .ent-m{color:var(--e-ink-4)}

/* --------------------------------------------------------------------------
   4. DIRECTORY ROWS speak the identical language
   -------------------------------------------------------------------------- */
.card.mini{
 position:relative;background:transparent;box-shadow:none;border:0;border-radius:0;
 border-bottom:1px solid var(--e-rule);
 padding:14px 0 14px calc(var(--e-rail) + var(--e-railgap));margin:0;gap:var(--e-3)}
.card.mini::before{content:'';position:absolute;left:0;top:12px;bottom:12px;
 width:var(--e-rail);border-radius:var(--e-r-rail);background:var(--e-rule-3)}
.card.mini.e-cust::before{background:var(--e-green)}
.card.mini.e-opp::before {background:var(--e-accent)}
.card.mini.e-warn::before{background:var(--e-amber)}
.card.mini.e-stop::before{background:var(--e-clay)}
.card.mini.e-quiet::before{background:var(--e-rule-2)}
.card.mini .en{font-size:17px;font-weight:700;letter-spacing:-.022em;
 color:var(--e-ink);line-height:1.22}
.card.mini .em{font-size:12.5px;color:var(--e-ink-4);line-height:1.4;
 margin-top:2px;font-weight:550}
.card.mini .ea{font-size:12.5px;font-weight:700;margin-top:3px;color:var(--e-ink-3)}
.card.mini .ea::before{display:none}

.mgb{border:0;border-radius:var(--e-r-ctl);padding:9px 11px;margin-top:8px;
 background:var(--e-amber-wash);color:var(--e-amber)}
.mgb.x{background:var(--e-clay-wash);color:var(--e-clay)}
.mgb b{display:block;font-size:12.5px;font-weight:800;line-height:1.3}
.mgb span,.mgb em{display:block;font-size:12px;font-weight:600;font-style:normal;
 line-height:1.4;margin-top:2px;color:var(--e-ink-3)}
.mgb .mgev{font-size:11.5px;color:var(--e-ink-4);margin-top:4px}

/* --------------------------------------------------------------------------
   5. SECTION HEADINGS + COUNTS AS ONE SYSTEM

   Before, a section header was: bold label, a grey count, and a red "See all"
   floating right, each on its own type scale, so three sections in a row read
   as three different components. They are one component now: a heading, its
   count set in the same tabular column language used everywhere else, and a
   text link that is a real 44px target.
   -------------------------------------------------------------------------- */
.fsec{margin:26px 0 0;contain:layout style}
.fsec-h{display:flex;align-items:baseline;gap:10px;
 padding:0 0 9px;margin:0 0 2px;
 border-bottom:2px solid var(--e-ink)}
.fsec-h b{font-size:14.5px;font-weight:750;letter-spacing:-.017em;color:var(--e-ink);
 flex:0 1 auto;min-width:0}
.fsec-h span{font-size:12.5px;color:var(--e-ink-4);font-weight:650;white-space:nowrap}
.fsec-h .more{margin-left:auto;font-size:12.5px;font-weight:750;
 color:var(--e-accent-ink);background:transparent;border:0;
 padding:6px 0 6px 14px;min-height:44px;display:flex;align-items:center;white-space:nowrap;
 transition-duration:var(--e-tap)}
.fsec-h .more:active{opacity:.55}
.fsec-h .more:focus-visible{outline:2px solid var(--e-accent-ink);outline-offset:2px}

h2,.count,.lhead{font-size:13px;color:var(--e-ink-4);letter-spacing:0;text-transform:none}
.lhead{border-bottom:2px solid var(--e-ink);padding-bottom:9px}

/* --------------------------------------------------------------------------
   6. PANELS: a ledger block, not a floating white card

   The directory's classification table was a large white card sitting on
   cream with seven identical-weight rows. That is precisely "looks like a
   database list". A ledger block instead: flush to the rail, a heavy top
   rule, a quiet wash, numbers in a right-hand column, and the verified total
   set apart by a rule rather than by another container.
   -------------------------------------------------------------------------- */
.panel{
 background:var(--e-wash);border:0;border-top:2px solid var(--e-ink);
 border-radius:0 0 var(--e-r-group) var(--e-r-group);
 padding:var(--e-4) var(--e-4) var(--e-2);margin:var(--e-5) 0 0;overflow:hidden;
 contain:layout style}
.panel>b{display:flex;align-items:center;gap:8px;
 font-size:11.5px;font-weight:800;letter-spacing:.14em;line-height:1.5;
 color:var(--e-ink-4);text-transform:uppercase;padding:0 0 var(--e-2)}
.panel:has(.psub)>b{display:block;font-size:16.5px;font-weight:750;
 letter-spacing:-.022em;line-height:1.25;color:var(--e-ink);
 text-transform:none;padding:0;margin:0}
.psub{margin:4px 0 var(--e-3);font-size:13px;line-height:1.45;font-weight:550;
 color:var(--e-ink-4);letter-spacing:0;text-transform:none}

.rowl{display:flex;align-items:baseline;justify-content:space-between;
 gap:var(--e-4);padding:13px 0;border-bottom:1px solid var(--e-rule);
 font-size:15px;line-height:1.4}
.rowl .lbl{flex:1 1 auto;min-width:0;overflow-wrap:break-word;
 color:var(--e-ink-2);font-weight:600;letter-spacing:0;text-transform:none}
.rowl>b,.rowl .rv{flex:0 0 auto;white-space:nowrap;
 font-variant-numeric:tabular-nums;font-weight:750;color:var(--e-ink);
 font-size:16px;letter-spacing:-.02em}
.rowl .rv{display:inline-flex;align-items:baseline;gap:10px}
.panel .rowl:last-child,.rowl-total{border-bottom:0}
.rowl-total{padding-top:15px;margin-top:2px;border-top:2px solid var(--e-ink)}
.rowl-total .lbl{font-weight:750;color:var(--e-ink)}
.rowl-total>b,.rowl-total .rv{font-size:19px}

/* the verified badge: a mark, never a pill, and never colour alone */
.vbadge{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;
 text-transform:uppercase;padding:4px 8px;border-radius:6px;white-space:nowrap}
.vbadge.ok{background:var(--e-green-wash);color:var(--e-green-ink)}
.vbadge.bad{background:var(--e-clay-wash);color:var(--e-clay)}

/* two-up statistic grid: minmax(0,1fr) has no min-content floor, plain 1fr
   does and overflows. One column under 360. */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:var(--e-2);margin:var(--e-3) 0;width:100%}
@media(max-width:359px){.grid2{grid-template-columns:minmax(0,1fr)}}
.hcard{min-width:0;max-width:100%;overflow-wrap:anywhere;hyphens:none;
 background:var(--e-wash);border:0;border-left:var(--e-rail) solid var(--e-rule-2);
 border-radius:0 var(--e-r-ctl) var(--e-r-ctl) 0;padding:11px 13px}
.hcard b{display:block;font-size:21px;font-weight:750;letter-spacing:-.03em;
 color:var(--e-ink);line-height:1.1;overflow-wrap:break-word;white-space:normal}
.hcard span{display:block;font-size:12.5px;color:var(--e-ink-4);font-weight:600;
 line-height:1.35;margin-top:3px;overflow-wrap:break-word;white-space:normal}

/* --------------------------------------------------------------------------
   7. CONTROLS

   One button system. Primary is filled accent with ink text (white measured
   4.11:1 on this orange, ink measures 4.67:1). Secondary is a rule. There is
   never more than one filled action on a screen.
   -------------------------------------------------------------------------- */
.btn{border-radius:var(--e-r-ctl);font-family:inherit;letter-spacing:-.012em;
 transition-duration:var(--e-tap);transition-timing-function:var(--e-ez)}
.btn.gold,.row .btn.gold{
 background:var(--e-accent);color:#1C0A02;border:0;border-radius:var(--e-r-ctl);
 min-height:50px;font-size:15.5px;font-weight:750;padding:0 20px;box-shadow:none}
.btn.gold:active{transform:scale(.985);background:#C44715}
.btn.wide,.btn.gold.wide{width:100%;max-width:none;display:flex;
 align-items:center;justify-content:center}
.btn.ghost{background:transparent;border:1px solid var(--e-rule-2);color:var(--e-ink-2);
