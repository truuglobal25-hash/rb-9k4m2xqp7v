 min-height:48px;font-size:14.5px;font-weight:700;border-radius:var(--e-r-ctl)}
.btn.ghost:active{background:var(--e-wash-2);transform:scale(.985)}
.btn:focus-visible{outline:2px solid var(--e-accent-ink);outline-offset:2px}

/* Chip strips were clipped mid-word at the right edge with no sign they
   scrolled, and the pale tint measured badly on cream. They now scroll with
   snap, fade at the cut, and carry a real border. */
.wrap .preset,.wrap .frow,.wrap .fchips,.wrap .chips{
 margin-left:0!important;margin-right:0!important;
 padding-left:0;padding-right:0;max-width:100%;
 display:flex;gap:var(--e-2);overflow-x:auto;overflow-y:hidden;
 scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
 scrollbar-width:none;
 -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);
 mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent)}
.wrap .preset::-webkit-scrollbar,.wrap .chips::-webkit-scrollbar,
.wrap .frow::-webkit-scrollbar,.wrap .fchips::-webkit-scrollbar{display:none}
.preset>*,.chips>*,.frow>*,.fchips>*{scroll-snap-align:start;flex:0 0 auto}
/* .preset .chip is specificity (0,2,0) upstream and painted a pale orange
   wash that measured badly on cream, so a bare .chip selector lost. Matched
   here so source order decides. */
.chip,.preset button,.preset a,.chips button,
.preset .chip,.chips .chip,.frow .chip,.fchips .chip{
 background:var(--e-raise);border:1px solid var(--e-rule-2);
 color:var(--e-ink-2);border-radius:var(--e-r-ctl);
 min-height:44px;padding:0 15px;font-size:13.5px;font-weight:700;
 letter-spacing:-.005em;white-space:nowrap;display:inline-flex;align-items:center;
 transition-duration:var(--e-tap)}
.chip.on,.preset button.on,.chips button.on,
.preset .chip.on,.chips .chip.on,.frow .chip.on,.fchips .chip.on{
 background:var(--e-ink);border-color:var(--e-ink);color:var(--e-page)}
.chip:active,.preset button:active{transform:scale(.97)}

/* --------------------------------------------------------------------------
   8. GEOMETRY. One rail, one gutter, nothing bleeds.
   -------------------------------------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}
:root{--gutter:18px;--backrail:44px}
@media(max-width:359px){:root{--gutter:14px;--backrail:42px}}
html,body{max-width:100%;overflow-x:hidden}
.wrap{width:100%;max-width:760px;margin:0 auto;
 padding:0 var(--gutter) 28px}
.wrap,.wrap *,header.top *{min-width:0}
.ent,.card.mini,.rowl,.panel,.hcard,.fsec,.fsec-h{max-width:100%}
header.top .tsw3,header.top .tsw,header.top .seg,header.top .homesearch,
.ribbon,.wrap>.row,.count,.lhead,.homesearch,.empty,.mgpend{
 margin-left:0;margin-right:0;padding-left:0;padding-right:0}
.ent-n,.card.mini .en,.fsec-h b,.rowl .lbl,.hcard b{overflow-wrap:break-word;white-space:normal}
p,.ent-m,.ent-why,.card.mini .em,.card.mini .ea,.meta,.sub{letter-spacing:0}

/* Type floor. Nothing carrying information drops under 12px; only the short
   tracked eyebrow labels are allowed at 11.5. */
.ovl,.vbadge,.mc,.tag{font-size:11.5px}
.psub,.ent-m,.ent-why,.ent-rel,.card.mini .em,.card.mini .ea,.meta,.count,.st,
.ribbon span,.fsec-h span,.hcard span{font-size:12.5px}

/* --------------------------------------------------------------------------
   9. ROUTE: the screen with 800px of nothing under one button

   Nothing was added. The existing brief and the existing button were
   recomposed: the brief reads as a standfirst at the top, and the single
   action is anchored in the thumb arc at the bottom of the viewport, which
   is where a one-handed control belongs on a 390px phone anyway.
   -------------------------------------------------------------------------- */
#app[data-view="route"] .wrap{
 display:flex;flex-direction:column;
 min-height:calc(100dvh - var(--e-navh,74px) - var(--e-headh,0px));
 padding-bottom:var(--e-4)}
#app[data-view="route"] .wrap>.panel{margin-top:var(--e-4)}
#app[data-view="route"] .wrap>.panel .rowl{
 display:block;border-bottom:0;padding:2px 0 var(--e-2);
 font-size:16px;line-height:1.5;font-weight:550;color:var(--e-ink-2);letter-spacing:-.008em}
/* .btn.wide carries flex:1 1 100% upstream, for use inside a .row. Once the
   wrap became a flex column that grow factor let the button eat the whole
   viewport: 800px of dead cream became a 590px orange slab, which is worse.
   The button is pinned to its own height and pushed down by the auto margin,
   which only resolves once nothing is growing. */
#app[data-view="route"] .wrap>.btn{
 flex:0 0 auto;margin-top:auto;width:100%;max-width:none;height:auto}
/* the empty middle of this screen is real: one fact, one action. It is left
   calm rather than padded with filler, and the action sits in the thumb arc
   where a one-handed control belongs. */
#app[data-view="route"] .wrap>.panel{margin-bottom:var(--e-5)}
#app[data-view="route"] .wrap>.empty{margin-top:var(--e-5)}

/* --------------------------------------------------------------------------
   10. ROUTE STRIP on Home

   Was: a bare line, then a gap, then a full-bleed orange slab. The strip and
   its action are one block now, closed by a rule, so the page reads as a
   sequence of blocks rather than as loose furniture floating on cream.
   -------------------------------------------------------------------------- */
.ribbon{background:transparent;border:0;border-radius:0;box-shadow:none;
 margin:var(--e-4) 0 0;padding:0 0 var(--e-3);
 display:flex;align-items:baseline;gap:var(--e-3);flex-wrap:wrap}
.ribbon b{font-size:20px;font-weight:750;letter-spacing:-.028em;color:var(--e-ink);margin-right:2px}
.ribbon span{font-size:12.5px;color:var(--e-ink-4);font-weight:650}
.ribbon .rb-idle{font-size:16px;font-weight:750;color:var(--e-ink);letter-spacing:-.022em}
.ribbon .rb-2 b{font-size:14.5px;color:var(--e-ink-3)}
/* the strip and its action are one block: no gap between them, one rule
   closing the pair. The once-a-day action stays the only filled control on
   the screen, but it stops out-shouting the shop names the rep is reading. */
.wrap>.row{margin:0 0 var(--e-2)!important;padding-bottom:var(--e-5);
 border-bottom:1px solid var(--e-rule)}
#app[data-view="today"] .ribbon{padding-bottom:var(--e-2)}
#app[data-view="today"] .wrap>.row{margin-top:0!important;padding-bottom:var(--e-4)}
#app[data-view="today"] .wrap>.row .btn.gold{min-height:46px;font-size:15px}
.wrap>.row .btn.gold{width:100%;max-width:none}

/* --------------------------------------------------------------------------
   11. BOTTOM NAVIGATION

   Generic before: five equal icon-over-label cells with a decorative dot
   under the active one. The dot is gone (taste-skill 9.F: status dots only
   for real state). The active tab is now marked the same way the territory
   tab is marked upstairs - a 2px accent rule and full-strength ink - so the
   two selection mechanics in the app become one mechanic.
   -------------------------------------------------------------------------- */
nav.bot{
 background:var(--e-ink);border-radius:0;
 box-shadow:none;border-top:1px solid rgba(243,240,232,.13);
 contain:layout style paint}
nav.bot a{
 color:var(--e-onink-3);position:relative;padding-top:9px;
 transition-property:color;transition-duration:var(--e-ui);transition-timing-function:var(--e-ez)}
nav.bot a svg{width:23px;height:23px;stroke-width:1.7}
nav.bot a span,nav.bot a b{font-size:11px;font-weight:650;letter-spacing:.005em}
nav.bot a.on{color:var(--e-onink);font-weight:750}
nav.bot a.on::before{
 content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
 width:26px;height:2px;background:var(--e-accent);border-radius:0 0 2px 2px}
nav.bot a.on span,nav.bot a.on b{font-weight:750}
nav.bot a:active{color:var(--e-onink);opacity:.75}
/* the decorative active dot the old build drew under the label */
nav.bot a.on::after{display:none!important}
nav.bot a i{display:none}

/* --------------------------------------------------------------------------
   12. SHEETS AND OVERLAYS

   The profile sheet had no scrim, so the header behind it stayed fully legible
   and the sheet read as a panel that had slid over a live screen. A 52% ink
   scrim isolates it (ui-ux-pro-max scrim legibility: 40-60%).
   -------------------------------------------------------------------------- */
.scrim,.sheetbg,.overlay,.backdrop{background:rgba(16,15,12,.52)!important;
 -webkit-backdrop-filter:saturate(.85) blur(1.5px);backdrop-filter:saturate(.85) blur(1.5px)}
.sheet,.sh,.sheetwrap{border-radius:var(--e-r-sheet) var(--e-r-sheet) 0 0;
 background:var(--e-page);box-shadow:0 -16px 44px rgba(16,15,12,.22)}

/* the toast sat mid-screen and covered content on every screen in the app.
   It belongs above the navigation, out of the reading area, and it must not
   take pointer events. */
.toast,#toast{
 position:fixed!important;left:50%!important;transform:translateX(-50%)!important;
 bottom:calc(var(--e-navh,74px) + var(--safe-b) + 14px)!important;
 top:auto!important;
 max-width:calc(100% - 32px);width:max-content;
 background:var(--e-ink);color:var(--e-onink);
 border-radius:var(--e-r-ctl);padding:12px 16px;
 font-size:13.5px;font-weight:650;line-height:1.4;text-align:center;
 box-shadow:0 8px 28px rgba(16,15,12,.30);
 pointer-events:none;z-index:9000}

/* --------------------------------------------------------------------------
   13. STATES: empty, loading, error, offline

   ui-ux-pro-max forms-and-feedback: an empty state states the cause and the
   way out. A skeleton matches the shape of what is coming, not a spinner.
   -------------------------------------------------------------------------- */
.empty{padding:var(--e-6) 0;text-align:left;color:var(--e-ink-3);
 border-top:2px solid var(--e-ink);margin-top:var(--e-5)}
.empty b{display:block;font-size:17px;font-weight:750;color:var(--e-ink);
 letter-spacing:-.022em;margin-bottom:6px}
.empty .btn,.empty button{margin-top:var(--e-4)}

.skel{height:74px;border-radius:0;margin:0;
 border-bottom:1px solid var(--e-rule);
 background:linear-gradient(90deg,var(--e-wash) 25%,var(--e-wash-2) 37%,var(--e-wash) 63%);
 background-size:400% 100%;animation:e-shim 1.3s var(--e-ez) infinite}
@keyframes e-shim{0%{background-position:100% 0}100%{background-position:0 0}}

/* --------------------------------------------------------------------------
   14. MOTION AND FOCUS

   Motion is feedback only. Every animation here answers "what changed, and
   because of what I did". Nothing loops for decoration.
   -------------------------------------------------------------------------- */
.ent,.card.mini{
 transition-property:background-color;
 transition-duration:var(--e-tap);transition-timing-function:var(--e-ez)}
.ent:active,.card.mini:active{background:var(--e-wash-2)}

/* a real, visible focus appearance everywhere (WCAG 2.2 SC 2.4.11) */
a:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible{
 outline:2px solid var(--e-accent-ink);outline-offset:2px;border-radius:4px}
header.top a:focus-visible,header.top button:focus-visible,nav.bot a:focus-visible{
 outline-color:var(--e-onink-accent)}

@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{
  animation-duration:.001ms!important;animation-iteration-count:1!important;
  transition-duration:.001ms!important;scroll-behavior:auto!important}
 .ent-go:active,.btn:active,.chip:active,#backbtn:active{transform:none}
}

/* --------------------------------------------------------------------------
   15. SPEED -  carried forward from /studio/ unchanged and extended.

   content-visibility lets the browser skip layout, style and paint for rows
   fully off-screen; contain-intrinsic-size gives it the height up front so
   the scrollbar does not jump. Native CSS, no library, no markup change.
   The intrinsic size is raised to match this build's taller row.
   -------------------------------------------------------------------------- */
.card.mini,.ent{
 content-visibility:auto;
 contain-intrinsic-size:auto 92px;
 contain:layout style paint}
.panel,.fsec{contain:layout style}
nav.bot,.cbar,header.top{contain:layout style paint}

/* --------------------------------------------------------------------------
   16. DIRECTORY ROW INTERNALS

   mini() previously ended with a column of geometric characters used as
   icons: a filled square for restricted, a triangle for caution, a flag for
   follow-up, a lozenge for on-route, and a chevron. ui-ux-pro-max bans
   characters-as-icons outright (they are font-dependent, cannot be themed,
   and a screen reader announces them as punctuation). Restricted and caution
   already have a labelled block below the row, so those two glyphs were
   redundant; follow-up and on-route become real words; the chevron becomes a
   stroked SVG that matches the navigation icon set.
   -------------------------------------------------------------------------- */
/* SCOPE. .card.mini is reused by the AREA rows, which have completely
   different children (an h3 + three .meta lines, no .ebody). Making the bare
   class a flex row stacked those children side by side and the text
   overlapped. Only the directory shop row carries .e2, so the flex belongs
   there and nowhere else. Assertions passed clean on this; the screenshot
   did not. */
.card.mini.e2{display:flex;align-items:center}
.card.mini.e2 .ebody{flex:1 1 auto;min-width:0}
.card.mini.e2 .ex{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
 width:20px;height:20px;color:var(--e-rule-3)}
.card.mini.e2 .ex svg{width:18px;height:18px;display:block}
.card.mini .rail{display:none}

/* the AREA row keeps its own stacked layout, on the shared rail */
.card.mini:not(.e2){display:block;padding:14px 0 14px calc(var(--e-rail) + var(--e-railgap))!important}
.card.mini:not(.e2) h3{font-size:17px;font-weight:700;letter-spacing:-.022em;
 line-height:1.22;color:var(--e-ink);margin:0}
.card.mini:not(.e2) .row{display:flex;align-items:baseline;gap:var(--e-3)}
.card.mini:not(.e2) .row .meta{flex:0 0 auto;white-space:nowrap;font-weight:700;color:var(--e-ink-3)}
.card.mini:not(.e2) .meta{display:block;line-height:1.45}

.e-flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.e-flag{display:inline-flex;align-items:center;
 font-size:11.5px;font-weight:750;letter-spacing:.02em;
 padding:3px 8px;border-radius:6px;white-space:nowrap}
.e-flag-fu{background:var(--e-accent-wash);color:var(--e-accent-ink)}
.e-flag-rt{background:var(--e-green-wash);color:var(--e-green-ink)}

/* --------------------------------------------------------------------------
   17. LEGACY STATUS COLOUR TOKENS

   Several renderers set colour with an inline style="color:var(--mu)" and
   friends. Rather than rewrite every one of those call sites, the legacy
   tokens are re-pointed at the audited palette, so an inline colour written
   anywhere in the app now resolves to a value that meets contrast. --mu
   measured 3.50:1 on this ground and carried real information at 12.5px.
   -------------------------------------------------------------------------- */
:root{
 /* --mu2 was a fourth grey tier at 12.5px and measured 3.97:1 while carrying
    real counts. Between 4.5:1 and --mu there is no legible room for a fourth
    tier on this ground, so it collapses into --mu and the distinction is
    carried by weight instead of by lightness. */
 --mu:#6E6859; --mu2:#6E6859; --tx:#100F0C;
 --ac:#93340E; --acD:#D8511B; --acT:#1C0A02; --accT:#93340E; --acc:#D8511B;
 --pos:#17402F; --ok:#17402F; --neg:#8E2A22; --bad:#8E2A22; --rose:#8E2A22;
 --amb:#7A4E00; --warn:#7A4E00; --slate:#3C556E; --sky:#3C556E;
 /* --teal drives the first segment of the area proportion bar. Upstream it
    aliased --slate, so segments 1 and 3 were the same blue; pointing it at
    the green made 1 and 2 the same instead. Each segment now carries the
    colour of the word it counts on the line directly above, so that line IS
    the legend and no new UI is needed to explain the bar. */
 --teal:#383530;
 --line:rgba(16,15,12,.09); --line2:rgba(16,15,12,.155);
 --bd:rgba(16,15,12,.09); --bd2:rgba(16,15,12,.155);
 --bg:#F3F0E8; --paper:#FCFAF5; --carbon:#100F0C; --carbon2:#242119;
 --sf:#EDE9E0; --sf2:#E6E1D6; --sf3:#DBD5C8;
 --acsel:rgba(216,81,27,.14); --acW:rgba(216,81,27,.09);
 --okW:rgba(31,81,64,.09); --skyW:rgba(60,85,110,.10); --roseW:rgba(142,42,34,.08);
 --shadow:0 12px 34px rgba(16,15,12,.16),0 2px 8px rgba(16,15,12,.08)}

/* --------------------------------------------------------------------------
   18. THE LAST CONTRAST FAILURES

   Three classes survived the token remap because they set colour outside the
   token system. Measured on the built page at 320/375/390/430:

     .meta third line   3.97:1 at 12.5px  ->  --mu2 collapsed into --mu (4.87)
     .tag.p-audit       3.97:1 at 11.5px  ->  same fix, plus a real ground
     .mapprev .pin      unmeasurable      ->  a ring, not a raw glyph

   The third line of an area row is now separated from the second by weight,
   which is the honest way to make a fourth tier when lightness has run out.
   -------------------------------------------------------------------------- */
.meta{color:var(--e-ink-4)}
.meta + .meta,.meta ~ .meta{font-weight:500}
.tag{background:var(--e-wash-2);border:1px solid var(--e-rule-2);color:var(--e-ink-3);
 font-size:11.5px;font-weight:750;letter-spacing:.05em;border-radius:6px;padding:4px 8px}
.tag.p-audit{color:var(--e-ink-3);background:var(--e-wash-2)}
.tag.p-ready{color:var(--e-green-ink);background:var(--e-green-wash);border-color:transparent}
.tag.p-cust{color:var(--e-ink-2);background:var(--e-wash-2);border-color:transparent}

/* A map marker sits on arbitrary satellite and street imagery, so no single
   colour can meet a ratio against it. The cartographic answer is a ring: the
   marker carries its own contrast with it wherever it lands. */
.mapprev .pin{
 color:var(--e-clay);font-size:20px;line-height:1;
 text-shadow:0 0 0 #fff,1.5px 0 0 #fff,-1.5px 0 0 #fff,0 1.5px 0 #fff,0 -1.5px 0 #fff,
             1px 1px 0 #fff,-1px 1px 0 #fff,1px -1px 0 #fff,-1px -1px 0 #fff,
             0 2px 5px rgba(16,15,12,.45)}
.mapprev{border-radius:var(--e-r-ctl);overflow:hidden;border:1px solid var(--e-rule-2)}
.mapprev img{outline:1px solid rgba(16,15,12,.10);outline-offset:-1px}

/* --------------------------------------------------------------------------
   19. AREA PROPORTION BAR + SEARCH FIELD

   The bar reads as a picture of the sentence above it:
     229 customers (ink)  ·  31 ready (green)  ·  23 call first (blue)
   and the remainder of the track is everything not yet in one of those three
   states. Colour is never the only carrier here: every segment's number is
   printed in words directly above it.
   -------------------------------------------------------------------------- */
.oppbar{height:4px;border-radius:2px;background:var(--e-rule-2);
 overflow:hidden;margin-top:10px;display:flex;gap:1px}
.oppbar i{display:block;height:100%}

/* The search field was a bright white 50px slab with a 12px radius sitting on
   cream, reading as a floating pill rather than as part of the page. It joins
   the one radius system and the one surface system.

   SCOPE: .wrap only. The Home search lives inside the dark spine and has its
   own dark treatment in section 2; the unscoped version of this rule painted
   the sticky cream gradient inside the black header at 320px, which the
   screenshot caught and the assertions did not. */
.wrap .homesearch input,.wrap .search{
 height:48px;border-radius:var(--e-r-ctl);
 background-color:var(--e-raise);border:1px solid var(--e-rule-2);
 color:var(--e-ink);font-size:16px}
.wrap .homesearch input::placeholder,.wrap .search::placeholder{color:var(--e-ink-4)}
.wrap .homesearch input:focus,.wrap .search:focus{
 border-color:var(--e-accent-ink);outline:2px solid var(--e-accent-wash);outline-offset:0}
.wrap .homesearch{background:linear-gradient(180deg,var(--e-page) 86%,transparent);padding:10px 0}
header.top .homesearch input{background-color:rgba(243,240,232,.06)}

/* --------------------------------------------------------------------------
   20. THE CUSTOMER PROFILE SHEET

   Four measured defects on this screen:

   1. Two stars. The left one is .cic.av-other, a 42px decorative avatar drawn
      as a star outline for the "other" record type; the right one is the real
      Save-customer control. Side by side they read as one control duplicated.
      The avatar carries no information the tag and the state rail do not
      already carry, so it goes and the name gets its width back.
   2. "<b>0</b>visits" has no whitespace between the two nodes, the same
      merged-node defect as the old "22,278exact". It was hidden because the
      <b> was display:block, which stacked a number over a word inside a
      bordered box. It is one line with a real gap now.
   3. The visit count and the classification tag sat on two separate rows,
      each in its own container. They are one line of metadata.
   4. The Overview/Activity/Orders/Evidence control is a filled trough with a
      filled active chip: the stock segmented pill /studio/ removed from the
      territory switcher but left here, so the app had two different selection
      mechanics. It now uses the same one as the territory row.
   -------------------------------------------------------------------------- */
.sheet .row>.cic,.sheet .cic.av-other,.sheet .cic{display:none!important}

.sheet .pchips,.sheet .tags{display:inline-flex;flex-wrap:wrap;gap:var(--e-2);
 margin:10px 0 0;vertical-align:middle}
.sheet .tags{margin-left:var(--e-2)}
.sheet .pchip{display:inline-flex;align-items:baseline;gap:5px;
 background:var(--e-wash-2);border:0;border-radius:6px;padding:4px 9px;
 font-size:12.5px;font-weight:650;color:var(--e-ink-3);white-space:nowrap}
.sheet .pchip b{display:inline!important;font-size:13.5px;font-weight:800;
 color:var(--e-ink);font-variant-numeric:tabular-nums}
/* the missing space between the two adjacent inline nodes, supplied by layout
   rather than by hoping the template has one */
.sheet .pchip b::after{content:'\00a0'}

.sheet h3{font-size:20px;font-weight:750;letter-spacing:-.028em;line-height:1.18;color:var(--e-ink)}
.sheet .qclear{width:44px;height:44px;border-radius:var(--e-r-ctl);
 background:var(--e-wash-2);border:1px solid var(--e-rule-2);color:var(--e-ink-3);
 display:flex;align-items:center;justify-content:center;font-size:19px}
.sheet .qclear:active{background:var(--e-wash-2);transform:scale(.94)}

/* one selection mechanic in the whole app */
.sheet .seg,.sheet .segw{
 background:transparent!important;border-radius:0!important;padding:0!important;
 display:flex;gap:0;margin:14px 0 4px;
 border-bottom:1px solid var(--e-rule-2);overflow-x:auto;scrollbar-width:none}
.sheet .seg::-webkit-scrollbar{display:none}
.sheet .seg button{
 background:transparent!important;border:0!important;border-radius:0!important;
 color:var(--e-ink-4);font-size:13.5px;font-weight:650;letter-spacing:-.01em;
 min-height:46px;padding:0 0 2px;margin-right:22px;flex:0 0 auto;width:auto!important;
 box-shadow:inset 0 -2px 0 transparent;
 transition-duration:var(--e-ui);transition-timing-function:var(--e-ez)}
.sheet .seg button.on{color:var(--e-ink);font-weight:750;
 box-shadow:inset 0 -2px 0 var(--e-accent)}
.sheet .seg button:focus-visible{outline:2px solid var(--e-accent-ink);outline-offset:-2px}

/* The information groups are .kv, not .card: white rounded cards floating on
   the sheet's own cream ground, i.e. a card inside a card. They read as
   ledger blocks now, the same as every other grouped set of facts in the app.
   Measured on the built page, not assumed from the class name. */
/* .src is the white rounded container; .kv is one label/value ROW inside it.
   Styling .kv as the block produced grey bands inside a white card, which was
   worse than the card. Corrected against the measured DOM:
     div.src  >  div.kv  >  span (label) + b (value)   */
.sheet .src,.sheet .card,.sheet>.panel{
 background:var(--e-wash);border:0;border-top:1px solid var(--e-rule-2);
 border-radius:0;box-shadow:none;padding:0 var(--e-3);margin:var(--e-4) 0 0}
.sheet .kv{
 display:flex;align-items:baseline;justify-content:space-between;gap:var(--e-4);
 background:transparent;padding:12px 0;border-bottom:1px solid var(--e-rule);
 font-size:14px;line-height:1.4}
.sheet .kv:last-child{border-bottom:0}
.sheet .kv>span{flex:1 1 auto;min-width:0;color:var(--e-ink-4);font-weight:600;
 overflow-wrap:break-word}
.sheet .card .rowl:last-child{border-bottom:0}

/* A record FIELD and an operational RULE are two different kinds of thing and
   must not be set in the same register. The Location field states what the
   record holds, quietly, in the tabular column. The block below is the one
   that instructs, and it carries the amber ground so it reads as a rule
   rather than as the same sentence printed twice. */
.sheet .kv>b{flex:0 1 auto;min-width:0;font-size:13.5px;font-weight:700;
 color:var(--e-ink-2);letter-spacing:0;text-align:right;overflow-wrap:break-word}
.sheet .warn{
 background:var(--e-amber-wash);color:var(--e-amber);
 border:0;border-left:var(--e-rail) solid currentColor;
 border-radius:0 var(--e-r-ctl) var(--e-r-ctl) 0;
 padding:11px 13px;margin:var(--e-4) 0 0;
 font-size:13px;line-height:1.45;font-weight:650}
.sheet .warn.crit,.sheet .warn.x{background:var(--e-clay-wash);color:var(--e-clay)}

/* A field value is a value, not a shout. The uppercase location string was
   printed at full weight in the table AND again inside the warning block
   below it, so the same sentence appeared twice in the same register. The
   table now states it quietly; the block below is the one that instructs. */
.sheet .rowl>b,.sheet .rowl .rv{font-size:14.5px;font-weight:700;
 text-transform:none;color:var(--e-ink-2);text-align:right}
.sheet .rowl .lbl{font-weight:600;color:var(--e-ink-4);font-size:14px}

/* the action bar sits on the safe area, not against the glass */
.sheet .sheetact,.sheet .actbar,.sheet .row.acts{
 padding-bottom:calc(var(--safe-b) + var(--e-2))}

/* --------------------------------------------------------------------------
   21. SHEET LAYERING + IN-SHEET CHIP STRIPS

   Measured: #backbtn is position:fixed at z=70; every sheet overlay
   (#sheetbg, #visitbg) paints at z=60. So the back button floated above the
   Log Visit sheet and sat on the shop's name. While any sheet is open the
   sheet owns the screen: the button fades out and stops taking taps, and
   returns the moment the sheet closes. Same treatment for the condensing
   bar, which shares the fixed layer.

   The outcome chips inside the visit sheet are a .preset scroller too; the
   scroll affordance (edge fade, snap) previously applied only to strips in
   .wrap, so a chip was cut dead at the sheet edge with no sign it scrolled.
   -------------------------------------------------------------------------- */
body:has(.sheetbg) #backbtn,body:has(#visitbg) #backbtn{
 opacity:0;pointer-events:none;transition:opacity var(--e-out) var(--e-ez-out)}
body:has(.sheetbg) .cbar{opacity:0;pointer-events:none}

.sheet .preset,.sheetbg .preset,.sheet .chips,.sheetbg .chips,
.sheet .frow,.sheetbg .frow{
 display:flex;gap:var(--e-2);overflow-x:auto;overflow-y:hidden;
 scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;
 -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);
 mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent)}
.sheet .preset::-webkit-scrollbar,.sheetbg .preset::-webkit-scrollbar{display:none}
.sheet .preset>*,.sheetbg .preset>*{scroll-snap-align:start;flex:0 0 auto}

/* the visit sheet's step tabs use the same selection mechanic as everything */
#visitbg .vtabs b,#visitbg [class*=step]{letter-spacing:.02em}

/* --------------------------------------------------------------------------
   22. THE MORE SCREEN

   Its rows are bare .card elements that arrive with zero padding and an
   inherited 18px radius, so each pill's rounded corner sliced the first
   letter of the line below the title. They join the ledger system: quiet
   rows on the shared rail, separated by hairlines, chevron affordance
   carried by the row itself. No pills, no slicing, one list language
   everywhere in the app.
   -------------------------------------------------------------------------- */
#app[data-view="more"] .wrap .card:not(.mini),
#app[data-view="fieldwork"] .wrap .card:not(.mini),
#app[data-view="audit"] .wrap .card:not(.mini){
 display:block;background:transparent;border:0;border-radius:0;box-shadow:none;
 border-bottom:1px solid var(--e-rule);
 padding:14px 2px;margin:0;
 content-visibility:visible;contain:none}
#app[data-view="more"] .wrap .card:not(.mini) h3,
#app[data-view="fieldwork"] .wrap .card:not(.mini) h3,
#app[data-view="audit"] .wrap .card:not(.mini) h3{
 font-size:17px;font-weight:700;letter-spacing:-.022em;line-height:1.25;
 color:var(--e-ink);margin:0}
#app[data-view="more"] .wrap .card:not(.mini) .meta,
#app[data-view="fieldwork"] .wrap .card:not(.mini) .meta,
#app[data-view="audit"] .wrap .card:not(.mini) .meta{
 font-size:12.5px;line-height:1.4;color:var(--e-ink-4);margin-top:2px}
#app[data-view="more"] .wrap .card:not(.mini):active{background:var(--e-wash-2)}

/* --------------------------------------------------------------------------
   21. FIVE-MINUTE POLISH (measured on 320px renders, 1 Sep 2026)

   a) At 320 a two-word section title wrapped mid-phrase against its inline
      count ("One company / only"). Under 360px the header now wraps as a
      unit: title and See-all hold the first line, the count takes its own
      full-width line beneath. No mid-title break, no collision.
   b) The route strip, its action and the first section were three loose
      pieces with a dead band between them. One rhythm now: strip, action,
      section, each a step apart.
   -------------------------------------------------------------------------- */
@media(max-width:359px){
 .fsec-h{flex-wrap:wrap;row-gap:2px}
 .fsec-h b{flex:1 1 auto;white-space:normal}
 .fsec-h .more{margin-left:auto}
 .fsec-h span{flex:1 1 100%;order:3;padding:0 0 2px}
}
#app[data-view="today"] .ribbon{margin-top:var(--e-3);padding-bottom:var(--e-2)}
#app[data-view="today"] .wrap>.row{padding-bottom:var(--e-4)}
#app[data-view="today"] .fsec{margin-top:var(--e-5)}
/* ==========================================================================
   REMARKABLE - experience layer styling.
   Inherits the elite "Field Ledger" system whole; adds only what the
   recomposition needs. Same caller pattern: appended last, wins on order.
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. THE COMMAND OBJECT
   One per Home, answering: where to go, why it matters, what to do next.
   It is a ledger block with the accent rule of a section and the type
   scale of a headline, so nothing else on the screen competes with it.
   -------------------------------------------------------------------------- */
.r-cmd{
 display:block;position:relative;
 background:var(--e-wash);border:0;border-top:3px solid var(--e-accent);
 border-radius:0 0 var(--e-r-group) var(--e-r-group);
 padding:var(--e-4);
 margin:var(--e-4) 0 0;cursor:pointer;
 transition-property:background-color,transform;
 transition-duration:var(--e-tap);transition-timing-function:var(--e-ez)}
.r-cmd:active{background:var(--e-wash-2)}
.r-cmd:focus-visible{outline:2px solid var(--e-accent-ink);outline-offset:2px}
.r-cmd-k{
 font-size:11.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
 color:var(--e-accent-ink);line-height:1.5}
.r-cmd-n{
 margin:4px 0 0;font-size:23px;line-height:1.12;letter-spacing:-.03em;
 font-weight:750;color:var(--e-ink);text-wrap:balance}
@media(max-width:359px){.r-cmd-n{font-size:20px}}
.r-cmd-m{
 margin-top:5px;font-size:13.5px;line-height:1.45;font-weight:600;
 color:var(--e-ink-3);text-wrap:pretty}
.r-cmd-m.r-cmd-w{font-weight:550;color:var(--e-ink-4);font-size:12.5px;margin-top:3px}
.r-cmd-acts{display:flex;gap:var(--e-2);margin-top:var(--e-4);flex-wrap:wrap}
.r-cmd-acts .btn{flex:1 1 auto;min-height:48px}
.r-cmd-go{
 display:inline-flex;align-items:center;min-height:44px;padding:0 18px;
 background:var(--e-accent);color:#1C0A02;border-radius:var(--e-r-ctl);
 font-size:14.5px;font-weight:750;letter-spacing:-.01em}
.r-cmd .ent-safe{margin-top:10px}
/* the best-opportunity variant is quieter: an invitation, not an alarm */
.r-cmd-opp{border-top-color:var(--e-ink)}
.r-cmd-opp .r-cmd-k{color:var(--e-ink-4)}

/* start button block above the opportunity object */
.r-start{margin:var(--e-4) 0 0!important;padding:0!important;border:0!important}
.r-start .btn.gold{width:100%}

/* --------------------------------------------------------------------------
   2. QUIET COUNTS
   The ribbon is reference, not headline: numbers stay tabular and firm,
   labels sit quiet, the whole strip closes with a hairline.
   -------------------------------------------------------------------------- */
/* an even two-column grid: counts align instead of rag-wrapping */
.ribbon.r-quiet{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 margin:var(--e-4) 0 0;padding:0 0 var(--e-2);gap:0 var(--e-4);
 border-bottom:1px solid var(--e-rule)}
.ribbon.r-quiet .tap{display:inline-flex;align-items:center;gap:2px;min-height:44px;font-size:12.5px;color:var(--e-ink-4);font-weight:600}
.ribbon.r-quiet b{font-size:17px;font-weight:750;letter-spacing:-.02em;color:var(--e-ink)}
.ribbon.r-quiet .tap.hot,.ribbon.r-quiet .tap.hot b{color:var(--e-accent-ink)}

/* --------------------------------------------------------------------------
   3. SEARCH HIGHLIGHT
   The match is marked with the accent wash, never with a colour change of
   the text itself, so the name stays one readable word.
   -------------------------------------------------------------------------- */
mark.r-hl{
 background:var(--e-accent-wash);color:inherit;
 border-radius:3px;padding:0 1px;margin:0 -1px}

/* --------------------------------------------------------------------------
   4. PROFILE OPPORTUNITY LINE
   The second line of the business story: why this shop is worth a visit,
   stated once, in the accent register the rows already use.
   -------------------------------------------------------------------------- */
.sheet .r-opp{
 margin:10px 0 0;font-size:13.5px;line-height:1.45;font-weight:700;
 color:var(--e-accent-ink)}

/* --------------------------------------------------------------------------
   5. ROUTE - the current stop is unmistakable
   CSS-only strengthening of the existing active-route hero: the name takes
   headline scale, the why-line reads as a sentence, the stop dots become
   a quiet progress track, and actions stay in the thumb arc.
   -------------------------------------------------------------------------- */
#app[data-view="route"] .hero{
 background:var(--e-wash);border:0;border-top:3px solid var(--e-accent);
 border-radius:0 0 var(--e-r-group) var(--e-r-group);
 box-shadow:none;padding:var(--e-4)}
#app[data-view="route"] .hero h3{
 font-size:23px;line-height:1.12;letter-spacing:-.03em;font-weight:750;
 color:var(--e-ink);margin:0 0 4px;text-wrap:balance}
#app[data-view="route"] .hero .src{
 background:transparent;border:0;border-top:1px solid var(--e-rule);
 border-radius:0;margin:10px 0 0;padding:10px 0 0;
 font-size:13.5px;line-height:1.5;color:var(--e-ink-2)}
#app[data-view="route"] .hero .src b{color:var(--e-ink);font-weight:750}
#app[data-view="route"] .rdot{
 width:26px;height:26px;border-radius:50%;
 background:var(--e-wash-2);color:var(--e-ink-4);border:1px solid var(--e-rule-2)}
#app[data-view="route"] .rdot.cur{
 background:var(--e-ink);color:var(--e-page);border-color:var(--e-ink);font-weight:800}
#app[data-view="route"] .rdot.done{
 background:var(--e-green-wash);color:var(--e-green-ink);border-color:transparent}
#app[data-view="route"] .rdot.skip{
 background:var(--e-wash);color:var(--e-ink-4);text-decoration:line-through}
#app[data-view="route"] .prog{background:rgba(243,240,232,.18)}
#app[data-view="route"] .prog i{background:var(--e-accent)}

/* --------------------------------------------------------------------------
   6. RESUME DOCK
   The quiet resume affordance the silence rule asks for: it was already
   built; it now speaks the ledger language and clears the navigation.
   -------------------------------------------------------------------------- */
#dock{
 position:fixed;left:var(--gutter);right:var(--gutter);
 bottom:calc(var(--e-navh,74px) + var(--safe-b) + 10px);
 display:none;align-items:center;gap:10px;z-index:60;
 background:var(--e-ink);color:var(--e-onink);
 border:0;border-left:3px solid var(--e-accent);
 border-radius:var(--e-r-ctl);
 padding:10px 14px;min-height:52px;
 box-shadow:0 10px 30px rgba(16,15,12,.28);cursor:pointer}
#dock .dico{font-size:15px;color:var(--e-onink-accent);flex:0 0 auto}
#dock .dtxt{flex:1 1 auto;min-width:0;display:block}
#dock .dtxt b{display:block;font-size:13.5px;font-weight:750;letter-spacing:-.01em;color:var(--e-onink)}
#dock .dtxt i{display:block;font-style:normal;font-size:12px;font-weight:600;
 color:var(--e-onink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dock .dgo{flex:0 0 auto;color:var(--e-onink-accent);font-size:17px}
#dock.mini{transform:translateY(6px);opacity:.92}

/* --------------------------------------------------------------------------
   7. FEED RHYTHM - three rows per section reads as a briefing, not a table
   -------------------------------------------------------------------------- */
#app[data-view="today"] .fsec{margin-top:var(--e-5)}
#app[data-view="today"] .fsec-h{border-bottom-width:2px}

@media(prefers-reduced-motion:reduce){
 .r-cmd,.r-cmd:active{transform:none}
}

/* --------------------------------------------------------------------------
   8. ROUTE HERO ACTIONS ON THE LIGHT GROUND
   The .ab action row was styled for the old dark hero; on the wash it
   rendered pale-on-pale and Directions was unreadable. Ink on light now,
   one filled primary, everything 44px+.
   -------------------------------------------------------------------------- */
#app[data-view="route"] .hero .acts .ab{
 background:transparent;border:1px solid var(--e-rule-2);color:var(--e-ink-2);
 border-radius:var(--e-r-ctl);min-height:48px;min-width:48px;
 font-size:14px;font-weight:700;letter-spacing:-.01em;box-shadow:none}
#app[data-view="route"] .hero .acts .ab:active{background:var(--e-wash-2)}
#app[data-view="route"] .hero .acts .ab.pri{
 background:var(--e-accent);border:0;color:#1C0A02}
#app[data-view="route"] .hero .acts .ab.pri:active{background:#C44715}
#app[data-view="route"] .hero .acts .ab svg{stroke:currentColor}
#app[data-view="route"] .hero .tags .tag{margin-top:2px}
#app[data-view="route"] .hero .meta{color:var(--e-ink-4);font-size:12.5px;line-height:1.45}
/* LAB: one observed defect from the pixelshot 320px capture (1 Sep 2026).
   The relationship line "Buys from YOL. Introduce MYCO." wrapped with "MYCO."
   orphaned on its own line in every row, because the line shared its grid
   row with the trailing Log-visit column. Under 360px the relationship line
   now spans the full row width beneath the action, so it never orphans. */
@media(max-width:359px){
 .ent{grid-template-areas:"name act" "meta act" "rel rel" "why why" "safe safe"}
 .ent-rel{grid-area:rel;margin-top:4px}
 .ent-why{grid-area:why}
 .e-rel-do{margin-left:6px;white-space:normal}
}

/* accessible name: the two relationship spans are adjacent nodes; a screen reader read

/* ---- gestures: deliberate only, never during scroll, never double-fires ---- */
(function(){
 let el=null,sx=0,sy=0,dx=0,locked=false,fired=false,lastScroll=0,hint=null;
 addEventListener('scroll',()=>{lastScroll=performance.now()},{passive:true});
 const clean=()=>{if(el){el.style.transform='';el.classList.remove('swipeable')}
  if(hint){hint.remove();hint=null} el=null;dx=0;locked=false};
 document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  if(performance.now()-lastScroll<350)return;          // never right after a scroll
  const c=e.target.closest&&e.target.closest('.card.mini'); if(!c)return;
  if(e.target.closest('a,button'))return;              // let real controls win
  el=c;sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;locked=false;fired=false;
 },{passive:true});
 document.addEventListener('touchmove',e=>{
  if(!el)return; const t=e.touches[0];
  const ax=t.clientX-sx, ay=Math.abs(t.clientY-sy);
  if(!locked){
   if(ay>10){clean();return}                            // vertical intent wins
   if(Math.abs(ax)<18)return;
   if(Math.abs(ax)<ay*2.5)return;                       // must be clearly horizontal
   locked=true; el.classList.add('swipeable');
   hint=document.createElement('span');
   el.appendChild(hint);
  }
  dx=Math.max(-96,Math.min(96,ax));
  el.style.transform='translateX('+dx+'px)';
  if(hint){hint.className='ghint '+(dx>0?'l':'r');
   hint.textContent=dx>0?'LOG VISIT':'FOLLOW-UP';
   hint.style.opacity=Math.min(1,Math.abs(dx)/70)}
 },{passive:true});
 document.addEventListener('touchend',()=>{
  if(!el)return;
  const c=el, d=dx, m=(c.getAttribute('onclick')||'').match(/openSheet\('([^']+)'/);
  clean();
  if(!m||fired||Math.abs(d)<74)return;                  // deliberate distance only
  fired=true; window._swp=performance.now();            // suppress the trailing click
  try{navigator.vibrate&&navigator.vibrate(9)}catch(_){}
  if(d>0)openVisit(m[1],'swipe'); else fuQuick(m[1]);
 },{passive:true});
 document.addEventListener('touchcancel',clean,{passive:true});
})();

/* ================= DATA-AUDIT CANDIDATE OVERRIDES =================
   MAIN TOTAL = every stored record in the selected territory.
   Every tile registers the same predicate its list uses, so a tile and its
   list can never disagree. Nothing here changes a record: definitions only. */

const AU_CUST = s => !!(s.yol||s.myco);
const AU_ACT  = s => actionable(s);
/* the five buckets below partition every stored record exactly once */
const AU_P = {
  cust : s => AU_CUST(s),
  audit: s => !AU_CUST(s) && !AU_ACT(s),
  prosp: s => !AU_CUST(s) &&  AU_ACT(s) && (s.t==='A'||s.t==='B'||s.t==='C'),
  res  : s => !AU_CUST(s) &&  AU_ACT(s) && s.t==='D',
  rev  : s => !AU_CUST(s) &&  AU_ACT(s) && s.t!=='A'&&s.t!=='B'&&s.t!=='C'&&s.t!=='D'
};
/* order-age guard: a shop with a recorded order age is counted by that age,
   never again under "never ordered". Neither field was altered. */
const AU_NEVER = s => AU_CUST(s) && s.mso==null && /^ACCOUNT EXISTS/.test(s.ps||'');

const auN = x => (x||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
/* a business key is name + area, matched only inside one territory —
   name alone is never enough, and distance is never evidence */
function auKey(s){return (s._terr||TERR)+'|'+auN(s.n)+'|'+auN(s.town)}
function auDedupe(rows){const seen=new Set();return rows.filter(s=>{const k=auKey(s);if(seen.has(k))return false;seen.add(k);return true})}
function auBiz(fn){return auDedupe(D.filter(fn)).length}

/* list header states the exact count, the noun, and the definition.

function vList(k){const P=LISTS[k];if(!P)return vToday();

 return `<header class="top"><div class="ovl">${esc(TITLE)}</div><h1>${P.t}</h1>
 <p class="sub">${base.length.toLocaleString()} ${esc(noun)} · ${esc(TITLE)}</p>
 ${P.def?`<p class="sub" style="opacity:.72">Counted as: ${esc(P.def)}</p>`:''}</header><div class="wrap">
 ${listBody(base)}
 </div>`}

function auReg(key,title,noun,def,fn,dedupe){LISTS['au'+key]={t:title,f:fn,noun:noun,def:def,dedupe:!!dedupe};return 'list:au'+key}

/* ================= TACTILE =================
   Hand-written, no libraries. Everything animated here is transform or
   opacity only, and every animation is switched off under
   prefers-reduced-motion. */
(function(){
 const RM=matchMedia('(prefers-reduced-motion: reduce)');

 /* ---- drag-to-dismiss bottom sheets ----
    The finger drives the sheet 1:1, the backdrop's dim and blur ramp with
    how far it has travelled, and letting go either springs it back or
    carries it out. Dismissal reuses whatever close path the sheet already
    had - the wizard's Close button (so a draft still saves), otherwise the
    backdrop tap - rather than ripping the node out and skipping that. */
 let sheet=null,bg=null,startY=0,dy=0,h=1,dragging=false;
 const SPRING='transform 280ms cubic-bezier(.22,1,.36,1)';

 function dismiss(b){
  if(!b)return;
  const close=[...b.querySelectorAll('button')].find(x=>/^close$/i.test((x.textContent||'').trim()));
  if(close){close.click();return}
  b.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
  setTimeout(()=>{if(document.body.contains(b))b.remove()},150);
 }
 function paint(p){                       // p: 1 at rest, 0 fully dragged away
  if(!bg)return;
  bg.style.background='rgba(22,21,18,'+(0.44*p).toFixed(3)+')';
  const px=(8*p).toFixed(1)+'px';
  bg.style.backdropFilter='blur('+px+')';
  bg.style.webkitBackdropFilter='blur('+px+')';
 }
 function reset(){
  if(bg){bg.style.background='';bg.style.backdropFilter='';bg.style.webkitBackdropFilter='';bg.style.transition=''}
  if(sheet){sheet.style.transform='';sheet.style.transition=''}
  sheet=null;bg=null;
 }
 function down(e){
  const s=e.target.closest('.sheet');if(!s)return;
  if(e.target.closest('button,a,input,textarea,select,[contenteditable]'))return;
  const onGrab=!!e.target.closest('.grab');
  if(!onGrab&&s.scrollTop>0)return;       // let the content scroll first
  const b=s.closest('.sheetbg');if(!b)return;
  sheet=s;bg=b;h=s.getBoundingClientRect().height||1;
  startY=(e.touches?e.touches[0]:e).clientY;dy=0;dragging=true;
  sheet.style.transition='none';bg.style.transition='none';
 }
 function move(e){
  if(!dragging)return;
  dy=(e.touches?e.touches[0]:e).clientY-startY;
  if(dy<0)dy=dy/4;                        // resist upward travel
  if(dy>2&&e.cancelable)e.preventDefault();
  sheet.style.transform='translate3d(0,'+Math.max(0,dy)+'px,0)';
  paint(1-Math.min(1,Math.max(0,dy)/h));
 }
 function up(){
  if(!dragging)return;dragging=false;
  const leave=dy>Math.min(h*0.25,180);
  if(!RM.matches){
   sheet.style.transition=SPRING;
   bg.style.transition='background 240ms linear, backdrop-filter 240ms linear';
  }
  if(leave){
   sheet.style.transform='translate3d(0,'+h+'px,0)';paint(0);
   const b=bg;setTimeout(()=>{dismiss(b)},RM.matches?0:230);
   sheet=null;bg=null;
  }else{
   sheet.style.transform='';paint(1);
   const s=sheet,b=bg;setTimeout(()=>{sheet=s;bg=b;reset()},RM.matches?0:300);
  }
 }
 addEventListener('touchstart',down,{passive:true});
 addEventListener('touchmove',move,{passive:false});
 addEventListener('touchend',up,{passive:true});
 addEventListener('touchcancel',up,{passive:true});
 addEventListener('mousedown',down);addEventListener('mousemove',move);addEventListener('mouseup',up);

 /* ---- condensing header ----
    The page header keeps scrolling away exactly as it did; a fixed compact
    bar carrying the same title slides in behind it. Fixed, so it cannot
    shift the content below it, and it only ever animates transform and
    opacity. aria-hidden because it duplicates the h1 already in the page. */
 const cbar=document.createElement('div');
 cbar.className='cbar';cbar.setAttribute('aria-hidden','true');
 cbar.innerHTML='<span></span>';
 document.body.appendChild(cbar);
 const label=cbar.firstChild;
 let ticking=false;
 function sync(){
  const h1=document.querySelector('header.top h1');
  const t=h1?h1.textContent.trim():'';
  if(t&&label.textContent!==t)label.textContent=t;
  document.documentElement.classList.toggle('cond',(window.scrollY||document.documentElement.scrollTop||0)>52);
  ticking=false;
 }
 addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(sync)}},{passive:true});
 new MutationObserver(()=>{if(!ticking){ticking=true;requestAnimationFrame(sync)}})
  .observe(document.getElementById('app'),{childList:true,subtree:false});
 sync();

 /* ---- haptics ----
    Android only. iOS Safari exposes no vibration API whatsoever - there is
    no polyfill and no way to fake it - so iPhones get the visual press
    state and nothing more. Stated rather than papered over. */
 if(/Android/i.test(navigator.userAgent)&&typeof navigator.vibrate==='function'){
  addEventListener('click',e=>{
   if(e.target.closest('.tap,.fc-go,.fc-open,.btn,nav.bot a,nav.bot button'))
    {try{navigator.vibrate(8)}catch(_){}}
  },{passive:true});
 }
})();

   Appended LAST in the JS chain, so these declarations win (handoff trap 2).
   mgBlocked() is deliberately NOT touched: routable() reads the same binding
   at call time, so redeclaring it would silently rewrite the safety

/* ---- 1. Typographic normaliser ------------------------------------------
   Em and en dashes are banned outright (taste-skill 9.G) and the owner
   separately flagged raw separators as reading broken. They arrive from two
   places: static strings compiled into the app, and the record data itself
   ("Buying YOL -  introduce MYCO" is a stored field). A per-string fix would
   miss the data, so a DOM pass in the render wrapper catches the remainder.
   The cost is measured in the build report, not assumed. */
function eText(t){
 return String(t==null?'':t)
  /* the clause dash becomes a real sentence, which means the word after it
     needs a capital - "Welcome back. restored exactly..." is worse than the
     dash was. A trailing dash with nothing after it is simply dropped. */
  .replace(/\s*[—–]\s*(\S)/g,(m,c)=>'. '+c.toUpperCase())
  .replace(/\s*[—–]\s*/g,' ')
  .replace(/\.\s*\./g,'.')
  .replace(/\s{2,}/g,' ')
  .trim()}

/* ---- 2. State: one word and one rail colour -----------------------------
   Colour is never the only carrier - every rail has its word beside it in
   the row (WCAG 1.4.1). This maps a record to the rail class only; the words
   are produced by eRel() and by the existing status strings. */
function eRail(s){
 const m=(typeof mgOf==='function')?mgOf(s):null;
 if(m&&m.d==='X')return 'e-stop';
 if(m)return 'e-warn';
 if(s.yol||s.myco)return 'e-cust';
 if(/^VERIFIED NEW SHOP/.test(s.ps||''))return 'e-opp';
 if(/^(AUDIT|POSSIBLE|RESEARCH)/i.test(s.ps||''))return 'e-quiet';
 return ''}

/* ---- 3. The relationship line -------------------------------------------
   This replaces the two 3x11px <i> bars that rendered as "|| YOL". Nothing
   in the app ever explained what the bars measured, and beside a word they
   read as pipe characters. Both suppliers are now named in plain words, and
   the instruction that follows is separated from the state by weight and
   colour rather than by a punctuation mark.

   'why' arrives from the record and may already contain the instruction
   ("Buying YOL - introduce MYCO"); when it does, the duplicate half is
   dropped rather than printed twice. */
function eRel(s,why){
 const both=s.yol&&s.myco;
 let state='';
 if(both)state='Buys from YOL and MYCO';
 else if(s.yol)state='Buys from YOL';

  const parts=w.split(/\.\s+/).map(x=>x.trim()).filter(Boolean);
  doing=parts.filter(x=>!/^buying\b/i.test(x)).join('. ');

     to sit after a dash. As its own sentence it needs a capital. */

  +(state?`<span class="e-rel-state">${esc(state)}.</span>`:'')
  +(doing?`<span class="e-rel-do">${esc(doing)}</span>`:'')
  +`</div>`}

    regression against /studio/ on every screen. A single textContent scan

  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(err=>console.error('[sw] registration failed:',err));
  }catch(e){
    /* A first open with no signal used to dead-end here with no way back.
       Say what happened, offer a retry, recover on its own when signal
       returns. Match the real per-engine network errors - Chrome "Failed to
       fetch", Safari "Load failed", Firefox "NetworkError" - not the bare
       word "load", which appears in plenty of ordinary JS errors. */
    var _s=String(e);
    var _off=(!navigator.onLine)||/failed to fetch|load failed|networkerror/i.test(_s);
    var _msg=_off?'The route book needs a signal the first time you open it. After that it works offline.':_s.replace(/[<>&]/g,'');
    document.getElementById('app').innerHTML='<div class="wrap"><div class="empty">'
      +'<b>'+(_off?'No connection':'Could not load data')+'</b>'
      +'<div style="margin:8px 0 16px;font-size:13px;line-height:1.5;opacity:.75">'+_msg+'</div>'
      +'<button class="tap" onclick="location.reload()" style="min-height:44px;padding:0 20px">Try again</button>'
      +'</div></div>';
    window.addEventListener('online',function(){location.reload()},{once:true});
  }
})();
</script>
</body></html>
