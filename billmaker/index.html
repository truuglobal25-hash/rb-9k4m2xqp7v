/* one delegated click handler for the whole app */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-act],[data-open],[data-cust],[data-custopen],[data-add],[data-pick],[data-fav],[data-qty],[data-move],[data-dupline],[data-dropline],[data-blank],[data-find],[data-manualprod],[data-price],[data-disc],[data-zoom],[data-vw],[data-rot],[data-retake],[data-up],[data-down],[data-drop],[data-pdf],[data-co],[data-cat],[data-dup],[data-del],[data-theme],[data-delmanual],[data-cropedit],[data-retrysec]');
  if (!t) return;
  const D = t.dataset;

  if (D.tab) { VIEW.tab = D.tab; VIEW.sub = VIEW.tab === 'new' && ORDER ? VIEW.sub : ''; if (VIEW.tab !== 'new') VIEW.sub = ''; render(); return; }

  if (D.act) {
    const act = D.act;
    if (act === 'startPhoto') { ORDER = blankOrder(); ORDER.mode = 'photo'; VIEW.sub = 'photo'; readError = ''; touch(); render(); setTimeout(() => { const c = document.getElementById('cam'); if (c) c.click(); }, 150); }
    else if (act === 'startManual') { if (!ORDER || VIEW.sub !== 'photo') ORDER = blankOrder(); ORDER.mode = ORDER.mode || 'manual'; VIEW.sub = 'manual'; touch(); render(); }
    else if (act === 'back') {
      if (VIEW.viewer) { closeViewer(); return; }
      VIEW.sub = VIEW.sub === 'finish' ? 'manual' : VIEW.sub === 'review' ? 'photo' : VIEW.sub === 'manual' && ORDER.mode === 'photo' && ORDER.read ? 'review' : '';
      render();
    }
    else if (act === 'shoot') document.getElementById('cam').click();
    else if (act === 'pick') document.getElementById('lib').click();
    else if (act === 'read') readPages();
    else if (act === 'acceptReview') acceptReview();
    else if (act === 'toFinish') {
      const missing = ORDER.lines.filter(l => !l.blank && l.qty > 0 && !(l.priceC > 0));
      if (!ORDER.customer.name) { alert('The customer name is needed first.'); return; }
      if (missing.length && !confirm(missing.length + ' line' + (missing.length === 1 ? ' has' : 's have') + ' no price and will print as PRICE NEEDED.\n\nContinue?')) return;
      const dup = duplicateWarning();
      if (dup && !confirm('POSSIBLE DUPLICATE ORDER — CHECK BEFORE SAVING\n\n' + dup + '\n\nContinue anyway?')) return;
      nextOrderNo(); VIEW.sub = 'finish'; touch(); render();
    }
    else if (act === 'backToLines') { VIEW.sub = 'manual'; render(); }
    else if (act === 'goOrders') { VIEW.tab = 'orders'; render(); }
    else if (act === 'goNew') { VIEW.tab = 'new'; VIEW.sub = ''; render(); }
    else if (act === 'goSettings') { VIEW.tab = 'settings'; render(); }
    else if (act === 'manualCust') {
      ORDER.customer.manual = true; ORDER.customer.custIndex = null;
      if (ORDER.read) { const f = ORDER.read.fields; ORDER.customer.name = ORDER.customer.name || f.shop.v; }
      ORDER.custChoices = null; VIEW.sub = VIEW.sub === 'review' ? 'review' : 'manual';
      editCustomer(); return;
    }
    else if (act === 'editCust') { editCustomer(); return; }
    else if (act === 'clearCust') { ORDER.customer.custIndex = null; touch(); render(); }
    else if (act === 'scan') scanBarcode();
    else if (act === 'customProd') customProduct(null);
    else if (act === 'duplicate') {
      const src = ORDER;
      ORDER = blankOrder();
      ORDER.customer = { ...src.customer };
      ORDER.lines = src.lines.filter(l => !l.blank).map(l => ({ ...l, id: 'l' + Math.random().toString(36).slice(2, 8) }));
      ORDER.notes = src.notes; ORDER.delivery = src.delivery; ORDER.mode = 'manual';
      VIEW.sub = 'manual'; touch(); render();
    }
    else if (act === 'complete') { ORDER.status = 'Completed'; touch(); render(); }
    else if (act === 'another') { ORDER = null; VIEW.sub = ''; render(); }
    else if (act === 'forgetPhotos') forgetPhotos();
    else if (act === 'print') { window.print(); }
    else if (act === 'share') {
      const text = orderText();
      if (navigator.share) { try { await navigator.share({ title: 'Order ' + nextOrderNo() + ' — ' + ORDER.customer.name, text }); } catch (_) {} }
      else { await navigator.clipboard.writeText(text).catch(() => prompt('Copy the order:', text)); alert('Copied — sharing is not available in this browser.'); }
    }
    else if (act === 'whatsapp') {
      const num = waNum(ORDER.customer.phone);
      const text = prompt('Check the WhatsApp message before it opens:', orderText());
      if (text === null) return;
      window.open('https://wa.me/' + (num || '') + '?text=' + encodeURIComponent(text), '_blank');
    }
    else if (act === 'email') {
      const sub = 'Order ' + nextOrderNo() + ' — ' + ORDER.customer.name + ' — ' + ORDER.date;
      location.href = 'mailto:?subject=' + encodeURIComponent(sub) + '&body=' + encodeURIComponent(orderText() + '\n\nThe PDF is saved on the phone as ' + pdfName('BOTH') + ' — attach it before sending.');
    }
    else if (act === 'copytext') { await navigator.clipboard.writeText(orderText()).catch(() => prompt('Copy the order:', orderText())); flashSaved(); }
    else if (act === 'backup') backupFile();
    else if (act === 'restore') document.getElementById('restorefile').click();
    else if (act === 'checkUpdate') {
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const r of regs) await r.update();
        alert('Checked. If a new version exists it is downloaded now and used the next time the app opens.');
      } else alert('The offline copy is not installed yet — open the app once with internet.');
    }
    else if (act === 'closeViewer') { if (e.target === t) closeViewer(); }
    else if (act === 'closeViewer2') closeViewer();
    else if (act === 'vfit') viewerFit('fit');
    else if (act === 'vactual') viewerFit('actual');
    else if (act === 'undo') undoLines();
    else if (act === 'redo') redoLines();
    else if (act === 'cropApply') { const c = VIEW.cropEdit;
      ORDER.pages[c.page].crop = { ...c.rect }; VIEW.cropEdit = null; touch(); render(); }
    else if (act === 'cropFull') { const c = VIEW.cropEdit;
      ORDER.pages[c.page].crop = null; VIEW.cropEdit = null; touch(); render(); }
    else if (act === 'cropCancel') { VIEW.cropEdit = null; render(); }
    return;
  }

  if (D.zoom != null) { openViewer(+D.zoom, D.box && D.box !== 'null' ? JSON.parse(D.box) : null); return; }
  if (D.vw) { VIEW.viewer.which = D.vw; render(); paintViewer(); return; }
  if (D.open) { const o = orders[D.open]; if (!o) return; ORDER = o; VIEW.tab = 'new'; VIEW.sub = o.read && !o.reviewed ? 'review' : (o.status !== 'Draft' ? 'finish' : (o.pages.length && !o.lines.length ? 'photo' : 'manual'));
    if (o.read && o.customer.custIndex == null && !o.customer.manual) o.custChoices = matchCustomerFromPage(o.read.fields);
    rehydratePages(); render(); return; }
  if (D.cust) { pickCustomer(+D.cust); return; }
  if (D.custopen) { CUSTTABQ = CUST[+D.custopen].n; ORDER = ORDER || blankOrder(); pickCustomer(+D.custopen); VIEW.tab = 'new'; VIEW.sub = 'manual'; render(); return; }
  if (D.add) { addProduct(D.add, !!D.case); return; }
  if (D.fav) { favs[D.fav] ? delete favs[D.fav] : favs[D.fav] = 1; SAVE('favs', favs); paintProdResults(); return; }
  if (D.pick) { const l = lineById(D.pick); if (!l) return; buzz(settings.haptics ? 9 : 0); snapshotLines();
    if (l.sku && l.cands.some(c => c.key === D.key && c.p.sku === l.sku && c.p.co === l.co)) { l.sku = null; l.co = ''; l.name = ''; l.priceC = 0; l.priceSrc = 'none'; refreshLine(l); }
    else applyProduct(l, D.key, false);
    l.blank = false; touch(); render(); return; }
  if (D.qty) { const l = lineById(D.qty); if (!l) return; buzz(settings.haptics ? 7 : 0);
    l.qty = Math.max(0, (l.qty || 0) + (+D.d)); if (!l.qty && VIEW.sub === 'manual') ORDER.lines = ORDER.lines.filter(x => x !== l);
    refreshLine(l); touch(); render(); return; }
  if (D.move) { const i = ORDER.lines.findIndex(l => l.id === D.move), j = i + (+D.d);
    if (i < 0 || j < 0 || j >= ORDER.lines.length) return;
    [ORDER.lines[i], ORDER.lines[j]] = [ORDER.lines[j], ORDER.lines[i]]; touch(); render(); return; }
  if (D.dupline) { const l = lineById(D.dupline); if (!l) return;
    const c = { ...l, id: 'l' + Math.random().toString(36).slice(2, 8) };
    ORDER.lines.splice(ORDER.lines.indexOf(l) + 1, 0, c); touch(); render(); return; }
  if (D.dropline) { const l = lineById(D.dropline); if (!l) return; snapshotLines();
    const at = ORDER.lines.indexOf(l); ORDER.lines.splice(at, 1); touch(); render();
    toastUndo('Line removed', () => { ORDER.lines.splice(at, 0, l); touch(); render(); }); return; }
  if (D.blank) { const l = lineById(D.blank); if (!l) return; snapshotLines();
    l.blank = !l.blank; if (l.blank) { l.sku = null; l.co = ''; } touch(); render(); return; }
  if (D.find) { const l = lineById(D.find); if (!l) return;
    const q = prompt('Search the catalogue for this line:', l.text);
    if (q === null) return;
    const c = searchProducts(q, { limit: 3 });
    if (!c.length) { alert('Nothing in the catalogue looks like that. Type the product instead, or leave the line blank.'); return; }
    l.cands = c; l.sku = null; l.co = ''; refreshLine(l); touch(); render(); return; }
  if (D.manualprod) { customProduct(D.manualprod); return; }
  if (D.price) { const l = lineById(D.price); if (!l) return;
    const v = prompt('Selling price in TT$ for\n' + (l.name || l.text) + '\n\n(The Lightspeed price stays on record — a manual price applies to this order only.)', l.priceC ? (l.priceC / 100).toFixed(2) : '');
    if (v === null) return;
    const f = parseFloat(v);
    if (isNaN(f) || f < 0) { alert('That is not a price.'); return; }
    l.priceC = Math.round(f * 100); l.priceSrc = l.priceC ? 'manual' : 'none'; touch(); render(); return; }
  if (D.disc) { const l = lineById(D.disc); if (!l) return;
    const v = prompt('Discount in TT$ off this line — 0 for none:', l.discC ? (l.discC / 100).toFixed(2) : '0');
    if (v === null) return;
    const f = parseFloat(v);
    if (isNaN(f) || f < 0) return;
    l.discC = Math.round(f * 100); touch(); render(); return; }
  if (D.rot) { rotatePage(+D.rot); return; }
  if (D.cropedit != null) { const pg = ORDER.pages[+D.cropedit];
    VIEW.cropEdit = { page: +D.cropedit, rect: pg.crop ? { ...pg.crop } : { x0: 0.06, y0: 0.06, x1: 0.94, y1: 0.94 } };
    render(); return; }
  if (D.retrysec != null) { retrySections(+D.retrysec); return; }
  if (D.retake) { VIEW.retake = +D.retake; document.getElementById('cam').click(); return; }
  if (D.up) { movePage(+D.up, -1); return; }
  if (D.down) { movePage(+D.down, 1); return; }
  if (D.drop) { if (confirm('Remove page ' + (+D.drop + 1) + '?')) dropPage(+D.drop); return; }
  if (D.pdf) {
    const which = D.pdf === 'preview' ? 'BOTH' : D.pdf.replace('-letter', '');
    const paper = D.pdf.endsWith('-letter') ? 'letter' : 'a4';
    t.disabled = true;
    setTimeout(async () => {   // let the pressed state paint before the work starts
      try {
        if (D.pdf === 'preview') {
          const blob = pdfBlob('BOTH', 'a4');
          const url = URL.createObjectURL(blob);
          window.open(url, '_blank');
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        } else {
          const name = await savePdf(which, paper);
          flashSaved(); toastUndo('Saved ' + name, null);
        }
      } finally { t.disabled = false; render(); }
    }, 30);
    return;
  }
  if (D.co != null) { SEARCHCO = D.co; render(); return; }
  if (D.cat != null) { CATF = D.cat; render(); return; }
  if (D.dup) { const o = orders[D.dup]; if (!o) return;
    ORDER = blankOrder(); ORDER.customer = { ...o.customer }; ORDER.notes = o.notes || '';
    ORDER.lines = (o.lines || []).filter(l => !l.blank).map(l => ({ ...l, id: 'l' + Math.random().toString(36).slice(2, 8) }));
    ORDER.mode = 'manual'; VIEW.tab = 'new'; VIEW.sub = 'manual'; touch(); render(); return; }
  if (D.del) { if (!confirm('Delete this order? Its photographs are removed from the phone too.')) return;
    const o = orders[D.del];
    for (const p of (o.pages || [])) idb.del('photos', p.id);
    delete orders[D.del]; SAVE('orders', orders); if (ORDER && ORDER.id === D.del) ORDER = null; render(); return; }
  if (D.theme) { settings.theme = D.theme; SAVE('settings', settings); applyTheme(); render(); return; }
  if (D.delmanual != null) { manualProducts.splice(+D.delmanual, 1); SAVE('manualprods', manualProducts); render(); return; }
});

/* inputs that change the order */
document.addEventListener('change', e => {
  const t = e.target, D = t.dataset;
  if (D.text) { const l = lineById(D.text); if (!l) return;
    l.text = t.value; l.readConf = 'clear';
    l.cands = searchProducts(l.text, { history: historyFor(ORDER.customer.name), limit: 3 });
    l.sku = null; l.co = ''; refreshLine(l); touch(); render(); return; }
  if (D.setqty) { const l = lineById(D.setqty); if (!l) return;
    const n = parseInt(t.value, 10);
    l.qty = isNaN(n) || n < 0 ? null : n; refreshLine(l); touch(); render(); return; }
  if (D.unit) { const l = lineById(D.unit); if (!l) return;
    l.unit = t.value;
    const p = l.sku ? productOf(l) : null;
    if (p && l.priceSrc !== 'manual') {
      const wantsCase = (l.unit === 'case' || l.unit === 'carton');
      if (wantsCase && !(p.cp > 0)) {
        // no case price on file: never pass the piece price off as a case price
        l.priceC = 0; l.priceSrc = 'none';
      } else {
        l.priceC = Math.round((wantsCase ? p.cp : p.price) * 100) || 0;
        l.priceSrc = l.priceC ? (p.pl ? 'list' : 'lightspeed') : 'none';
      }
    }
    touch(); render(); return; }
  if (D.ord) { ORDER[D.ord] = t.value; touch(); return; }
  if (D.set) { settings[D.set] = D.set === 'haptics' ? !!t.value : t.value; SAVE('settings', settings); touch(); return; }
  if (t.id === 'cam' || t.id === 'lib') {
    const files = [...t.files]; t.value = '';
    if (!files.length) return;
    const replace = VIEW.retake != null ? VIEW.retake : null; VIEW.retake = null;
    if (!ORDER) { ORDER = blankOrder(); VIEW.tab = 'new'; }
    VIEW.sub = 'photo';
    addPages(files, replace);
    return;
  }
  if (t.id === 'restorefile') {
    const f = t.files[0]; t.value = '';
    if (!f) return;
    f.text().then(restoreFrom);
  }
});

function editCustomer() {
  const C = ORDER.customer;
  const name = prompt('Shop name:', C.name || ''); if (name === null) return; C.name = name.trim();
  const trading = prompt('Trading name, if different:', C.trading || ''); if (trading !== null) C.trading = trading.trim();
  const contact = prompt('Contact person:', C.contact || ''); if (contact !== null) C.contact = contact.trim();
  const phone = prompt('Phone:', C.phone || ''); if (phone !== null) C.phone = phone.trim();
  const address = prompt('Address:', C.address || ''); if (address !== null) C.address = address.trim();
  const area = prompt('Area or town:', C.area || ''); if (area !== null) C.area = area.trim();
  touch(); render();
}
function pickCustomer(i) {
  const c = CUST[i]; if (!c) return;
  const C = ORDER.customer;
  const prevAuto = C.auto || {};
  C.custIndex = i; C.manual = false; C.name = c.n;
  C.auto = {};
  // fill what is empty, and REPLACE anything a previously-tapped customer
  // auto-filled - switching customers must not leave the old one's address
  for (const [k, v] of [['phone', c.p], ['address', c.ad], ['area', c.t], ['contact', c.contact || '']]) {
    if (v && (!C[k] || prevAuto[k])) { C[k] = v; C.auto[k] = true; }
    else if (!v && prevAuto[k]) { C[k] = ''; }
  }
  ORDER.custChoices = null;
  touch(); render();
}
const LIVE_URLS = new Set();   // blob URLs made by THIS page context only
async function rehydratePages() {
  for (const p of ORDER.pages || []) {
    if (p.thumbUrl && LIVE_URLS.has(p.thumbUrl)) continue;   // a stale one from before a refresh never counts
    const rec = await idb.get('photos', p.id);
    p.thumbUrl = rec ? URL.createObjectURL(rec.enhanced || rec.color || rec.clean) : '';
    if (p.thumbUrl) LIVE_URLS.add(p.thumbUrl);
    p.state = rec ? 'ready' : 'failed';
  }
  render();
}

/* small undo toast */
let toastT = null;
function toastUndo(msg, undo) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 10px);z-index:50;background:var(--ink);color:#F0ECE4;padding:10px 14px;border-radius:8px;display:flex;gap:12px;align-items:center;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.4)';
    document.body.appendChild(el);
  }
  el.innerHTML = esc(msg) + (undo ? ' <button style="all:unset;color:var(--tang-2);font-weight:700;cursor:pointer;min-height:32px;padding:0 6px">UNDO</button>' : '');
  if (undo) el.querySelector('button').onclick = () => { undo(); el.remove(); };
  clearTimeout(toastT);
  toastT = setTimeout(() => el.remove(), 4200);
}

function applyTheme() {
  const t = settings.theme || 'system';
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}

/* ------------------------------------------------------------------ boot -- */
applyTheme();
(function boot() {
  const res = LS('resume', null);
  if (res && res.id && orders[res.id] && Date.now() - (res.at || 0) < 3 * 86400000) {
    const o = orders[res.id];
    if (o.status === 'Draft' && ((o.lines || []).length || (o.pages || []).length)) {
      ORDER = o;
      if (o.read && o.customer.custIndex == null && !o.customer.manual)
        o.custChoices = matchCustomerFromPage(o.read.fields);   // suggestions survive a refresh
      VIEW.tab = 'new';
      VIEW.sub = res.sub || (o.read && !o.reviewed ? 'review' : o.pages.length && !o.lines.length ? 'photo' : 'manual');
      rehydratePages();
      render();
      toastUndo('Continuing where you left off', null);
      window.__BOOT_OK = true;
      return;
    }
  }
  render();
  window.__BOOT_OK = true;
})();
if ('serviceWorker' in navigator) addEventListener('load', () => { try { navigator.serviceWorker.register('sw.js'); } catch (_) {} });

/* If another context (an old tab finishing a read after a refresh) saves this
   order, adopt the newer copy rather than sitting on a stale one. */
addEventListener('storage', e => {
  if (e.key !== K('orders')) return;
  let fresh; try { fresh = JSON.parse(e.newValue || '{}'); } catch (_) { return; }
  for (const id in fresh) if (!ORDER || id !== ORDER.id) orders[id] = fresh[id];
  if (ORDER && fresh[ORDER.id] && !savePending) {
    const inc = fresh[ORDER.id];
    const richer = (inc.lines || []).length > (ORDER.lines || []).length || (!!inc.read && !ORDER.read);
    if (richer) {
      ORDER = inc; orders[ORDER.id] = inc;
      VIEW.sub = inc.read && !inc.reviewed ? 'review' : VIEW.sub;
      rehydratePages();
      toastUndo('This order was updated from another window', null);
    }
  }
  render();
});
</script>

 if(window.__BOOT_OK)return;
 document.getElementById('app').innerHTML=

  '<p><button class="btn" onclick="location.reload()">Try again</button> '+
  '<button class="btn quiet" onclick="(async function(){if(navigator.serviceWorker){var r=await navigator.serviceWorker.getRegistrations();for(var x of r)await x.unregister()}if(window.caches)for(var k of await caches.keys())await caches.delete(k);location.reload()})()">Repair app</button></p></div>';
},15000);
