<style>/* Bill Maker — visual system.
   Deep ink, warm porcelain, mineral green, burnt tangerine, muted brick.
   No gradients. No glass. No emoji. One spacing scale, one type scale,
   one border system, one icon family (inline SVG, 1.75 stroke). */

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}

:root{
  /* ---- ink ---- */
  --ink:#15181B; --ink-2:#252A2F; --ink-3:#3C444C; --ink-4:#5C666F;
  /* ---- paper ---- */
  --paper:#F3EFE7; --paper-2:#E8E2D6; --paper-3:#FBF9F4; --paper-4:#D8D0C0;
  /* ---- accents ---- */
  --green:#2E6A53; --green-2:#3E8A6C; --green-tint:#E2EDE7;
  --tang:#BE571C; --tang-2:#D9722F; --tang-tint:#F6E7DA;
  --brick:#9B3A31; --brick-2:#B84C41; --brick-tint:#F4E1DE;

  /* ---- semantic ---- */
  --bg:var(--paper); --surface:var(--paper-3); --surface-2:var(--paper-2);
  --line:rgba(21,24,27,.16); --line-soft:rgba(21,24,27,.09);
  --text:var(--ink); --text-2:var(--ink-3); --text-3:var(--ink-4);
  --edge:rgba(21,24,27,.28);          /* the pressable edge under buttons */

  /* ---- spacing (4pt rhythm) ---- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  /* ---- type ---- */
  --t-xs:12px; --t-sm:13px; --t-md:15px; --t-base:17px; --t-lg:20px;
  --t-xl:24px; --t-2xl:30px;
  /* ---- radius: square-ish, never pills ---- */
  --r-sm:4px; --r-md:7px; --r-lg:11px;
  --tap:48px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:calc(58px + var(--safe-b));
  --fast:120ms; --mid:200ms;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#101315; --surface:#181C1F; --surface-2:#20252A;
    --line:rgba(243,239,231,.16); --line-soft:rgba(243,239,231,.09);
    --text:#F0ECE4; --text-2:#B9C0C6; --text-3:#8B949B;
    --edge:rgba(0,0,0,.55);
    --green-tint:#1B2C26; --tang-tint:#2E211A; --brick-tint:#2E1D1B;
    --green-2:#4F9E7E; --tang-2:#E0863F; --brick-2:#C96054;
  }
}
[data-theme=dark]{
  --bg:#101315; --surface:#181C1F; --surface-2:#20252A;
  --line:rgba(243,239,231,.16); --line-soft:rgba(243,239,231,.09);
  --text:#F0ECE4; --text-2:#B9C0C6; --text-3:#8B949B; --edge:rgba(0,0,0,.55);
  --green-tint:#1B2C26; --tang-tint:#2E211A; --brick-tint:#2E1D1B;
  --green-2:#4F9E7E; --tang-2:#E0863F; --brick-2:#C96054;
}

body{
  background:var(--bg); color:var(--text);
  font:400 var(--t-base)/1.45 ui-sans-serif,-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
  font-feature-settings:"ss01","cv05";
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  overscroll-behavior-y:none;
}
/* prices, quantities and totals must never jiggle as digits change */
.num,input[type=number],.money{font-variant-numeric:tabular-nums lining-nums}

h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.012em;line-height:1.2}
h1{font-size:var(--t-xl)}
h2{font-size:var(--t-lg)}
h3{font-size:var(--t-base)}
p{margin:0 0 var(--s3)}
a{color:var(--green-2)}

/* ---------- layout ---------- */
#app{min-height:100dvh;padding-bottom:calc(var(--nav-h) + var(--s4))}
.screen{padding:var(--s4);max-width:760px;margin:0 auto}
@media(min-width:900px){.screen{max-width:1180px;padding:var(--s5)}}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(var(--safe-t) + var(--s3)) var(--s4) var(--s3);
  border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:var(--s3);min-height:calc(var(--safe-t) + 56px)
}
.topbar h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eyebrow{font-size:var(--t-xs);letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-3);font-weight:600;margin-bottom:var(--s1)}

/* ---------- pressable ---------- */
.btn{
  -webkit-appearance:none;appearance:none;font:inherit;font-weight:600;
  min-height:var(--tap);padding:0 var(--s4);
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--surface);color:var(--text);
  box-shadow:0 2px 0 var(--edge);
  transition:transform var(--fast) ease-out, box-shadow var(--fast) ease-out,
             background var(--fast) ease-out;
  cursor:pointer;text-align:center;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 0 0 var(--edge)}
.btn:disabled{opacity:.42;box-shadow:none;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--green-2);outline-offset:2px}
.btn.primary{background:var(--green);border-color:var(--green);color:#F7FBF9}
.btn.accent{background:var(--tang);border-color:var(--tang);color:#FFF8F2}
.btn.danger{background:var(--surface);border-color:var(--brick);color:var(--brick-2)}
.btn.quiet{background:transparent;box-shadow:none;border-color:var(--line-soft);font-weight:500}
.btn.quiet:active:not(:disabled){transform:none;background:var(--surface-2)}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:0 var(--s3);font-size:var(--t-md)}
.btn svg{width:19px;height:19px;flex:0 0 auto}
.btn-row{display:flex;gap:var(--s2);flex-wrap:wrap}
.btn-row>.btn{flex:1 1 auto}
@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important}}

/* the two opening choices */
.choice{
  display:grid;grid-template-columns:44px 1fr;gap:var(--s3) var(--s4);
  align-items:start;text-align:left;width:100%;
  padding:var(--s5) var(--s4);min-height:112px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:0 3px 0 var(--edge);color:var(--text);font:inherit;cursor:pointer;
  transition:transform var(--fast) ease-out, box-shadow var(--fast) ease-out;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.choice:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.choice:focus-visible{outline:3px solid var(--green-2);outline-offset:2px}
.choice .ttl{grid-column:2;font-size:var(--t-lg);font-weight:650;letter-spacing:-.01em}
.choice .sub{grid-column:2;font-size:var(--t-md);color:var(--text-2);line-height:1.4}
.choice svg{grid-row:1/3;width:32px;height:32px;color:var(--green)}
.choice.accent svg{color:var(--tang)}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s4);margin-bottom:var(--s3)}
.card>h2,.card>h3{margin-bottom:var(--s3)}
.rule{height:1px;background:var(--line-soft);margin:var(--s4) 0;border:0}

/* ---------- fields ---------- */
.field{display:block;margin-bottom:var(--s3)}
.field>span{display:block;font-size:var(--t-sm);font-weight:600;color:var(--text-2);
  margin-bottom:var(--s1)}
input,select,textarea{
  width:100%;min-height:var(--tap);padding:var(--s3);
  font:inherit;font-size:16px;              /* 16px stops iOS zooming on focus */
  color:var(--text);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-md);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green-2);outline-offset:-1px;
  border-color:var(--green-2)}
input[readonly]{background:var(--surface-2);color:var(--text-2)}
.hint{font-size:var(--t-sm);color:var(--text-2);margin-top:var(--s1)}

/* ---------- state colour: never colour alone, always a word too ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:var(--r-sm);
  font-size:var(--t-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  border:1px solid currentColor;background:var(--surface)}
.tag.ok{color:var(--green-2);background:var(--green-tint)}
.tag.review{color:var(--tang-2);background:var(--tang-tint)}
.tag.bad{color:var(--brick-2);background:var(--brick-tint)}
.tag.plain{color:var(--text-3);background:var(--surface-2)}
.tag svg{width:13px;height:13px}

/* ---------- lists ---------- */
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:var(--s3);width:100%;
  min-height:var(--tap);padding:var(--s3) 0;border-bottom:1px solid var(--line-soft);
  background:none;border-left:0;border-right:0;border-top:0;color:var(--text);
  font:inherit;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .nm{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{display:block;font-size:var(--t-sm);color:var(--text-2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.vlist{position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---------- bottom navigation ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
nav.tabs button{
  -webkit-appearance:none;appearance:none;border:0;background:none;font:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:58px;padding:6px 2px;color:var(--text-3);font-size:11px;font-weight:600;
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current=page]{color:var(--green-2)}
nav.tabs button:active{background:var(--surface-2)}

/* ---------- honest staged progress ---------- */
.stages{list-style:none;margin:var(--s3) 0 0;padding:0}
.stages li{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) 0;
  color:var(--text-3);font-size:var(--t-md)}
.stages li[data-state=now]{color:var(--text);font-weight:600}
.stages li[data-state=done]{color:var(--text-2)}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid currentColor;flex:0 0 auto}
.stages li[data-state=done] .dot{background:var(--green-2);border-color:var(--green-2)}
.stages li[data-state=now] .dot{background:var(--tang);border-color:var(--tang);
  animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- review ---------- */
.line{border:1px solid var(--line);border-left:4px solid var(--line);
  border-radius:var(--r-md);padding:var(--s3);margin-bottom:var(--s3);background:var(--surface)}
.line.ok{border-left-color:var(--green)}
.line.review{border-left-color:var(--tang)}
.line.bad{border-left-color:var(--brick)}
.line.blank{opacity:.62;border-left-color:var(--text-3)}
.line-head{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s2)}
.line-head .idx{font-weight:700;color:var(--text-3);font-variant-numeric:tabular-nums}
/* (v1 fixed-window strip retired — see the v2 .crop/.photo rules at the end) */
.cands{display:grid;gap:var(--s2);margin-top:var(--s2)}
.cand{display:block;width:100%;text-align:left;padding:var(--s3);font:inherit;color:var(--text);
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-md);
  min-height:var(--tap);cursor:pointer}
.cand[aria-pressed=true]{border-color:var(--green);background:var(--green-tint);
  box-shadow:inset 0 0 0 1px var(--green)}
.cand .nm{font-weight:600}
.cand .sub{font-size:var(--t-sm);color:var(--text-2)}
.qty-row{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s2);flex-wrap:wrap}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--r-md);
  overflow:hidden;background:var(--surface)}
.stepper button{width:var(--tap);min-height:var(--tap);border:0;background:none;font:inherit;
  font-size:var(--t-lg);color:var(--text);cursor:pointer;touch-action:manipulation}
.stepper button:active{background:var(--surface-2)}
.stepper input{width:64px;min-height:var(--tap);text-align:center;border:0;border-left:1px solid var(--line);
  border-right:1px solid var(--line);border-radius:0}

@media(min-width:900px){
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s5);align-items:start}
  .split .sticky{position:sticky;top:calc(var(--safe-t) + 76px)}
  nav.tabs{grid-template-columns:repeat(5,minmax(0,140px));justify-content:center}
}

/* ---------- zoom viewer ---------- */
.viewer{position:fixed;inset:0;z-index:60;background:#0C0E10;display:flex;flex-direction:column;
  padding:calc(var(--safe-t) + var(--s2)) var(--s2) calc(var(--safe-b) + var(--s2))}
.viewer .bar{display:flex;gap:var(--s2);justify-content:center;padding-bottom:var(--s2);flex-wrap:wrap}
.viewer .pane{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;justify-content:center}
.viewer img{max-width:none;height:auto;align-self:flex-start}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.empty{text-align:center;padding:var(--s7) var(--s4);color:var(--text-2)}
.empty svg{width:40px;height:40px;color:var(--text-3);margin-bottom:var(--s3)}
@media print{nav.tabs,.topbar,.btn,.viewer{display:none!important}}

/* ---- v2: the photograph is always shown COMPLETE, contain, never cover ---- */
.photo{display:block;width:100%;padding:0;margin:0;cursor:zoom-in;
 background:#fff;border:1.5px solid var(--ink-3);border-radius:var(--r-md);overflow:hidden}
.photo img{display:block;width:100%;height:auto;max-height:72dvh;object-fit:contain;background:#fff}
.crop{display:block;width:100%;height:72px;overflow:hidden;border-radius:var(--r-sm);
 border:1px solid var(--line-soft);background:#fff;margin-bottom:var(--s2);padding:0;cursor:zoom-in;position:relative}
.crop img{display:block;position:relative}
.viewer .pane{touch-action:none;position:relative;background:#171a1d;border-radius:var(--r-sm)}
.viewer img{border:2px solid var(--tang);border-radius:2px;background:#fff}
.cropwrap{position:relative;flex:1;align-self:center;max-width:100%;overflow:hidden;
 display:flex;align-items:center;justify-content:center}
.cropwrap img{max-width:100%;max-height:78dvh;object-fit:contain;border:2px solid #667}
.cropbox{position:absolute;border:2px dashed var(--tang);background:rgba(190,87,28,.08)}
.handle{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--tang);
 border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.handle.nw{left:-17px;top:-17px}.handle.ne{right:-17px;top:-17px}
.handle.sw{left:-17px;bottom:-17px}.handle.se{right:-17px;bottom:-17px}
.line-tools{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}

/* v2 phone sizing: nothing tiny, nothing hidden */
nav.tabs button{min-height:64px;font-size:12px;gap:4px}
nav.tabs button svg{width:24px;height:24px}
.qin{width:92px;font-size:17px}
.stepper button{font-size:22px}
.tag{font-size:11.5px}
.row .sub{font-size:14px}
.hint{font-size:14px}
input,select,textarea{font-size:16px}

   ========================================================================= */
'use strict';

const APP_VER = '2.0.0';
const K = s => 'bm_' + s;                       // its own local-storage prefix
const DATA = window.__BM__;                     // {checked, products[], customers[]}
const PROD = DATA.products, CUST = DATA.customers;
const SNAPSHOT = DATA.checked;                  // when the Lightspeed catalogue was taken

const LS = (k, d) => { try { const v = localStorage.getItem(K(k)); return v == null ? d : JSON.parse(v); } catch (_) { return d; } };

   Photographs and finished PDFs are far too big for local storage, so they
   live in this app's own IndexedDB. Nothing here ever leaves the phone
   except the one time a photograph is sent to be read. */
let _db = null;
function db() {
  return _db || (_db = new Promise((res, rej) => {
    const r = indexedDB.open('bm_store', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');
      if (!d.objectStoreNames.contains('pdfs')) d.createObjectStore('pdfs');

    r.onerror = () => rej(r.error);

const idb = {
  async put(store, k, v) { const d = await db(); return new Promise((res, rej) => { const t = d.transaction(store, 'readwrite'); t.objectStore(store).put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async get(store, k) { const d = await db(); return new Promise(res => { const q = d.transaction(store, 'readonly').objectStore(store).get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); },
  async del(store, k) { const d = await db(); return new Promise(res => { const t = d.transaction(store, 'readwrite'); t.objectStore(store).delete(k); t.oncomplete = res; t.onerror = res; }); },
  async keys(store) { const d = await db(); return new Promise(res => { const q = d.transaction(store, 'readonly').objectStore(store).getAllKeys(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); }); },
  async count(store) { const d = await db(); return new Promise(res => { const q = d.transaction(store, 'readonly').objectStore(store).count(); q.onsuccess = () => res(q.result); q.onerror = () => res(0); }); },
};

/* ------------------------------------------------------------- search --
   One inverted index built once at boot. 17,000+ customers must answer in
   well under 100ms, so nothing walks the whole list on every keystroke. */
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
  .toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();

// How the reps actually spell things, taken from real order books.
const SPELL = {
  wouish: 'wowish', wonish: 'wowish', rosemarry: 'rosemary', rosmarry: 'rosemary',
  nepis: 'nepsis', nepirs: 'nepsis', nepris: 'nepsis', blackesed: 'blackseed', blacksed: 'blackseed',
  insence: 'incense', insense: 'incense', inserce: 'incense', vasence: 'incense', incence: 'incense',
  message: 'massage', harbodent: 'herbodent', mesuak: 'meswak', meswak: 'meswak',
  shanespro: 'shavepro', shauespro: 'shavepro', shavespro: 'shavepro',
  colerey: 'celery', clorey: 'celery', glorey: 'glorey', vijohn: 'vijohn',
  shilayit: 'shilajit', ashuna: 'ashwagandha', ashwa: 'ashwagandha', ashuagandha: 'ashwagandha',
  multiuitamin: 'multivitamin', kojik: 'kojic', vere: 'vera', seamos: 'seamoss',
  yogi: 'yogiraj', yogiraaj: 'yogiraj', alchol: 'alcoholic', alcholic: 'alcoholic',
  wharler: 'inhaler', whaler: 'inhaler', sereum: 'serum', efferuescent: 'effervescent',
  sebler: 'seller', sebbers: 'sellers', redonion: 'red onion',
  beer: 'energy drink', beers: 'energy drink',   // the herbal "beers" are catalogued as energy drinks
};
const STOP = new Set(['the', 'of', 'a', 'and', 'for', 'with', 'in', 'on', 'ltd', 'limited',
  'ps', 'pcs', 'pc', 'piece', 'pieces', 'case', 'cases', 'box', 'boxes', 'pack', 'packs',
  'ctn', 'carton', 'dozen', 'each', 'all', 'x', 'mix', 'mixed']);
// single letters left over from apostrophes ("daisy's" -> "daisy s") are noise
const toks = s => norm(s).split(' ').map(w => SPELL[w] || w).join(' ').split(' ')
  .filter(w => w.length > 1 || /\d/.test(w));
const keyToks = s => toks(s).filter(w => !STOP.has(w));

function buildIndex(rows, textOf) {
  const map = new Map();                       // 3-letter prefix -> row numbers
  rows.forEach((r, i) => {
    const seen = new Set();
    for (const w of toks(textOf(r))) {
      const p = w.slice(0, 3);
      if (seen.has(p)) continue;
      seen.add(p);
      let a = map.get(p); if (!a) map.set(p, a = []);
      a.push(i);
    }
  });
  return map;
}

// Dice bigram similarity — forgiving of one or two wrong letters.
function dice(a, b) {
  if (a === b) return 1;
  if (a.length < 2 || b.length < 2) return 0;
  const m = new Map();
  for (let i = 0; i < a.length - 1; i++) { const g = a.slice(i, i + 2); m.set(g, (m.get(g) || 0) + 1); }
  let hit = 0;
  for (let i = 0; i < b.length - 1; i++) { const g = b.slice(i, i + 2), c = m.get(g); if (c > 0) { m.set(g, c - 1); hit++; } }
  return 2 * hit / (a.length + b.length - 2);
}

/* Every product carries its supplying company. This is the guard that stops a
   MYCO brand ever being filed under Yusuf Overseas. */
const MYCO_BRAND = /dr\.? ?herbician|vi ?[- ]?john|floraura|tails? ?(&|and)? ?treat/i;
const companyOf = p => p.co;

const SIZE_RX = /(\d+)\s*(ml|g|gm|kg|l|pcs|pc)\b/i;
const PX = PROD.map((p, i) => {
  const t = keyToks(p.n + ' ' + (p.b || '') + ' ' + (p.als || ''));
  return { i, p, t, flat: t.join(''), n: norm(p.n), a: norm(p.als || ''),
           sz: norm((p.n.match(SIZE_RX) || [''])[0]) };
});
const P_INDEX = buildIndex(PX, e => e.p.n + ' ' + (e.p.b || '') + ' ' + (e.p.als || '') + ' ' + e.p.sku);
const C_INDEX = buildIndex(CUST, c => c.n + ' ' + (c.aka || '') + ' ' + (c.t || '') + ' ' + (c.ad || ''));
const CUST_BY_PHONE = new Map();
CUST.forEach((c, i) => { if (c.p) { let a = CUST_BY_PHONE.get(c.p); if (!a) CUST_BY_PHONE.set(c.p, a = []); a.push(i); } });

function candidateRows(index, q, cap) {
  const words = toks(q); if (!words.length) return [];
  const count = new Map();
  for (const w of words) {
    const rows = index.get(w.slice(0, 3)); if (!rows) continue;
    for (const r of rows) count.set(r, (count.get(r) || 0) + 1);
  }
  const out = [...count.entries()].sort((a, b) => b[1] - a[1]).slice(0, cap || 1400);
  return out.map(e => e[0]);
}

   Matching. Nothing here ever invents a product, price, quantity or customer.
   ========================================================================= */

const UNIT_WORDS = {
  ps: 'piece', pcs: 'piece', pc: 'piece', piece: 'piece', pieces: 'piece', unit: 'piece', units: 'piece',
  pack: 'pack', packs: 'pack', pk: 'pack',
  case: 'case', cases: 'case', cs: 'case', ctn: 'carton', carton: 'carton', cartons: 'carton',
  box: 'case', boxes: 'case', dozen: 'pack',
};
const UNIT_LABEL = { piece: 'Pieces', pack: 'Packs', case: 'Cases', carton: 'Cartons' };

/* ---- product search: used by the search box and by handwriting matching ---- */
function searchProducts(q, opts) {
  opts = opts || {};
  // A bare 1-4 digit number in an order line is a quantity, not a product word.
  // Left in, it dilutes coverage and sinks real matches ("6 small Yogiraj").
  // Sizes survive because they carry their unit ("200ml"); barcodes are 6+.
  const words = keyToks(q).filter(w => !/^\d{1,4}$/.test(w));
  if (!words.length) return [];
  const digits = (q.match(/\d{6,}/g) || []);
  const flatQ = words.join('');
  const qSize = norm((q.match(SIZE_RX) || [''])[0]);
  const learned = fixes[words.join(' ')];
  const hist = opts.history || null;
  const rows = candidateRows(P_INDEX, q);
  const out = [];

  const consider = e => {
    const p = e.p;
    if (opts.company && p.co !== opts.company) return;
    let s = 0, why = '', isLearned = false;

    if (digits.length && digits.indexOf(p.sku) >= 0) { s = 100; why = 'the barcode is written on the page'; }
    else if (learned && learned.sku === p.sku && learned.co === p.co) { s = 97; why = 'you corrected this same writing before'; isLearned = true; }
    else if (flatQ === e.n.replace(/ /g, '')) { s = 95; why = 'exact catalogue name'; }
    else if (e.a && flatQ === e.a.replace(/ /g, '')) { s = 92; why = 'exact catalogue alias'; }
    else if (flatQ.length >= 6 && e.flat.indexOf(flatQ) >= 0) { s = 88; why = 'the whole line appears in the catalogue name'; }
    else {
      let got = 0;
      for (const w of words) {
        let best = 0;
        for (const t of e.t) {
          if (t === w) { best = 1; break; }
          const d = (w.length >= 4 && t.length >= 4) ? dice(w, t)
                  : (t.indexOf(w) === 0 && w.length >= 3 ? 0.85 : 0);
          if (d > best) best = d;
        }
        if (best >= 0.72) got += best;
      }
      const cov = got / words.length;
      if (cov < 0.34) return;
      s = 34 + cov * 52;
      why = cov >= 0.95 ? 'every word matches' : cov >= 0.7 ? 'most words match' : 'some words match';
      if (qSize && e.sz && qSize === e.sz) { s += 5; why += ', size agrees'; }
      else if (qSize && e.sz) { s -= 9; why += ', but the size is different'; }
      if (p.b && words.some(w => w.length > 3 && norm(p.b).indexOf(w) >= 0)) s += 3;
    }
    // Buying history may only move a candidate up the list. It can never be the
    // thing that confirms a line — see tierFor().
    if (hist && hist[p.co + '|' + p.sku] && s < 85) {
      s += Math.min(6, hist[p.co + '|' + p.sku]);
      why += ', this customer bought it before';
    }
    if (s > 0) out.push({ key: p.co + '|' + p.sku, p, score: Math.min(99, Math.round(s)), why, learned: isLearned });
  };

  for (const r of rows) consider(PX[r]);
  if (digits.length) for (const e of PX) if (digits.indexOf(e.p.sku) >= 0) { if (!out.some(o => o.p === e.p)) consider(e); }
  out.sort((a, b) => b.score - a.score);
  return out.slice(0, opts.limit || 3);
}

/* ---- the five states the owner asked for ---- */
const STATE = {
  OK: 'CONFIRMED', REVIEW: 'REVIEW THIS', UNREAD: 'COULD NOT READ',
  NOTFOUND: 'PRODUCT NOT FOUND', COMPANY: 'COMPANY NEEDS CHECKING',
  ASSORT: 'MIXED CASE — CHOOSE THE PRODUCTS',
};
function tierFor(line) {
  if (line.readConf === 'unreadable' || !line.text.trim()) return 'UNREAD';
  if (line.kind === 'assortment') return 'ASSORT';
  const c = line.cands || [];
  if (!c.length) return 'NOTFOUND';
  // A remembered correction ranks first but is still shown for confirmation:
  // one mistaken tap must never become a silent habit.
  if (c[0].learned) return 'REVIEW';
  const gap = c[1] ? c[0].score - c[1].score : 99;
  if (c[0].score >= 85 && gap >= 8 && line.readConf === 'clear') return 'OK';
  if (c[0].score >= 55) return 'REVIEW';
  return 'NOTFOUND';
}
function companyProblem(line) {
  if (!line.sku) return false;
  const p = productOf(line);
  if (!p) return false;
  if (line.pageCompany && line.pageCompany !== p.co) return true;   // the page says otherwise
  return MYCO_BRAND.test(line.text) && p.co !== 'MYCO';             // a MYCO brand filed under YOL
}
const productOf = l => l.sku ? PROD.find(p => p.sku === l.sku && p.co === l.co) : null;
const productByKey = k => { const [co, sku] = String(k).split('|'); return PROD.find(p => p.co === co && p.sku === sku); };

/* ---- customer search ---- */
function searchCustomers(q, limit) {
  const phone = String(q || '').replace(/\D/g, '');
  const out = [];
  const push = (i, sc, why) => out.push({ c: CUST[i], i, score: sc, why });

  if (phone.length >= 7) {                       // a phone number is the strongest signal there is
    const hit = CUST_BY_PHONE.get(phone.slice(-7));
    if (hit) hit.forEach(i => push(i, 100, 'phone number matches'));
  }
  const words = keyToks(q);
  if (words.length) {
    const qn = norm(q), flatQ = words.join('');
    for (const r of candidateRows(C_INDEX, q)) {
      const c = CUST[r];
      if (out.some(o => o.i === r)) continue;
      const cn = norm(c.n), ct = keyToks(c.n + ' ' + (c.aka || ''));
      let s = 0, why = '';
      if (cn === qn) { s = 92; why = 'name matches exactly'; }
      else if (flatQ.length >= 5 && cn.replace(/ /g, '').indexOf(flatQ) >= 0) { s = 80; why = 'name contains what you typed'; }
      else {
        let hit = 0;
        for (const w of words) if (ct.some(t => t === w || (w.length > 4 && dice(w, t) > 0.82))) hit++;
        const cov = hit / words.length;
        if (cov < 0.45) continue;
        s = 30 + cov * 45;
        why = cov >= 0.99 ? 'every word matches' : 'name is close';
      }
      if (c.aka && norm(c.aka).indexOf(qn) >= 0 && qn) { s += 6; why += ', known also by that name'; }
      push(r, Math.round(s), why);
    }
  }
  out.sort((a, b) => b.score - a.score || a.c.n.length - b.c.n.length);
  return out.slice(0, limit || 25);
}

/* Matching a customer read off a photograph uses more than the name, because a
   similar name alone must never be treated as the same shop. */
function matchCustomerFromPage(read) {
  const name = (read.shop || {}).v || '', phone = (read.phone || {}).v || '';
  const addr = (read.address || {}).v || '', contact = (read.contact || {}).v || '';
  const ph = String(phone).replace(/\D/g, '').slice(-7);
  const scored = new Map();
  const bump = (i, s, why) => {
    const cur = scored.get(i) || { s: 0, why: [] };
    cur.s += s; cur.why.push(why); scored.set(i, cur);
  };
  if (ph) (CUST_BY_PHONE.get(ph) || []).forEach(i => bump(i, 60, 'phone number matches'));
  if (name) for (const r of searchCustomers(name, 40)) {
    if (r.score >= 80) bump(r.i, 45, 'name matches');
    else if (r.score >= 55) bump(r.i, 26, 'name is close');
  }
  const an = norm(addr);
  if (an.length > 10) for (const [i, v] of scored) {
    const c = CUST[i];
    if (c.ad && norm(c.ad).slice(0, 24) === an.slice(0, 24)) bump(i, 18, 'address matches');
  }
  const cn = norm(contact).replace(/^(mr|ms|mrs|miss)\s+/, '');
  if (cn) for (const [i] of scored) {
    const c = CUST[i];
    if (c.contact && norm(c.contact).indexOf(cn) >= 0) bump(i, 12, 'contact person matches');
  }
  const out = [...scored.entries()]
    .map(([i, v]) => ({ c: CUST[i], i, score: v.s, why: [...new Set(v.why)].join(', ') }))
    .filter(r => r.score >= 26)
    .sort((a, b) => b.score - a.score)
    .slice(0, 5);
  // A single candidate is only treated as certain when something other than the
  // name agrees — a phone number, an account, or the address.
  out.forEach(r => { r.certain = /phone|address/.test(r.why); });
  return out;
}

/* what this customer has bought before, from this app's own saved orders only */
function historyFor(name) {
  const n = norm(name || ''); if (!n) return {};
  const h = {};
  for (const id in orders) {
    const o = orders[id];
    if (norm((o.customer || {}).name || '') !== n) continue;
    (o.lines || []).forEach(l => { if (l.sku) h[l.co + '|' + l.sku] = (h[l.co + '|' + l.sku] || 0) + 1; });
  }
  return h;
}
/* products this shop tends to buy together with the ones already on the order */
function alsoBought(name, have) {
  const h = historyFor(name), out = [];
  for (const k in h) if (!have.has(k)) out.push({ k, n: h[k] });
  return out.sort((a, b) => b.n - a.n).slice(0, 6).map(x => productByKey(x.k)).filter(Boolean);
}

/* Quiet incremental autosave. Never interrupts typing: it waits for an idle
   moment and only writes the order that actually changed. */
let saveTimer = null, savePending = false;
function touch() {
  if (!ORDER) return;
  savePending = true;
  if (saveTimer) return;
  const run = () => {
    saveTimer = null;
    if (!savePending || !ORDER) return;
    savePending = false;
    const clone = { ...ORDER };
    delete clone.custChoices;                 // recomputed, never worth storing
    // blob: URLs die with the page context - persisting one leaves a broken
    // image after any refresh. Pages are re-hydrated from IndexedDB instead.
    clone.pages = (clone.pages || []).map(pg => { const c = { ...pg }; delete c.thumbUrl; return c; });
    orders[ORDER.id] = clone;
    SAVE('orders', orders);
    SAVE('resume', { id: ORDER.id, tab: VIEW.tab, sub: VIEW.sub, at: Date.now() });
    flashSaved();
  };
  saveTimer = setTimeout(() => (window.requestIdleCallback || setTimeout)(run, { timeout: 400 }), 300);
}
function flashSaved() {
  const el = document.getElementById('savedmark');
  if (!el) return;
  el.textContent = 'Saved';
  el.style.opacity = '1';
  clearTimeout(flashSaved.t);
  flashSaved.t = setTimeout(() => { el.style.opacity = '0'; }, 1200);
}

/* ------------------------------------------------------------ progress --

const STAGES = [
  ['improving', 'Improving the photograph'],

  ['pricing', 'Checking prices'],
  ['review', 'Preparing the review'],

let stageNow = '';
function setStage(s) { stageNow = s; paintStages(); }

}

/* ------------------------------------------------------- photo capture -- */
let imgWorker = null, workerJobs = new Map(), workerSeq = 0;
function worker() {
  if (imgWorker) return imgWorker;
  imgWorker = new Worker('imgworker.js');
  imgWorker.onmessage = e => {
    const m = e.data;
    if (m.type === 'stage') { setStage(m.stage); return; }
    const job = workerJobs.get(m.id);
    if (!job) return;
    workerJobs.delete(m.id);
    m.type === 'error' ? job.rej(new Error(m.message)) : job.res(m);
  };
  imgWorker.onerror = () => { imgWorker = null; };
  return imgWorker;
}
function workerCall(op, blob, opts) {
  return new Promise((res, rej) => {
    const id = ++workerSeq;
    workerJobs.set(id, { res, rej });
    try { worker().postMessage({ id, op, blob, opts: opts || null }); }
    catch (e) { workerJobs.delete(id); rej(e); }
  });
}
const processImage = (blob, opts) => workerCall('prepare', blob, opts);
const makeTiles = (blob, crop) => workerCall('tiles', blob, { crop: crop || null });

async function addPages(files, replaceIndex) {
  if (!ORDER) ORDER = blankOrder();
  ORDER.mode = 'photo';
  for (const f of files) {
    // the picture appears immediately; the clean-up happens behind it
    const page = { id: ORDER.id + ':' + Math.random().toString(36).slice(2, 8),
                   thumbUrl: URL.createObjectURL(f), state: 'working', turn: 0 };
    if (replaceIndex != null) { const old = ORDER.pages[replaceIndex]; if (old) idb.del('photos', old.id); ORDER.pages[replaceIndex] = page; }
    else ORDER.pages.push(page);
    render(); touch();
    try {
      setStage('improving');
      const r = await processImage(f, null);
      const dup = ORDER.pages.find(p => p !== page && p.hash && r.hash &&
        p.hash.split('').filter((ch, i) => ch !== r.hash[i]).length <= 4);
      // The original is stored untouched. Both reading copies are the FULL
      // frame - nothing is ever cropped automatically (the v1 failure).
      await idb.put('photos', page.id, { original: f, color: r.colorFull,
        enhanced: r.enhancedFull, at: new Date().toISOString(), order: ORDER.id });
      URL.revokeObjectURL(page.thumbUrl);
      const tu = URL.createObjectURL(r.thumb);
      if (typeof LIVE_URLS !== 'undefined') LIVE_URLS.add(tu);
      Object.assign(page, { state: dup ? 'duplicate' : 'ready', w: r.w, h: r.h,
        deskew: r.deskew, hash: r.hash, bands: r.bands || [], warnings: r.warnings || [],
        crop: null, turn: r.turn || 0, thumbUrl: tu, dupOf: dup ? dup.id : null });
    } catch (e) {
      page.state = 'failed';
      page.error = /image|decode|bitmap/i.test(String(e.message || e))
        ? 'This photograph could not be opened. Take it again, or choose a JPEG copy.'
        : String(e.message || e);
    }
    setStage(''); render(); touch();
  }
}
async function rotatePage(i) {
  const p = ORDER.pages[i]; if (!p) return;
  const rec = await idb.get('photos', p.id); if (!rec) return;
  p.state = 'working'; p.turn = ((p.turn || 0) + 90) % 360; render();
  const r = await processImage(rec.original, { rotate: p.turn });
  await idb.put('photos', p.id, { ...rec, color: r.colorFull, enhanced: r.enhancedFull });
  URL.revokeObjectURL(p.thumbUrl);
  const tu2 = URL.createObjectURL(r.thumb);
  if (typeof LIVE_URLS !== 'undefined') LIVE_URLS.add(tu2);
  Object.assign(p, { state: 'ready', w: r.w, h: r.h, bands: r.bands || [],
    warnings: r.warnings || [], thumbUrl: tu2 });
  render(); touch();
}
async function dropPage(i) {
  const p = ORDER.pages[i]; if (!p) return;
  await idb.del('photos', p.id);
  if (p.thumbUrl) URL.revokeObjectURL(p.thumbUrl);
  ORDER.pages.splice(i, 1); render(); touch();
}
function movePage(i, d) {
  const j = i + d;
  if (j < 0 || j >= ORDER.pages.length) return;
  const a = ORDER.pages; [a[i], a[j]] = [a[j], a[i]]; render(); touch();
}

/* ------------------------------------------------------------- reading -- */
// The deployed reading service. Settings can override it, but out of the box
// the app reads with no setup at all.
const DEFAULT_READER = 'https://routebook-reader.tt-smart-bill-reader-8263.workers.dev';
const readerUrl = () => (settings.reader || '').trim() || DEFAULT_READER;
const blobToB64 = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(String(f.result).split(',')[1]); f.readAsDataURL(b); });

let readError = '';

function setDetail(t) { stageDetail = t; const el = document.getElementById('stagedetail'); if (el) el.textContent = t; }

async function callReader(images, mode) {
  const res = await fetch(readerUrl(), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ images, mode: mode || 'page' }),
  });
  if (!res.ok) throw new Error(
    res.status === 429 ? 'busy'
    : (res.status === 404 || res.status === 405) ? 'The reading service is not set up yet. Open Settings and check its address. You can build this order by hand in the meantime.'
    : 'The reading service replied ' + res.status + '.');
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

/* Read one page completely: the whole page first, then overlapping close-up
   sections, merged by position and wording. A section that fails is recorded
   and can be retried on its own - never the whole page again. */
async function readOnePage(pageIdx) {
  const page = ORDER.pages[pageIdx];
  const rec = await idb.get('photos', page.id);
  if (!rec) throw new Error('Page ' + (pageIdx + 1) + ' is missing from this phone. Photograph it again.');
  const label = 'Page ' + (pageIdx + 1) + ' of ' + ORDER.pages.length;

  setStage('reading'); setDetail(label + ' — whole page');
  const full = await callReader([await blobToB64(rec.enhanced)], 'page');

  setDetail(label + ' — preparing close-ups');
  const { tiles } = await makeTiles(rec.enhanced, page.crop);
  const sections = [];
  for (let t = 0; t < tiles.length; t++) {
    setDetail(label + ' — close-up ' + (t + 1) + ' of ' + tiles.length);
    try {
      const r = await callReader([await blobToB64(tiles[t].blob)], 'section');
      sections.push({ rect: tiles[t].rect, lines: r.lines || [], customer: r.customer || null, ok: true });
    } catch (e) {
      sections.push({ rect: tiles[t].rect, lines: [], ok: false, err: String(e.message || e) });
    }
  }
  return { full, sections, page: pageIdx };
}

/* Map a section-relative box back onto the page. */
function sectionBox(box, rect) {
  if (!box) return null;
  const w = rect.x1 - rect.x0, h = rect.y1 - rect.y0;
  return [rect.x0 + box[0] * w, rect.y0 + box[1] * h, rect.x0 + box[2] * w, rect.y0 + box[3] * h];
}
const midY = b => b ? (b[1] + b[3]) / 2 : null;
const textSim = (a, b) => dice(keyToks(a).join(''), keyToks(b).join(''));

/* Merge the whole-page result with every close-up section.
   - a close-up line that matches a whole-page line confirms it (qty conflicts flagged)
   - a close-up line nothing matches is ADDED, flagged for review
   - handwriting bands with no line at all become COULD NOT READ placeholders */
function mergePage(result, hist) {
  const base = (result.full.lines || []).map(l => ({ src: l, page: result.page,
    box: l.box || null, seen: 0 }));
  const extras = [];
  for (const sec of result.sections) {
    if (!sec.ok) continue;
    for (const sl of sec.lines) {
      const box = sectionBox(sl.box, sec.rect);
      const my = midY(box);
      let hit = null, bestScore = 0;
      for (const b of base) {
        const by = midY(b.box);
        const near = my != null && by != null && Math.abs(my - by) < 0.035;
        const sim = textSim(sl.text || '', b.src.text || '');
        const score = (near ? 0.5 : 0) + sim;
        if ((near || sim >= 0.72) && score > bestScore) { bestScore = score; hit = b; }
      }
      if (hit) {
        hit.seen++;
        if (sl.qty != null && hit.src.qty != null && sl.qty !== hit.src.qty) hit.qtyConflict = sl.qty;
        if (sl.qty != null && hit.src.qty == null) hit.src.qty = sl.qty;
        if ((sl.c === 'clear') && hit.src.c !== 'clear' && sl.text) { hit.src.text = sl.text; hit.src.c = 'clear'; }
      } else if ((sl.text || '').trim() && sl.c !== 'unreadable') {
        // seen only up close - real writing the whole-page pass missed
        extras.push({ src: sl, page: result.page, box, fromCloseup: true });
      }
    }
  }
  const lines = [];
  for (const b of base) {
    const line = makeLine(b.src, hist);
    line.page = result.page; line.box = b.box;
    if (b.qtyConflict != null) {
      line.qty = null; line.readConf = 'unsure';
      line.note = 'One pass read the quantity as ' + b.src.qty + ' and another as ' + b.qtyConflict + ' — type the right one.';
      line.state = tierFor(line);
    }
    lines.push(line);
  }
  for (const ex of extras) {
    const line = makeLine(ex.src, hist);
    line.page = ex.page; line.box = ex.box;
    line.closeupOnly = true;
    if (line.state === 'OK') { line.state = 'REVIEW'; }   // never auto-confirm a line only one pass saw
    lines.push(line);
  }
  // order down the page
  lines.sort((a, b2) => (midY(a.box) ?? 2) - (midY(b2.box) ?? 2));

  // completeness: every handwriting band must end up with an outcome.
  // Customer details (shop name, phone...) already cover their own bands.
  const page = ORDER.pages[result.page];
  const custBoxes = [];
  if (result.full.customer) for (const k in result.full.customer) {
    const f = result.full.customer[k];
    if (f && f.v && f.box && (f.page == null || f.page === 0)) custBoxes.push(f.box);
  }
  for (const [y0, y1] of (page.bands || [])) {
    if (y1 - y0 < 0.014) continue;
    const covered = lines.some(l => { const my = midY(l.box); return my != null && my >= y0 - 0.02 && my <= y1 + 0.02; })
      || custBoxes.some(b => { const my = (b[1] + b[3]) / 2; return my >= y0 - 0.02 && my <= y1 + 0.02; });
    if (!covered) {
      const ph = makeLine({ raw: '', text: '', c: 'unreadable', kind: 'item' }, hist);
      ph.page = result.page; ph.box = [0.02, y0, 0.98, y1];
      ph.note = 'Writing was seen here but could not be read. Tap the strip, then type it or leave it blank.';
      lines.push(ph);
    }
  }
  lines.sort((a, b2) => (midY(a.box) ?? 2) - (midY(b2.box) ?? 2));
  page.failedSections = result.sections.filter(x => !x.ok).map(x => x.rect);
  return { lines, customer: result.full.customer || null, totals: result.full.totals || null,
    unreadable: result.full.unreadable_regions || [], service: result.full.service };
}

async function readPages() {
  const usable = ORDER.pages.filter(p => p.state === 'ready' || p.state === 'duplicate');
  if (!usable.length) { alert('Add a photograph of the order first.'); return; }
  readError = ''; ORDER.busy = true; setStage('reading'); render();
  try {
    const hist = historyFor(ORDER.customer.name);
    ORDER.lines = []; ORDER.read = { fields: {}, unreadable: [] }; ORDER.writtenTotal = null;
    let service = '';
    for (let i = 0; i < ORDER.pages.length; i++) {
      const page = ORDER.pages[i];
      if (!(page.state === 'ready' || page.state === 'duplicate')) continue;
      const result = await readOnePage(i);
      setStage('matching'); setDetail('Page ' + (i + 1) + ' — matching products');
      const merged = mergePage(result, hist);
      service = merged.service || service;
      // customer: first page that says anything wins each field
      if (merged.customer) {
        for (const k of ['shop', 'trading', 'contact', 'phone', 'address', 'area', 'date', 'rep', 'note']) {
          const f = merged.customer[k];
          if (f && f.v && !(ORDER.read.fields[k] && ORDER.read.fields[k].v))
            ORDER.read.fields[k] = { v: f.v, c: f.c || '', box: f.box || null, page: i };
        }
      }
      if (merged.totals && merged.totals.grand != null && ORDER.writtenTotal == null)
        ORDER.writtenTotal = Math.round(merged.totals.grand * 100);
      ORDER.read.unreadable.push(...(merged.unreadable || []));
      ORDER.lines.push(...merged.lines);
      render(); await new Promise(r => setTimeout(r, 0));   // lines appear page by page
    }
    ['shop', 'trading', 'contact', 'phone', 'address', 'area', 'date', 'rep', 'note']
      .forEach(k => { if (!ORDER.read.fields[k]) ORDER.read.fields[k] = { v: '', c: '', box: null, page: 0 }; });
    ORDER.readService = service || 'reading service';
    ORDER.readAt = new Date().toISOString();
    ORDER.custChoices = matchCustomerFromPage(ORDER.read.fields);
    const C = ORDER.customer, F = ORDER.read.fields;
    if (!C.name && F.shop.v && F.shop.c !== 'unreadable') C.name = F.shop.v;
    if (!C.trading && F.trading.v) C.trading = F.trading.v;
    if (!C.contact && F.contact.v) C.contact = F.contact.v;
    if (!C.phone && F.phone.v) C.phone = F.phone.v;
    if (!C.address && F.address.v) C.address = F.address.v;
    if (!C.area && F.area.v) C.area = F.area.v;
    if (F.note.v && (ORDER.notes || '').indexOf(F.note.v) < 0)
      ORDER.notes = (ORDER.notes ? ORDER.notes + '\n' : '') + F.note.v;
    if (F.rep.v && !ORDER.rep) ORDER.rep = F.rep.v;
    snapshotLines();
    ORDER.busy = false; setStage(''); setDetail(''); VIEW.sub = 'review'; render(); touch();
  } catch (e) {
    ORDER.busy = false; setStage(''); setDetail('');
    const msg = String(e.message || e);
    readError = !navigator.onLine
      ? 'No internet. The photograph and everything typed so far are saved on this phone. Tap Read the order again when you have signal — nothing is lost. You can build this order by hand right now.'
      : msg === 'busy' ? 'The reading service is busy right now. Wait a moment and tap Read the order again — your photograph is saved.'
      : msg;
    render(); touch();
  }
}

/* retry only the close-up sections that failed on a page */
async function retrySections(pageIdx) {
  const page = ORDER.pages[pageIdx];
  if (!page || !(page.failedSections || []).length) return;
  const rec = await idb.get('photos', page.id);
  if (!rec) return alert('That photograph is no longer on this phone.');
  ORDER.busy = true; setStage('reading'); render();
  const hist = historyFor(ORDER.customer.name);
  const still = [];
  for (let i = 0; i < page.failedSections.length; i++) {
    const rect = page.failedSections[i];
    setDetail('Close-up ' + (i + 1) + ' of ' + page.failedSections.length + ' — trying again');
    try {
      const { tiles } = await makeTiles(rec.enhanced, { x0: rect.x0, y0: rect.y0, x1: rect.x1, y1: rect.y1 });
      const r = await callReader([await blobToB64(tiles[0] ? tiles[0].blob : rec.enhanced)], 'section');
      for (const sl of (r.lines || [])) {
        const box = sectionBox(sl.box, rect);
        const my = midY(box);
        const dupe = ORDER.lines.some(l => l.page === pageIdx && ((midY(l.box) != null && my != null && Math.abs(midY(l.box) - my) < 0.03) || textSim(sl.text || '', l.text) >= 0.72));
        if (!dupe && (sl.text || '').trim()) {
          const line = makeLine(sl, hist);
          line.page = pageIdx; line.box = box; line.closeupOnly = true;
          if (line.state === 'OK') line.state = 'REVIEW';
          ORDER.lines.push(line);
        }
      }
    } catch (e) { still.push(rect); }
  }
  page.failedSections = still;
  ORDER.lines.sort((a, b) => (a.page - b.page) || ((midY(a.box) ?? 2) - (midY(b.box) ?? 2)));
  ORDER.busy = false; setStage(''); setDetail(''); snapshotLines(); render(); touch();
}

function makeLine(l, hist) {
  const line = {
    id: 'l' + Math.random().toString(36).slice(2, 8),
    raw: l.raw || '', text: l.text || '',
    qty: (typeof l.qty === 'number' && l.qty > 0) ? l.qty : null,
    unitWritten: l.unit_written || '',
    unit: UNIT_WORDS[norm(l.unit_written || '')] || 'piece',
    maybePrice: l.possible_price != null ? l.possible_price : null,
    pageCompany: (l.company === 'YOL' || l.company === 'MYCO') ? l.company : '',
    kind: l.kind === 'assortment' ? 'assortment' : 'item',
    ditto: !!l.ditto, grouped: !!l.grouped, readConf: l.c || 'unsure',
    page: l.page != null ? l.page : 0, box: l.box || null,
    note: l.note || '',
    sku: null, co: '', name: '', priceC: 0, priceSrc: 'none', discC: 0,
    blank: false, custom: false, cands: [],
  };
  // Readers sometimes leave the quantity inside the text. Pull an obvious
  // leading "6 -" or trailing "- 6" into qty when qty is missing, so the words
  // that reach the matcher are the product words alone.
  let m;
  if (line.qty == null && (m = line.text.match(/^\s*(\d{1,3})\s*[-\u2013.]?\s+(.{3,})$/)))
    { line.qty = +m[1]; line.text = m[2]; }
  else if (line.qty == null && (m = line.text.match(/^(.{3,}?)\s*[-\u2013]\s*(\d{1,3})\s*(ps|pcs)?\s*$/i)))
    { line.qty = +m[2]; line.text = m[1]; }
  else if (line.qty != null && (m = line.text.match(/^\s*(\d{1,3})\s*[-\u2013.]?\s+(.{3,})$/)) && +m[1] === line.qty)
    line.text = m[2];
  line.cands = searchProducts(line.text, { history: hist, limit: 3 });
  line.state = tierFor(line);
  if (line.state === 'OK') applyProduct(line, line.cands[0].key, true);
  return line;
}

/* Choosing a product fills in the Lightspeed name, company, barcode and price.
   The price is labelled by where it came from and never guessed. */
function applyProduct(line, key, silent) {
  const p = productByKey(key);
  if (!p) return;
  line.sku = p.sku; line.co = p.co; line.name = p.n; line.custom = false;
  if (p.price > 0) {
    const useCase = (line.unit === 'case' || line.unit === 'carton') && p.cp > 0;
    line.priceC = Math.round((useCase ? p.cp : p.price) * 100);
    line.priceSrc = p.pl ? 'list' : 'lightspeed';   // poster price list vs Lightspeed
  } else { line.priceC = 0; line.priceSrc = 'none'; }
  if ((line.unit === 'case' || line.unit === 'carton') && !p.cp) line.unit = 'piece';
  line.state = companyProblem(line) ? 'COMPANY' : tierFor(line);
  if (!silent) {
    const k = keyToks(line.text).join(' ');
    if (k) { fixes[k] = { sku: p.sku, co: p.co, n: p.n, at: todayISO(), rep: ORDER.rep || settings.rep || '' }; SAVE('fixes', fixes); }
    const rk = p.co + '|' + p.sku;
    const at = recents.indexOf(rk); if (at >= 0) recents.splice(at, 1);
    recents.unshift(rk); if (recents.length > 40) recents.length = 40; SAVE('recents', recents);
  }
}

/* ---------------- undo / redo (line list snapshots, capped) ---------------- */
let UNDO = [], REDO = [];
function snapshotLines() {
  try { UNDO.push(JSON.stringify(ORDER.lines)); if (UNDO.length > 25) UNDO.shift(); REDO = []; } catch (_) {}
}

  if (UNDO.length < 2) return;
  REDO.push(UNDO.pop());
  ORDER.lines = JSON.parse(UNDO[UNDO.length - 1]);
  touch(); render();
}
function redoLines() {
  if (!REDO.length) return;
  const s2 = REDO.pop(); UNDO.push(s2);
  ORDER.lines = JSON.parse(s2);

const lineTotal = l => l.blank ? 0 : Math.max(0, (l.qty || 0) * l.priceC - (l.discC || 0));

  const t = { YOL: 0, MYCO: 0, other: 0, units: 0, disc: 0 };
  for (const l of ORDER.lines) {
    if (l.blank) continue;
    const v = lineTotal(l);
    if (l.co === 'YOL') t.YOL += v; else if (l.co === 'MYCO') t.MYCO += v; else t.other += v;
    t.units += l.qty || 0; t.disc += l.discC || 0;

/* ------------------------------------------------- duplicate protection -- */
function duplicateWarning() {
  const mine = ORDER.lines.filter(l => !l.blank && l.sku);
  const sig = mine.map(l => l.co + l.sku + 'x' + l.qty).sort().join(',');
  const units = mine.reduce((a, l) => a + (l.qty || 0), 0);
  const myHashes = ORDER.pages.map(p => p.hash).filter(Boolean);
  for (const id in orders) {
    const o = orders[id];
    if (o.id === ORDER.id || !(o.lines || []).length) continue;
    if (norm((o.customer || {}).name || '') !== norm(ORDER.customer.name || '')) continue;
    const days = Math.abs((new Date(o.date) - new Date(ORDER.date)) / 86400000);
    if (!(days <= 14)) continue;
    const theirs = o.lines.filter(l => !l.blank && l.sku).map(l => l.co + l.sku + 'x' + l.qty).sort().join(',');
    const theirUnits = o.lines.reduce((a, l) => a + (l.qty || 0), 0);
    const samePhoto = (o.pages || []).some(p => p.hash && myHashes.some(h =>
      h.split('').filter((ch, i) => ch !== p.hash[i]).length <= 4));
    if (theirs === sig || samePhoto || (mine.length === o.lines.length && Math.abs(theirUnits - units) <= 1))
      return (o.no ? 'Order ' + o.no : 'A draft') + ' for ' + (o.customer.name || 'this shop') + ' dated ' + o.date +
        ' has ' + (samePhoto ? 'the same photograph' : theirs === sig ? 'exactly the same products and quantities'
          : 'the same number of products and almost the same units') + '.';
  }
  return '';
}

function nextOrderNo() {
  if (ORDER.no) return ORDER.no;

}

/* The strip shows the exact writing a line came from: the page image scaled so
   the line's own box fills the strip width, vertically centred on the line. */
function cropHTML(line) {
  const p = ORDER.pages[line.page || 0];
  if (!line.box || !p || !p.w) return '';

  const red = !l.blank && (l.state === 'UNREAD' || l.state === 'NOTFOUND' || clash || noQty);
  const amber = !l.blank && !red && (l.state === 'REVIEW' || l.state === 'ASSORT' || l.ditto || l.readConf === 'unsure');
  const cls = l.blank ? 'blank' : red ? 'bad' : amber ? 'review' : 'ok';
  const stateLabel = clash ? STATE.COMPANY : noQty && l.state !== 'UNREAD' ? 'QUANTITY UNCLEAR' : STATE[l.state] || '';
  const p = l.sku ? productOf(l) : null;
  return `<div class="line ${cls}" data-line="${l.id}">
    <div class="line-head">
      <span class="idx">${i + 1}</span>
      <span class="tag ${l.blank ? 'plain' : red ? 'bad' : amber ? 'review' : 'ok'}">
        ${red ? ico('alert') : amber ? '' : l.blank ? '' : ico('check')} ${esc(stateLabel)}</span>
      ${l.ditto ? '<span class="tag review">Ditto — taken from the line above</span>' : ''}
      ${l.grouped ? '<span class="tag review">Shared quantity</span>' : ''}
      ${l.readConf === 'unsure' && l.state !== 'UNREAD' ? '<span class="tag review">Handwriting unsure</span>' : ''}
      ${l.blank ? '<span class="tag plain">Left blank by you</span>' : ''}
      <button class="btn quiet sm" style="margin-left:auto;min-height:36px" data-dropline="${l.id}" aria-label="Remove line ${i + 1}">${ico('x')}</button>
    </div>
    ${cropHTML(l)}
    ${l.raw ? `<p class="hint" style="margin:0 0 var(--s2)">As written: <i>${esc(l.raw)}</i></p>` : ''}
    ${l.note ? `<p class="hint" style="color:var(--tang-2);margin:0 0 var(--s2)">${esc(l.note)}</p>` : ''}
    ${l.closeupOnly ? `<p class="hint" style="margin:0 0 var(--s2)">Found by the close-up pass — the whole-page pass missed it, so please confirm it.</p>` : ''}
    ${l.maybePrice != null ? `<p class="hint" style="color:var(--brick-2)">A number here may be a price, not a quantity: ${esc(String(l.maybePrice))}. Nothing was assumed.</p>` : ''}
    <label class="field"><span class="sr">What the line says</span>
      <input value="${esc(l.text)}" data-text="${l.id}" placeholder="What the line says"></label>
    <div class="qty-row">
      <div class="stepper">
        <button data-qty="${l.id}" data-d="-1" aria-label="One fewer">−</button>
        <input class="num" type="number" inputmode="numeric" min="1" value="${l.qty != null ? l.qty : ''}" placeholder="?" data-setqty="${l.id}" aria-label="Quantity">
        <button data-qty="${l.id}" data-d="1" aria-label="One more">+</button>
      </div>
      <select data-unit="${l.id}" aria-label="Unit" style="flex:1 1 130px;min-width:120px">
        ${['piece', 'pack', 'case', 'carton'].map(u => `<option value="${u}"${l.unit === u ? ' selected' : ''}>${UNIT_LABEL[u]}</option>`).join('')}
      </select>
      ${l.unitWritten ? `<span class="hint">written “${esc(l.unitWritten)}”</span>` : ''}
      ${l.pageCompany ? `<span class="tag plain">${l.pageCompany} written on the page</span>` : ''}
    </div>
    ${priceHTML(l)}
    ${clash ? `<p class="hint" style="color:var(--brick-2)">The page says ${esc(l.pageCompany || 'a MYCO brand')} but the product chosen belongs to ${esc(p ? p.co : '')}. Dr. Herbician, VI John, Floraura and TAILS &amp; TREAT are MYCO Global Distributors and never go under Yusuf Overseas.</p>` : ''}
    ${l.state === 'ASSORT' ? `<p class="hint" style="color:var(--tang-2)">A mixed or assorted case, not one product. Choose the products yourself, or leave it blank and it goes on the order as a note for the office.</p>` : ''}
    <div class="cands">${(l.cands || []).map(c => `<button class="cand" data-pick="${l.id}" data-key="${c.key}" aria-pressed="${l.sku === c.p.sku && l.co === c.p.co}">
      <span class="nm">${esc(c.p.n)}</span>
      <span class="sub">${c.p.co} · ${esc(c.p.sku)} · ${c.p.price > 0 ? money(Math.round(c.p.price * 100)) : 'price needed'}${c.p.cp ? ' · case of ' + c.p.cs + ' ' + money(Math.round(c.p.cp * 100)) : ''}</span>
      <span class="sub">${c.learned ? 'Remembered from your last correction — still confirm it' : c.score + '% · ' + esc(c.why)}</span>
    </button>`).join('') || '<p class="hint">Nothing in the catalogue looks like this line.</p>'}</div>
    <div class="btn-row" style="margin-top:var(--s2)">
      <button class="btn quiet sm" data-find="${l.id}">${ico('search')} Search catalogue</button>
      <button class="btn quiet sm" data-manualprod="${l.id}">Type the product</button>
      <button class="btn quiet sm" data-blank="${l.id}">${l.blank ? 'Put this line back' : 'Leave blank — confirmed by me'}</button>
    </div>
  </div>`;
}

function priceHTML(l) {
  const label = l.priceSrc === 'lightspeed' ? '<span class="tag ok">Lightspeed price</span>'
    : l.priceSrc === 'list' ? '<span class="tag ok">Price list price</span>'
    : l.priceSrc === 'manual' ? '<span class="tag review">Manual price</span>'
    : '<span class="tag bad">Price needed</span>';
  const p = l.sku ? productOf(l) : null;
  return `<div class="qty-row">
    ${label}
    <button class="btn quiet sm" data-price="${l.id}">${l.priceC > 0 ? money(l.priceC) : 'Enter price'}</button>
    ${l.discC ? `<span class="hint">less ${money(l.discC)}</span>` : ''}
    <button class="btn quiet sm" data-disc="${l.id}">Discount</button>
    <span class="grow" style="text-align:right"><b class="money">${money(lineTotal(l))}</b></span>
    ${p && p.stock != null ? `<span class="hint" style="flex-basis:100%">${p.stock} in stock at the snapshot of ${esc(SNAPSHOT)} — not live</span>` : ''}
  </div>`;
}

function cartHTML() {

    if (co) bits.push(`<div class="eyebrow" style="margin-top:var(--s3)">${co === 'YOL' ? 'Yusuf Overseas Ltd' : 'MYCO Global Distributors Ltd'}</div>`);
    for (const l of ls) {
      bits.push(`<div class="row" data-line="${l.id}" style="cursor:default">
        <span class="grow"><span class="nm">${esc(l.name || l.text)}</span>
        <span class="sub">${l.custom ? 'Not in the catalogue' : esc(l.sku)} · ${UNIT_LABEL[l.unit]} ·
          ${l.priceC > 0 ? money(l.priceC) + (l.priceSrc === 'manual' ? ' (manual)' : '') : '<b style="color:var(--brick-2)">price needed</b>'}</span></span>
        <span class="stepper" style="flex:0 0 auto">
          <button data-qty="${l.id}" data-d="-1" aria-label="One fewer">−</button>
          <input class="num" type="number" inputmode="numeric" min="0" value="${l.qty || 0}" data-setqty="${l.id}" aria-label="Quantity" style="width:52px">
          <button data-qty="${l.id}" data-d="1" aria-label="One more">+</button>
        </span>
        <b class="money" style="min-width:74px;text-align:right">${money(lineTotal(l))}</b>
        <span style="display:flex;flex-direction:column;gap:2px">
          <button class="btn quiet sm" style="min-height:32px;padding:0 8px" data-move="${l.id}" data-d="-1" aria-label="Move up">↑</button>
          <button class="btn quiet sm" style="min-height:32px;padding:0 8px" data-move="${l.id}" data-d="1" aria-label="Move down">↓</button>
        </span>
        <span style="display:flex;flex-direction:column;gap:2px">
          <button class="btn quiet sm" style="min-height:32px;padding:0 8px" data-dupline="${l.id}" aria-label="Duplicate">${ico('copy')}</button>
          <button class="btn quiet sm" style="min-height:32px;padding:0 8px" data-dropline="${l.id}" aria-label="Delete">${ico('trash')}</button>
        </span>
      </div>`);
    }
  }
  const also = ORDER.customer.name ? alsoBought(ORDER.customer.name, new Set(ORDER.lines.map(l => l.co + '|' + l.sku))) : [];

  return bits.join('');
}

/* text summary for WhatsApp / copy / email */
function orderText() {
  const T0 = totals(), C = ORDER.customer;
  let t = 'SALES ORDER ' + nextOrderNo() + ' — ' + (C.name || '') + ' — ' + ORDER.date + '\n';
  if (C.trading && norm(C.trading) !== norm(C.name)) t += 'Trading as: ' + C.trading + '\n';
  if (C.contact) t += 'Contact: ' + C.contact + '\n';
  if (telFmt(C.phone)) t += 'Phone: ' + telFmt(C.phone) + '\n';
  if (ORDER.rep || settings.rep) t += 'Rep: ' + (ORDER.rep || settings.rep) + '\n';
  t += '\n';
  for (const co of ['YOL', 'MYCO', '']) {
    const ls = ORDER.lines.filter(l => !l.blank && (l.co || '') === co && l.qty > 0);
    if (!ls.length) continue;
    t += (co === 'YOL' ? 'YUSUF OVERSEAS LTD' : co === 'MYCO' ? 'MYCO GLOBAL DISTRIBUTORS LTD' : 'OTHER') + '\n';
    ls.forEach((l, i) => {
      t += (i + 1) + '. ' + (l.name || l.text) + '  x' + l.qty + ' ' + UNIT_LABEL[l.unit].toLowerCase() +
        (l.priceC > 0 ? ' @ ' + money(l.priceC) : ' @ PRICE NEEDED') +
        (l.discC ? ' less ' + money(l.discC) : '') + ' = ' + money(lineTotal(l)) + '\n';
    });
    if (co) t += 'Subtotal: ' + money(T0[co]) + '\n';
    t += '\n';
  }
  t += 'TOTAL: ' + money(T0.all) + ' TTD\n';
  if (ORDER.notes) t += 'Notes: ' + ORDER.notes + '\n';
  if (ORDER.delivery) t += 'Delivery: ' + ORDER.delivery + '\n';
  t += '\nSales order — stock, price and delivery subject to final office confirmation.';
  return t;
}

let ORDQ = '', CUSTTABQ = '', PRODTABQ = '';

function vOrders() {

    .filter(o => (o.lines || []).length || (o.pages || []).length)
    .sort((a, b) => (b.created || '').localeCompare(a.created || ''));
  const q = norm(ORDQ);

  return `<div class="screen">

function backupFile() {
  const data = { app: 'billmaker', ver: APP_VER, at: new Date().toISOString(),
    orders, fixes, favs, recents, manualProducts, settings, seq: LS('seq', 0) };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'billmaker-backup-' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function restoreFrom(text) {
  let d;
  try { d = JSON.parse(text); } catch (_) { alert('That file is not a Bill Maker backup.'); return; }
  if (d.app !== 'billmaker' || !d.orders) { alert('That file is not a Bill Maker backup.'); return; }
  let added = 0;
  for (const id in d.orders) if (!orders[id]) { orders[id] = d.orders[id]; added++; }
  for (const k in d.fixes || {}) if (!fixes[k]) fixes[k] = d.fixes[k];
  for (const k in d.favs || {}) favs[k] = 1;
  (d.manualProducts || []).forEach(m => { if (!manualProducts.some(x => x.n === m.n)) manualProducts.push(m); });
  if ((d.seq | 0) > (LS('seq', 0) | 0)) SAVE('seq', d.seq | 0);
  SAVE('orders', orders); SAVE('fixes', fixes); SAVE('favs', favs); SAVE('manualprods', manualProducts);
  alert('Restored. ' + added + ' order' + (added === 1 ? '' : 's') + ' added; nothing was deleted or overwritten.');
  render();
}

async function openViewer(page, box) {
  VIEW.viewer = { page, box: box || null, which: 'clean', urls: null, k: 0 };
  render();
  const rec = await idb.get('photos', ORDER.pages[page].id);
  if (!rec) { VIEW.viewer = null; render(); alert('That photograph is no longer stored on this phone.'); return; }
  VIEW.viewer.urls = { orig: URL.createObjectURL(rec.original), clean: URL.createObjectURL(rec.enhanced || rec.color) };
  paintViewer();
}
function viewerFit(mode) {
  const v = VIEW.viewer, img = document.getElementById('vimg'), pane = document.getElementById('vpane');
  if (!v || !img || !img.naturalWidth) return;
  const fitK = Math.min(pane.clientWidth / img.naturalWidth, pane.clientHeight / img.naturalHeight);
  v.k = mode === 'actual' ? 1 : mode === 'zoom' ? Math.max(fitK * 2.4, 1) : fitK;
  img.style.width = (img.naturalWidth * v.k) + 'px';
  img.style.height = 'auto';
}
function paintViewer() {
  const v = VIEW.viewer; if (!v || !v.urls) return;
  const img = document.getElementById('vimg'), pane = document.getElementById('vpane');
  if (!img) return;
  img.src = v.which === 'orig' ? v.urls.orig : v.urls.clean;
  img.onload = () => {
    viewerFit(v.box ? 'zoom' : 'fit');                 // a tapped line opens zoomed on that spot
    if (v.box) {
      const bx = (v.box[0] + v.box[2]) / 2, by = (v.box[1] + v.box[3]) / 2;
      pane.scrollLeft = bx * img.naturalWidth * v.k - pane.clientWidth / 2;
      pane.scrollTop = by * img.naturalHeight * v.k - pane.clientHeight / 2;
    }
    wireViewerGestures();
  };
}
function wireViewerGestures() {
  const pane = document.getElementById('vpane'), img = document.getElementById('vimg');
  if (!pane || pane.__wired) return;
  pane.__wired = true;
  const pts = new Map();
  let startDist = 0, startK = 0, cx = 0, cy = 0;
  pane.addEventListener('pointerdown', e => { pts.set(e.pointerId, e); pane.setPointerCapture(e.pointerId);
    if (pts.size === 2) { const [a, b] = [...pts.values()];
      startDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      startK = VIEW.viewer.k; cx = (a.clientX + b.clientX) / 2; cy = (a.clientY + b.clientY) / 2; } });
  pane.addEventListener('pointermove', e => { if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, e);
    if (pts.size === 2 && startDist) { const [a, b] = [...pts.values()];
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const v = VIEW.viewer, oldK = v.k;
      v.k = Math.min(4, Math.max(0.05, startK * d / startDist));
      img.style.width = (img.naturalWidth * v.k) + 'px';
      const rx = (pane.scrollLeft + cx) / oldK, ry = (pane.scrollTop + cy) / oldK;
      pane.scrollLeft = rx * v.k - cx; pane.scrollTop = ry * v.k - cy;
    } else if (pts.size === 1) {
      pane.scrollLeft -= e.clientX - prev.clientX;
      pane.scrollTop -= e.clientY - prev.clientY;
    } });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) startDist = 0; };
  pane.addEventListener('pointerup', up); pane.addEventListener('pointercancel', up);
  pane.addEventListener('dblclick', () => { const v = VIEW.viewer;
    viewerFit(v.k <= Math.min(pane.clientWidth / img.naturalWidth, pane.clientHeight / img.naturalHeight) + 0.001 ? 'actual' : 'fit'); });
}
function closeViewer() {
  const v = VIEW.viewer;
  if (v && v.urls) { URL.revokeObjectURL(v.urls.orig); URL.revokeObjectURL(v.urls.clean); }
  VIEW.viewer = null; render();
}

function wireCropEditor() {
  const wrap = document.getElementById('cropwrap');
  if (!wrap || wrap.__wired) return;
  wrap.__wired = true;
  const box = document.getElementById('cropbox');
  let drag = null;
  const frac = e => { const b = wrap.getBoundingClientRect();
    return [Math.min(1, Math.max(0, (e.clientX - b.left) / b.width)),
            Math.min(1, Math.max(0, (e.clientY - b.top) / b.height))]; };
  wrap.addEventListener('pointerdown', e => { const h = e.target.dataset && e.target.dataset.h;
    if (h) { drag = h; wrap.setPointerCapture(e.pointerId); e.preventDefault(); } });
  wrap.addEventListener('pointermove', e => { if (!drag) return;
    const [x, y] = frac(e), r = VIEW.cropEdit.rect;
    if (drag.includes('w')) r.x0 = Math.min(x, r.x1 - 0.05); else r.x1 = Math.max(x, r.x0 + 0.05);
    if (drag.includes('n')) r.y0 = Math.min(y, r.y1 - 0.05); else r.y1 = Math.max(y, r.y0 + 0.05);
    box.style.left = r.x0 * 100 + '%'; box.style.top = r.y0 * 100 + '%';
    box.style.width = (r.x1 - r.x0) * 100 + '%'; box.style.height = (r.y1 - r.y0) * 100 + '%'; });
  const up = () => { drag = null; };
  wrap.addEventListener('pointerup', up); wrap.addEventListener('pointercancel', up);
}

  keep(document.getElementById('custq'), deb(v => paintCustResults(v), 70));
  keep(document.getElementById('ordq'), deb(v => { ORDQ = v; const el = document.getElementById('ordq'); const p = el.selectionStart; render(); const e2 = document.getElementById('ordq'); if (e2) { e2.focus(); e2.setSelectionRange(p, p); } }, 200));
  keep(document.getElementById('custtabq'), deb(v => { CUSTTABQ = v; const p = document.getElementById('custtabq').selectionStart; render(); const e2 = document.getElementById('custtabq'); if (e2) { e2.focus(); e2.setSelectionRange(p, p); } }, 150));

function lineById(id) { return ORDER.lines.find(l => l.id === id); }
function refreshLine(l) { l.state = companyProblem(l) ? 'COMPANY' : tierFor(l); }

function addProduct(key, asCase) {
  const p = productByKey(key); if (!p) return;
  buzz(settings.haptics ? 9 : 0);
  let l = ORDER.lines.find(x => x.sku === p.sku && x.co === p.co && !x.blank && (asCase ? x.unit === 'case' : x.unit !== 'case'));
  if (!l) {
    l = makeLine({ raw: '', text: p.n, qty: 0, c: 'clear', kind: 'item' }, null);
    l.cands = [{ key, p, score: 99, why: 'chosen by you' }];
    applyProduct(l, key, true);
    l.unit = asCase && p.cp ? 'case' : 'piece';
    if (l.unit === 'case') { l.priceC = Math.round(p.cp * 100); }
    l.state = 'OK';
    ORDER.lines.push(l);
  }
  l.qty = (l.qty || 0) + 1;
  const rk = key, at = recents.indexOf(rk);
  if (at >= 0) recents.splice(at, 1);
  recents.unshift(rk); if (recents.length > 40) recents.length = 40;
  SAVE('recents', recents);
  touch(); render();
}

async function scanBarcode() {
  if (!('BarcodeDetector' in window)) {
    alert('This browser cannot scan barcodes with the camera.\n\nType the last digits of the barcode into the search box instead — search already reads barcodes.');
    return;
  }
  try {
    const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
    const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = document.createElement('video');
    v.srcObject = st; v.playsInline = true; await v.play();
    const stop = () => { st.getTracks().forEach(t => t.stop()); v.remove(); };
    const t0 = Date.now();
    while (Date.now() - t0 < 15000) {
      const codes = await det.detect(v).catch(() => []);
      if (codes.length) {
        const code = codes[0].rawValue; stop();
        const hit = PROD.find(p => p.sku === code);
        if (hit) { addProduct(hit.co + '|' + hit.sku); }
        else { SEARCHQ = code; render(); alert('Barcode ' + code + ' is not in the catalogue snapshot.'); }
        return;
      }
      await new Promise(r => setTimeout(r, 170));
    }
    stop(); alert('No barcode seen. Try again, or type the digits into the search box.');
  } catch (e) { alert('The camera could not be opened: ' + (e.message || e)); }
}

function customProduct(forLineId) {
  const n = prompt('Product name, exactly as the customer asked for it:');
  if (!n || !n.trim()) return;
  const co = prompt('Which company supplies it — type YOL or MYCO:', 'YOL');
  if (co === null) return;
  const CO = String(co).trim().toUpperCase();
  if (CO !== 'YOL' && CO !== 'MYCO') { alert('Type YOL or MYCO. If unsure, ask the office before it goes on the order.'); return; }
  const priceS = prompt('Price in TT$ if you know it — leave empty for PRICE NEEDED:', '');
  const priceC = priceS && !isNaN(parseFloat(priceS)) ? Math.round(parseFloat(priceS) * 100) : 0;
  let l = forLineId ? lineById(forLineId) : null;
  if (!l) {
    l = makeLine({ raw: '', text: n.trim(), qty: 1, c: 'clear', kind: 'item' }, null);
    ORDER.lines.push(l);
  }
  Object.assign(l, { custom: true, sku: null, name: n.trim(), co: CO,
    priceC, priceSrc: priceC ? 'manual' : 'none', state: 'OK', cands: [], blank: false });
  if (!(l.qty > 0)) l.qty = 1;
  if (confirm('Keep "' + n.trim() + '" as a reusable product for future orders?\n\nOK keeps it. Cancel uses it for this order only.')) {
    manualProducts.push({ n: n.trim(), co: CO, priceC });
    SAVE('manualprods', manualProducts);
  }
  touch(); render();
}

function acceptReview() {
  const C = reviewCounts();
  if (C.open) { alert(C.open + ' line' + (C.open === 1 ? '' : 's') + ' still need' + (C.open === 1 ? 's' : '') + ' you.\n\nFix each brick-red line, or mark it "Leave blank — confirmed by me".'); return; }
  const dup = duplicateWarning();
  if (dup && !confirm('POSSIBLE DUPLICATE ORDER — CHECK BEFORE SAVING\n\n' + dup + '\n\nKeep this order anyway?')) return;
  const notes = [];
  for (const l of ORDER.lines) {
    if (l.blank) notes.push((l.kind === 'assortment' ? 'MIXED CASE — office to choose the assortment: ' : 'LEFT BLANK, CONFIRMED BY REP: ') + (l.raw || l.text));
  }
  if (notes.length) {
    const existing = ORDER.notes || '';
    for (const n of notes) if (existing.indexOf(n) < 0) ORDER.notes = (ORDER.notes ? ORDER.notes + '\n' : '') + n;
  }
  ORDER.reviewed = todayISO();
  VIEW.sub = 'manual';
  touch(); render();
}

async function forgetPhotos() {
  if (!confirm('Delete the photograph from this phone?\n\nThe order lines stay. Only do this once the PDF is saved.')) return;
  for (const p of ORDER.pages) { await idb.del('photos', p.id); if (p.thumbUrl) URL.revokeObjectURL(p.thumbUrl); }
