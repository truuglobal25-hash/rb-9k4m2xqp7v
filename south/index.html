<style>

// Start pulling the book straight away, so by the time the password is typed it
// is usually already on the phone and opening feels instant.
let blobP=Promise.resolve((()=>{const s=atob(B64);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;})());
async function open_(pw){
  const buf=new Uint8Array(await blobP);
  const salt=buf.slice(0,16), nonce=buf.slice(16,28), body=buf.slice(28);
  const kd=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},
    kd,{name:'AES-GCM',length:256},false,['decrypt']);
  const packed=await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce},k,body);
  if(typeof DecompressionStream==='undefined')
    throw new Error('This phone is too old to open the book. Update iOS or Android.');
  const html=await new Response(
    new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  try{ localStorage.setItem('rb_pw', pw); }catch(_){}   // so it opens straight up next time
  document.open(); document.write(html); document.close();
}
async function tryOpen(pw){
  const e=document.getElementById('e');
  e.textContent='Opening...';
  try{ await open_(pw); }
  catch(err){ e.textContent=/too old/.test(err.message)?err.message:'Wrong password';
               }
}
document.getElementById('go').onclick=()=>tryOpen(document.getElementById('p').value);
document.getElementById('p').addEventListener('keydown',ev=>{if(ev.key==='Enter')tryOpen(ev.target.value)});
// remembered on this phone, so it does not ask every morning
(async()=>{ let s=null; try{ s=localStorage.getItem('rb_pw'); }catch(_){}
  if(s){ try{ await open_(s); }catch(_){ try{localStorage.removeItem('rb_pw');}catch(_){}
         document.getElementById('p').focus(); } }
  else { document.getElementById('p').focus(); } })();

let W,H,P=[];const N=90;
function fit(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio}
fit();addEventListener('resize',fit);
for(let i=0;i<N;i++)P.push({x:Math.random(),y:Math.random(),z:Math.random()*0.9+0.1});
let tx=0,ty=0;
addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5);ty=(e.clientY/innerHeight-.5)});

const box=document.getElementById('box');
let stop=false;
function frame(){
  if(stop||!document.getElementById('fx'))return;
  x.clearRect(0,0,W,H);
  for(const p of P){
    p.y-=0.0006*p.z; if(p.y<0){p.y=1;p.x=Math.random()}

  }
  if(box) box.style.transform='perspective(900px) rotateY('+(tx*7)+'deg) rotateX('+(-ty*7)+'deg)';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
